<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – HaytiClips</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
}

.header{
  padding:20px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  border-bottom:2px solid #ff0050;
}

.header-left{
position:absolute;
left:15px;
font-size:22px;
cursor:pointer;
}

.stats{
  display:flex;
  justify-content:space-around;
  padding:20px;
  background:#111;
}

.stat-box{
  text-align:center;
}

.stat-box strong{
  font-size:22px;
  color:#ff0050;
}

.search{
  padding:15px;
}

.search input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
}

.user-list{
  padding:10px;
}

.user-card{
  background:#111;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}

.user-card button{
  margin-top:5px;
  margin-right:5px;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.user-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
  cursor:pointer;
}

.user-avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #333;
  background:#000;
}

.user-meta{
  flex:1;
  min-width:0;
}

.user-name{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:700;
  margin-bottom:4px;
}

.user-bio{
  font-size:13px;
  color:#aaa;
  word-break:break-word;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:16px;
  height:16px;
  border-radius:50%;
}

.badge svg{
  width:10px;
  height:10px;
}

.badge-blue{
  background:linear-gradient(135deg,#1da1f2,#0d8ddb);
  box-shadow:0 0 8px rgba(29,161,242,0.45);
}

.badge-gold{
  background:linear-gradient(135deg,#ffd700,#ffb700,#ff8c00);
  box-shadow:0 0 8px rgba(255,200,0,0.45);
}

.suspend{background:#ff0050;color:white;}
.delete{background:#444;color:white;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left" onclick="history.back()">←</div>
 <div class="header-center"> ADMIN DASHBOARD </div>
</div>

<div class="stats">
  <div class="stat-box">
    <strong id="totalUsers">0</strong>
    <div>Total utilisateurs</div>
  </div>
  <div class="stat-box">
    <strong id="onlineUsers">0</strong>
    <div>En ligne</div>
  </div>
</div>

<div style="display:flex;justify-content:center;gap:10px;padding:10px;">
  <button onclick="showUsers()">👥 Utilisateurs</button>
        <button onclick="showReports()">🚩 Vidéos signalées</button>
        <button onclick="showProfileReports()">👤 Profils signalés</button>
  <button onclick="showModerationStats()">📊 Comptabilité</button>
</div>

<div class="search">
  <input type="text" id="searchInput" placeholder="Rechercher par nom...">
</div>

<div class="user-list" id="userList"></div>
<div class="user-list" id="reportsList" style="display:none;"></div>
<div class="user-list" id="profileReportsList" style="display:none;"></div>
<div class="user-list" id="moderationStats" style="display:none;"></div>
<div class="user-list"id="highRiskList" style="display:none;"></div>

<div id="videoModal" style="
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
flex-direction:column;
">

<video id="modalVideo"
controls
style="max-width:90%;max-height:70%;margin-bottom:20px;"></video>

<button onclick="ignoreReport()" 
style="background:#2ecc71;color:white;padding:10px 20px;border:none;border-radius:8px;margin-bottom:10px;">
Ignorer signalement
</button>

<button onclick="deleteReportedVideo()" 
style="background:#ff0050;color:white;padding:10px 20px;border:none;border-radius:8px;">
Supprimer la vidéo
</button>

<button onclick="closeVideoModal()" 
style="margin-top:10px;background:#444;color:white;padding:8px 20px;border:none;border-radius:8px;">
Fermer
</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const totalUsersEl = document.getElementById("totalUsers");
const onlineUsersEl = document.getElementById("onlineUsers");
const userList = document.getElementById("userList");
const searchInput = document.getElementById("searchInput");

let allUsers = [];
let currentReportedVideoId = null;

onAuthStateChanged(auth, async user => {

  if(!user){
    window.location.href = "login.html";
    return;
  }

  const snap = await getDocs(collection(db,"users"));
  const users = [];

  snap.forEach(d=>{
    users.push({id:d.id,...d.data()});
  });

  const me = users.find(u=>u.id===user.uid);

if(!me || (me.role !== "admin" && me.role !== "moderator")){
    window.location.href = "feed.html";
    return;
  }

  allUsers = users;
  renderUsers(users);
  updateStats(users);
});

function updateStats(users){
  totalUsersEl.textContent = users.length;

  const online = users.filter(u=>u.online===true);
  onlineUsersEl.textContent = online.length;
}

function getBadgeHTML(user){

  if(!user || !user.verification) return "";

  // GOLD
  if(
    user.verification.type === "gold" &&
    user.verification.status === "active"
  ){
    return `
      <span class="badge badge-gold">
        <svg viewBox="0 0 24 24" fill="black">
          <path d="M12 .587l3.668 7.431 8.2 1.193-5.934 5.782 1.402 8.177L12 18.896l-7.336 3.874 1.402-8.177L.132 9.211l8.2-1.193z"/>
        </svg>
      </span>
    `;
  }

  // BLUE
  if(
    user.verification.type === "blue" &&
    user.verification.status === "active" &&
    user.verification.expiresAt?.toDate &&
    user.verification.expiresAt.toDate() > new Date()
  ){
    return `
      <span class="badge badge-blue">
        <svg viewBox="0 0 24 24" fill="white">
          <path d="M20.285 6.709l-11.025 11.025-5.545-5.545 1.414-1.414 4.131 4.131 9.611-9.611z"/>
        </svg>
      </span>
    `;
  }

  return "";
}

function renderUsers(users){
  userList.innerHTML = "";

  users.forEach(u => {

    const badgeHTML = getBadgeHTML(u);
    const avatar = u.avatar || `https://i.pravatar.cc/150?u=${u.id}`;

    userList.innerHTML += `
      <div class="user-card">

        <div class="user-head" onclick="openUserProfile('${u.id}')">
          <img src="${avatar}" class="user-avatar">

          <div class="user-meta">
            <div class="user-name">
              <span>${u.username || "Sans nom"}</span>
              ${badgeHTML}
            </div>
            <div class="user-bio">${u.bio || ""}</div>
          </div>
        </div>

        <div style="font-size:12px;color:#888;margin-bottom:8px;">
          UID: ${u.id}
        </div>

        <div style="margin-top:8px;">
          ${u.suspended ? `
            <button class="delete" onclick="event.stopPropagation(); unsuspendUser('${u.id}')">
              Réactiver
            </button>
          ` : `
            <button class="suspend" onclick="event.stopPropagation(); suspendUser('${u.id}',3)">Suspendre 3j</button>
            <button class="suspend" onclick="event.stopPropagation(); suspendUser('${u.id}',15)">Suspendre 15j</button>
            <button class="suspend" onclick="event.stopPropagation(); suspendUser('${u.id}',30)">Suspendre 30j</button>
          `}
          <button class="delete" onclick="event.stopPropagation(); deleteUserAccount('${u.id}')">Supprimer</button>
        </div>

      </div>
    `;
  });
}


window.openUserProfile = (uid) => {
  window.location.href = `profil.html?uid=${uid}`;
};

window.suspendUser = async (uid,days)=>{
  const until = new Date();
  until.setDate(until.getDate()+days);

  await updateDoc(doc(db,"users",uid),{
    suspended:true,
    suspendUntil: until
  });

  alert("Utilisateur suspendu");
};

window.deleteUserAccount = async (uid)=>{

  if(!confirm("Supprimer définitivement le compte ?")) return;

  // 1️⃣ Supprimer toutes ses vidéos
  const videosSnap = await getDocs(
    query(collection(db,"videos"), where("userId","==",uid))
  );

  for(const v of videosSnap.docs){
    await deleteDoc(v.ref);
  }

  // 2️⃣ Supprimer profil
  await deleteDoc(doc(db,"users",uid));

  alert("Compte et vidéos supprimés");

  loadProfileReports();
  location.reload();
};

searchInput.addEventListener("input",()=>{
  const value = searchInput.value.toLowerCase();
  const filtered = allUsers.filter(u=>
    (u.username || "").toLowerCase().includes(value)
  );
  renderUsers(filtered);
});

window.unsuspendUser = async (uid)=>{
  await updateDoc(doc(db,"users",uid),{
    suspended:false,
    suspendUntil:null
  });

  alert("Utilisateur réactivé");
  location.reload();
};

window.showUsers = ()=>{
  document.getElementById("userList").style.display="block";
  document.getElementById("reportsList").style.display="none";
};

window.showReports = ()=>{
  document.getElementById("userList").style.display="none";
  document.getElementById("reportsList").style.display="block";
  loadReports();
};

async function loadReports(){

  const reportsList = document.getElementById("reportsList");
  reportsList.innerHTML = "Chargement...";

  const videosSnap = await getDocs(collection(db,"videos"));

  let found = false;
  reportsList.innerHTML = "";

  for(const videoDoc of videosSnap.docs){

    const reportsSnap = await getDocs(
      collection(db,"videos",videoDoc.id,"reports")
    );

    if(reportsSnap.empty) continue;

    found = true;

    const video = videoDoc.data();

    const userSnap = await getDoc(doc(db,"users",video.userId));
    const username = userSnap.exists()
      ? userSnap.data().username
      : "Utilisateur";

    reportsList.innerHTML += `
      <div class="user-card"
        onclick="openVideoModal('${videoDoc.id}','${video.mediaUrls?.[0] || ""}')">

        <strong>${username}</strong>
        <div>UID: ${video.userId}</div>
        <div>Signalements: ${reportsSnap.size}</div>

      </div>
    `;
  }

  if(!found){
    reportsList.innerHTML = "Aucun signalement.";
  }
}

window.openVideoModal = (videoId,src)=>{
  currentReportedVideoId = videoId;

  const modal = document.getElementById("videoModal");
  const video = document.getElementById("modalVideo");

  video.src = src;
  modal.style.display="flex";
};

window.closeVideoModal = ()=>{
  document.getElementById("videoModal").style.display="none";
  document.getElementById("modalVideo").pause();
};

window.deleteReportedVideo = async ()=>{

  if(!confirm("Supprimer cette vidéo ?")) return;

  await deleteDoc(doc(db,"videos",currentReportedVideoId));

  alert("Vidéo supprimée");

  closeVideoModal();
  loadReports();
};

window.ignoreReport = async ()=>{

  if(!confirm("Ignorer tous les signalements ?")) return;

  const reportsRef = collection(
    db,
    "videos",
    currentReportedVideoId,
    "reports"
  );

  const snap = await getDocs(reportsRef);

  for(const d of snap.docs){
    await deleteDoc(d.ref);
  }

  alert("Signalements supprimés");

  closeVideoModal();
  loadReports();
};

window.showProfileReports = ()=>{
  document.getElementById("userList").style.display="none";
  document.getElementById("reportsList").style.display="none";
  document.getElementById("profileReportsList").style.display="block";
  loadProfileReports();
};

async function loadProfileReports(){

  const container = document.getElementById("profileReportsList");
  container.innerHTML = "Chargement...";

  const snap = await getDocs(
  query(
    collection(db,"profileReports"),
    where("status","==","pending")
  )
);

  if(snap.empty){
    container.innerHTML = "Aucun profil signalé.";
    return;
  }

  container.innerHTML = "";

  snap.forEach(d => {

  const r = d.data();
  const reportedUser = allUsers.find(u => u.id === r.reportedUser);
  const avatar = reportedUser?.avatar || `https://i.pravatar.cc/150?u=${r.reportedUser}`;
  const badgeHTML = getBadgeHTML(reportedUser);

  container.innerHTML += `
    <div class="user-card">

      <div class="user-head" onclick="openUserProfile('${r.reportedUser}')">
        <img src="${avatar}" class="user-avatar">

        <div class="user-meta">
          <div class="user-name">
            <span>${r.reportedUsername || "Sans nom"}</span>
            ${badgeHTML}
          </div>
          <div class="user-bio">Raison: ${r.reason}</div>
        </div>
      </div>

      <div>UID: ${r.reportedUser}</div>
      <div>Followers: ${r.followersCount}</div>
      <div>Status: ${r.status}</div>

      <div style="margin-top:10px;">

        <button class="suspend"
          onclick="suspendUser('${r.reportedUser}',15)">
          Suspendre 15j
        </button>

        <button class="delete"
          onclick="deleteUserAccount('${r.reportedUser}')">
          Supprimer compte
        </button>

        <button style="
          background:#2ecc71;
          color:white;
          margin-top:6px;
          padding:6px 10px;
          border:none;
          border-radius:6px;
          cursor:pointer;
        "
        onclick="ignoreProfileReport('${d.id}')">
          Ignorer signalement
        </button>

      </div>

    </div>
  `;
});
}
window.ignoreProfileReport = async (reportId)=>{

  if(!confirm("Ignorer ce signalement ?")) return;

  await deleteDoc(doc(db,"profileReports",reportId));

  alert("Signalement supprimé");

  loadProfileReports();
};

window.showModerationStats = ()=>{
  document.getElementById("userList").style.display="none";
  document.getElementById("reportsList").style.display="none";
  document.getElementById("profileReportsList").style.display="none";
  document.getElementById("moderationStats").style.display="block";
  loadModerationStats();
};

async function loadModerationStats(){

  const container = document.getElementById("moderationStats");
  container.innerHTML = "Chargement...";

  // 1️⃣ Signalements profils
  const profileSnap = await getDocs(
    collection(db,"profileReports")
  );

  // 2️⃣ Signalements vidéos
  const videosSnap = await getDocs(collection(db,"videos"));

  let totalVideoReports = 0;
  let riskyVideos = 0;

  for(const v of videosSnap.docs){
    const reportsSnap = await getDocs(
      collection(db,"videos",v.id,"reports")
    );

    totalVideoReports += reportsSnap.size;

    if(reportsSnap.size >= 3){
      riskyVideos++;
    }
  }

  // 3️⃣ Comptes à risque
  const reportCount = {};
  profileSnap.forEach(d=>{
    const r = d.data();
    reportCount[r.reportedUser] =
      (reportCount[r.reportedUser] || 0) + 1;
  });

  let riskyUsers = 0;
  for(const uid in reportCount){
    if(reportCount[uid] >= 3){
      riskyUsers++;
    }
  }

  // 4️⃣ Suspensions actives
  const usersSnap = await getDocs(collection(db,"users"));

  let suspendedCount = 0;
  usersSnap.forEach(u=>{
    if(u.data().suspended === true){
      suspendedCount++;
    }
  });

  container.innerHTML = `
    <div class="user-card">
      <strong>📊 Statistiques Globales</strong>
      <div>Signalements profils : ${profileSnap.size}</div>
      <div>Signalements vidéos : ${totalVideoReports}</div>
      <div>Comptes ≥ 3 signalements : ${riskyUsers}</div>
      <div>Vidéos ≥ 3 signalements : ${riskyVideos}</div>
      <div>Comptes suspendus : ${suspendedCount}</div>
    </div>
  `;
}

</script>

</body>
</html>
