<script type="module">
import {
  initializeApp,
  getApps

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const config = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const auth = getAuth(getApps()[0] || initializeApp(config));
const API = "https://hayticlip-server.onrender.com";

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

const esc = value => String(value ?? "").replace(
  /[&<>"']/g,
  x => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[x])
);

const fmt = value => Number.isFinite(value)
  ? new Intl.NumberFormat("fr-HT", {
      maximumFractionDigits: 2
    }).format(value) + " HTG"
  : "—";

const when = value => Number.isFinite(value) && value > 0
  ? new Intl.DateTimeFormat("fr-FR", {
      timeZone: "America/Port-au-Prince",
      dateStyle: "short",
      timeStyle: "short"
    }).format(new Date(value))
  : "—";

const names = {
  pending: "En attente",
  accepted: "À préparer",
  shipping: "En livraison",
  completed: "Terminée",
  rejected: "Refusée",
  cancelled: "Annulée",
  refunded: "Remboursée",
  disputed: "En litige",
  active: "Actif",
  suspended: "Suspendu",
  inactive: "Inactif",
  held: "Fonds en attente",
  settled: "Fonds libérés",
  open: "Ouvert",
  resolved: "Résolu",
  failed: "Échoué"
};

const label = state => Object.prototype.hasOwnProperty.call(names, state)
  ? names[state]
  : String(state || "À vérifier");

const pill = state =>
  `<span class="hc-status" data-status="${esc(state)}">${esc(label(state))}</span>`;

function safeURL(value) {
  try {
    const url = new URL(value, location.origin);
    return url.protocol === "https:" ? url.href : "";
  } catch {
    return "";
  }
}

function image(value, cls = "hc-item-photo", alt = "") {
  const url = value ? safeURL(value) : "";

  return url
    ? `<img class="${cls}" src="${esc(url)}" alt="${esc(alt)}" loading="lazy">`
    : `<span class="${cls}" aria-hidden="true"></span>`;
}

function field(id, title, o = {}) {
  const attrs = `
    ${o.required ? "required" : ""}
    ${o.max ? `maxlength="${o.max}"` : ""}
  `;

  const input = o.area
    ? `<textarea id="${id}" rows="3" ${attrs}></textarea>`
    : `<input
        id="${id}"
        type="${o.type || "text"}"
        ${attrs}
        ${o.min !== undefined ? `min="${o.min}"` : ""}
        ${o.step ? `step="${o.step}"` : ""}
        ${o.type === "file"
          ? 'accept="image/jpeg,image/png,image/webp"'
          : ""}
        ${o.multiple ? "multiple" : ""}
      >`;

  return `
    <div class="hc-field ${o.wide ? "hc-span" : ""}">
      <label for="${id}">${title}</label>
      ${input}
    </div>
  `;
}

function empty(node, text) {
  node.innerHTML = `<div class="hc-empty">${esc(text)}</div>`;
}

function message(text = "", type = "info", root = document) {
  const node = $("[data-message]", root);

  if (node) {
    node.textContent = text;
    node.dataset.type = type;
  }
}

function shell() {
  document.body.innerHTML = `
    <header class="hc-header">
      <div class="hc-header-inner">
        <button id="go-back" class="hc-back" aria-label="Retour">←</button>

        <div>
          <div class="hc-brand">HAYTICLIPS</div>
          <h1 class="hc-title">Dashboard marchand</h1>
        </div>

        <div class="hc-header-actions" id="header-actions"></div>
      </div>
    </header>

    <main class="hc-wrap">
      <div
        class="hc-message"
        data-message
        role="status"
        aria-live="polite"
      ></div>

      <div id="content">
        <p class="hc-note">Chargement de ta boutique...</p>
      </div>
    </main>
  `;

  $("#go-back").onclick = () => history.back();
}

let session = 0;
const objectURLs = new Set();

function releaseURL(url) {
  URL.revokeObjectURL(url);
  objectURLs.delete(url);
}

function cleanup() {
  $$("dialog").forEach(closeModal);

  for (const url of objectURLs) {
    URL.revokeObjectURL(url);
  }

  objectURLs.clear();
}

async function request(path, body, options, uid, epoch) {
  const stale = () => Object.assign(
    new Error("Session modifiée"),
    { stale: true }
  );

  const valid = () =>
    epoch === session &&
    auth.currentUser?.uid === uid;

  if (!valid()) throw stale();

  const token = await auth.currentUser.getIdToken();

  if (!valid()) throw stale();

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    body instanceof FormData ? 120000 : 60000
  );

  try {
    const form = body instanceof FormData;

    const response = await fetch(API + path, {
      method: body === undefined ? "GET" : "POST",
      headers: {
        Authorization: "Bearer " + token,
        ...(body !== undefined && !form
          ? { "Content-Type": "application/json" }
          : {})
      },
      body: body === undefined
        ? undefined
        : form
          ? body
          : JSON.stringify(body),
      cache: "no-store",
      signal: controller.signal
    });

    if (!valid()) throw stale();

    if (!response.ok) {
      const data = await response.json().catch(() => ({}));

      throw Object.assign(
        new Error(
          data.error || `Service indisponible (${response.status})`
        ),
        {
          status: response.status,
          code: data.code
        }
      );
    }

    if (options?.blob) {
      const blob = await response.blob();

      if (!valid()) throw stale();

      return blob;
    }

    const data = await response.json();

    if (!valid()) throw stale();

    if (data?.success !== true) {
      throw new Error(
        data?.error || "Réponse du service invalide"
      );
    }

    return data;

  } catch (error) {
    if (!valid()) throw stale();

    if (error.name === "AbortError") {
      throw new Error(
        "Réponse non confirmée. Actualise les données avant de réessayer."
      );
    }

    throw error;

  } finally {
    clearTimeout(timer);
  }
}

function showError(error, root = document) {
  if (error.stale) return;

  if (error.status === 401) {
    location.href = "login.html";
    return;
  }

  message(
    error.message || "Connexion au service impossible",
    "error",
    root
  );
}

function modal(title, body) {
  $$("dialog").forEach(closeModal);

  const d = document.createElement("dialog");
  d.className = "hc-dialog";

  d.innerHTML = `
    <div class="hc-row hc-between">
      <h2>${esc(title)}</h2>
      <button type="button" data-close aria-label="Fermer">✕</button>
    </div>

    <div
      class="hc-message"
      data-message
      role="status"
      aria-live="polite"
    ></div>

    ${body}
  `;

  document.body.appendChild(d);

  d.addEventListener("close", () => d.remove(), { once: true });

  $("[data-close]", d).onclick = () => closeModal(d);

  if (d.showModal) {
    d.showModal();
  } else {
    d.setAttribute("open", "");
  }

  return d;
}

function closeModal(d) {
  if (d.close) {
    d.close();
  } else {
    d.dispatchEvent(new Event("close"));
    d.remove();
  }
}

async function resized(file) {
  if (!file || file.size > 15 * 1024 * 1024) {
    throw new Error("Chaque photo est limitée à 15 Mo.");
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    throw new Error("Choisis une photo JPG, PNG ou WebP.");
  }

  if (file.size < 500000) return file;

  try {
    const bitmap = await createImageBitmap(file);

    const scale = Math.min(
      1,
      1600 / Math.max(bitmap.width, bitmap.height)
    );

    const canvas = document.createElement("canvas");

    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

    bitmap.close();

    const blob = await new Promise(resolve =>
      canvas.toBlob(resolve, "image/jpeg", 0.85)
    );

    return blob
      ? new File([blob], "photo.jpg", { type: "image/jpeg" })
      : file;

  } catch {
    return file;
  }
}

function today() {
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Port-au-Prince",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date()).map(p => [p.type, p.value])
  );

  return `${parts.year}-${parts.month}-${parts.day}`;
}

async function boot(user, epoch) {
  const api = (path, body, options) =>
    request(path, body, options, user.uid, epoch);

  let me = await api("/api/merchant/me");

  if (me.uid !== user.uid || !me.shop) {
    throw new Error("Le dossier ne correspond pas à ta session.");
  }

  if (!me.active && !["active", "suspended"].includes(me.status)) {
    $("#content").innerHTML = `
      <section class="hc-card">
        <h2>Accès marchand</h2>
        <p>Consulte le statut de ta demande pour accéder à ta boutique.</p>
        <a class="hc-button hc-primary" href="merchant-request.html">
          Voir ma demande
        </a>
      </section>
    `;
    return;
  }

  const tabItems = [
    ["orders", "Commandes"],
    ["products", "Produits"],
    ["shop", "Boutique"],
    ["finance", "Finances"],
    ["disputes", "Litiges"]
  ];
  
  $("#header-actions").innerHTML = `

  async function task(button, key, fn, root = document) {
    if (locks.has(key)) return;

    locks.add(key);

    if (button) {
      button.disabled = true;
      button.dataset.lock = key;
    }

    sync();

    try {
      await fn();
    } catch (error) {
      if (alive()) showError(error, root);
    } finally {
      locks.delete(key);

      if (button?.isConnected) {
        button.disabled = false;

      sync();
    }
  }

  function pageData(list, key) {

    pages[key] = Math.min(Math.max(1, pages[key]), max);

    return list.slice(
      (pages[key] - 1) * 20,
      pages[key] * 20

  }

  function pager(node, list, key, render) {
    if (list.length <= 20) return;

    const bar = document.createElement("div");
    bar.className = "hc-pager";

    const previous = document.createElement("button");
    const next = document.createElement("button");
    const text = document.createElement("span");

    previous.type = next.type = "button";

    previous.textContent = "Précédent";
    next.textContent = "Suivant";

    previous.disabled = pages[key] <= 1;
    next.disabled = pages[key] * 20 >= list.length;

    text.textContent =
      `Page ${pages[key]} / ${Math.ceil(list.length / 20)}` +
      ` · ${list.length} éléments`;

    previous.onclick = () => {
      pages[key]--;
      render();
    };

    next.onclick = () => {
      pages[key]++;
      render();
    };

    bar.append(previous, text, next);
    node.appendChild(bar);
  }

  function checkDeliveryData(shop) {
    const rates = shop?.deliveryRates;
    const version = shop?.deliveryRatesVersion;

    if (
      !Array.isArray(rates) ||
      rates.length > 30 ||
      !Number.isSafeInteger(version) ||
      version < 0
    ) {
      throw new Error("Livraison indisponible. Actualise.");
    }

    const ids = new Set();
    const labels = new Set();

    for (const rate of rates) {
      const key = typeof rate?.label === "string"
        ? rate.label.trim()
            .normalize("NFC")
            .replace(/\s+/g, " ")
            .toLowerCase()
        : "";

      if (
        typeof rate?.id !== "string" ||
        !rate.id ||
        rate.id.length > 128 ||
        /[\/\x00-\x1f]/.test(rate.id) ||
        [".", ".."].includes(rate.id) ||
        ids.has(rate.id) ||
        !key ||
        rate.label.trim().length < 2 ||
        rate.label.length > 60 ||
        labels.has(key) ||
        typeof rate.price !== "number" ||
        !Number.isFinite(rate.price) ||
        rate.price < 0 ||
        rate.price > 1000000000 ||
        Math.abs(
          rate.price * 100 - Math.round(rate.price * 100)
        ) > 0.00001
      ) {
        throw new Error("Zones de livraison à vérifier.");

      ids.add(rate.id);
      labels.add(key);

  function collectDeliveryRates() {
    const rows = deliveryRows();

    if (rows.length > 30) {
      throw new Error("Maximum : 30 zones.");
    }

    const names = new Set();

    return rows.map(row => {
      const label = $("[data-zone-label]", row).value
        .trim()
        .normalize("NFC")
        .replace(/\s+/g, " ");

      const raw = $("[data-zone-price]", row).value.trim();
      const price = Number(raw);
      const key = label.toLowerCase();

      if (
        label.length < 2 ||
        label.length > 60 ||
        names.has(key)
      ) {
        throw new Error(
          "Vérifie les noms des zones : aucun doublon."
        );
      }

      if (
        !raw ||
        !Number.isFinite(price) ||
        price < 0 ||
        price > 1000000000 ||
        Math.abs(
          price * 100 - Math.round(price * 100)
        ) > 0.00001
      ) {
        throw new Error("Vérifie le prix de chaque zone.");
      }

      names.add(key);

      return {
        id: row.dataset.rateId || "",
        label,
        price
      };
    });
  }

              }</strong>
            </div>
            <div class="hc-bar">
              <i style="width:${
                Number.isFinite(x.value)
                  ? Math.min(100, Math.max(0, x.value) / max * 100)
                  : 0
              }%"></i>
            </div>
            ${x.note
              ? `<small class="hc-muted">${esc(x.note)}</small>`
              : ""}
          </div>
        `).join("")}
      </div>
    `;
  }

  function salesChart(r) {
    if (!r.daily.length) {
      return empty(
        $("#sales-chart"),
        "Aucune vente réglée sur cette période."
      );
    }

    const map = new Map(r.daily.map(x => [x.date, x]));
    const rows = [];

    for (
      let d = new Date(r.range.from + "T12:00:00Z"),
          last = new Date(r.range.to + "T12:00:00Z");
      d <= last;
      d.setUTCDate(d.getUTCDate() + 1)
    ) {
      const date = d.toISOString().slice(0, 10);
      rows.push(map.get(date) || { date, gross: 0 });
    }

    const max = Math.max(1, ...rows.map(x => x.gross));
    const steps = Math.max(1, rows.length - 1);

    const points = rows.map((x, i) =>
      `${22 + i / steps * 656},${155 - x.gross / max * 125}`
    ).join(" ");

    $("#sales-chart").innerHTML = `
      <p class="hc-muted">
        Chiffre d’affaires brut réglé · maximum
        ${esc(fmt(Math.max(...rows.map(x => x.gross))))}
      </p>

      <svg
        class="hc-chart"
        viewBox="0 0 700 185"
        role="img"
        aria-label="Évolution quotidienne des ventes réglées"
      >
        <path
          d="M22 155H678 M22 92H678 M22 30H678"
          fill="none"
          stroke="#343847"
        />
        <polyline
          points="${points}"
          fill="none"
          stroke="#ff0050"
          stroke-width="3"
        />
        ${rows.length === 1 ? `
          <circle
            cx="22"
            cy="${155 - rows[0].gross / max * 125}"
            r="5"
            fill="#ff0050"
          />
        ` : ""}
      </svg>

      <div class="hc-chart-labels">
        <span>${esc(r.range.from)}</span>
        <span>${esc(r.range.to)}</span>
      </div>

      <details class="hc-muted">
        <summary>Voir les valeurs quotidiennes</summary>
        ${rows.map(x => `
          <p>${esc(x.date)} : ${esc(fmt(x.gross))}</p>
        `).join("")}
      </details>
    `;
  }

  async function refreshSummary() {
    const version = ++summaryVersion;
    const selected = query();

    summaryBusy = true;
    sync();

    try {
      validatePeriod();

      const r = await api("/api/merchant/summary?" + selected);

      if (
        version !== summaryVersion ||
        selected !== query()
      ) {
        return true;
      }

      if (
        !r.period ||
        !r.periods ||
        !r.snapshot?.counts ||
        !r.range ||
        !Array.isArray(r.transactions) ||
        !Array.isArray(r.daily) ||
        !Array.isArray(r.bestProducts) ||
        !Array.isArray(r.warnings)
      ) {
        throw new Error("Données financières incomplètes.");
      }

      summary = r;
      summaryQuery = selected;
      pages.finance = 1;

      const p = r.period;
      const s = r.snapshot;
      const c = s.counts;

      $("#data-period").textContent =
        `Du ${r.range.from} au ${r.range.to}`;
      
      $("#dashboard-stats").innerHTML = [
        stat(
          "Chiffre d’affaires réglé",
          fmt(p.gross),
          "Période sélectionnée"
        ),
        stat(
          "Montant libéré au marchand",
          fmt(p.net),
          "Net sur la période"
        ),
        stat(
          "Ventes en attente",
          fmt(s.merchantPending),
          "Situation actuelle · indisponibles au retrait"
        ),
        stat(
          "Solde disponible",
          fmt(s.walletAvailable),
          "Portefeuille HaytiClips partagé"
        ),
        stat(
          "Ventes du jour",
          fmt(r.periods.today.gross),
          `${r.periods.today.count} vente(s) réglée(s)`
        ),
        stat("7 derniers jours", fmt(r.periods.week.gross)),
        stat("Ventes du mois", fmt(r.periods.month.gross)),
        stat("Produits actifs", s.activeProducts),
        stat(

          "Historique complet"
        ),

        stat("En livraison", c.shipping || 0),

          (c.cancelled || 0) + (c.rejected || 0)
        ),
        stat("Ventes réglées", p.count, "Période sélectionnée")
      ].join("");

      salesChart(r);

      bars(
        $("#best-products"),
        r.bestProducts.map(x => ({
          name: x.name,
          value: x.quantity,
          note: fmt(x.gross)
        }))
      );

      bars($("#order-chart"), [
        { name: "Terminées", value: c.completed || 0 },
        {
          name: "Annulées ou refusées",
          value: (c.cancelled || 0) + (c.rejected || 0)
        },
        { name: "En litige", value: c.disputed || 0 },
        { name: "Remboursées", value: c.refunded || 0 }
      ]);

      $("#summary-warnings").innerHTML = r.warnings.map(w =>
        `<p class="hc-note">${esc(w)}</p>`
      ).join("");

      $("#wallet-notice").textContent =
        "Portefeuille partagé. Les fonds en attente ne sont pas retirables.";
      
      $("#finance-stats").innerHTML =
        stat(
          "Disponible",
          fmt(s.walletAvailable)
        ) +
        stat(
          "En attente",
          fmt(s.merchantPending),
          "Non retirable"
        );

      renderTransactions();
      return true;

    } catch (e) {
      if (!alive() || version !== summaryVersion) return true;

      summary = null;

      $("#summary-warnings").textContent = "";
      $("#wallet-notice").textContent =
        "Soldes non vérifiés : actualise les données.";

      $("#data-period").textContent =
        "Données financières indisponibles. Actualise pour réessayer.";

      for (const id of [
        "dashboard-stats",
        "sales-chart",
        "best-products",
        "order-chart",
        "finance-stats",
        "dashboard-transactions"
      ]) {
        empty($("#" + id), e.message);
      }

      showError(e);
      return false;

    } finally {
      if (version === summaryVersion && alive()) {
        summaryBusy = false;
        sync();
      }
    }

  async function afterWrite(text) {
    const ok = await refreshAll();

    if (alive()) {
      message(
        text + (
          ok
            ? ""
            : " Certaines données n’ont pas pu être rechargées : " +
              "utilise Actualiser."
        ),
        ok ? "success" : "info"
      );
    }
  }

  async function changeOrder(id, action) {
    if (!me.active) {
      throw new Error("Les actions commerciales sont désactivées.");
    }

    if (
      action === "reject-order" &&
      !confirm(
        "Refuser cette commande et débloquer le montant pour l’acheteur ?"
      )
    ) {
      return;
    }

    await api("/api/merchant/" + action, { orderId: id });
    await afterWrite("Commande mise à jour.");
  }

  function confirmDelivery(id) {
    const o = latest(id);

    if (
      !me.active ||
      !o ||
      !["accepted", "shipping"].includes(o.status)
    ) {
      throw new Error("Cette commande ne peut pas être confirmée.");
    }

    const d = modal("Confirmer la remise du produit", `
      <p class="hc-note">
        Demande le code à l’acheteur après remise et vérification
        du produit. Le serveur contrôle la commande, le paiement,
        les tentatives et les litiges avant toute libération.
      </p>

      <form id="delivery-form">
        <fieldset
          data-lock="order:${esc(id)}"
          style="border:0;padding:0;margin:0;min-width:0"
        >
          ${field(
            "delivery-code",
            "Code communiqué par l’acheteur",
            { required: true, max: 32 }
          )}

          <button type="submit" class="hc-primary">
            Valider la livraison
          </button>
        </fieldset>
      </form>
    `);

    const input = $("#delivery-code", d);

    input.autocomplete = "off";
    input.spellcheck = false;
    input.autocapitalize = "characters";
    input.focus();

    $("#delivery-form", d).onsubmit = e => {
      e.preventDefault();

      const code = input.value
        .trim()
        .toUpperCase()
        .replace(/[\s-]/g, "");

      if (!/^[A-Z0-9]{8,32}$/.test(code)) {
        message(
          "Vérifie le code communiqué par l’acheteur.",
          "error",
          d
        );
        return;
      }

      task(
        $('button[type="submit"]', d),
        "order:" + id,
        async () => {
          if (!me.active) {
            throw new Error("Accès marchand désactivé.");
          }

          await api("/api/merchant/complete-order", {
            orderId: id,
            deliveryCode: code
          });

          input.value = "";
          closeModal(d);

          await afterWrite(
            "Livraison confirmée. " +
            "Les montants affichés proviennent du serveur."
          );
        },
        d
      );
    };
  }

  function requestReview(id) {
    const d = modal("Demander un examen", `
      <p class="hc-note">
        Explique le problème : livraison sans confirmation,
        acheteur injoignable ou autre blocage.
        Le serveur vérifie le délai applicable.
        Cette demande ne libère aucun montant.
      </p>

      <form id="review-form">
        <fieldset
          data-lock="order:${esc(id)}"
          style="border:0;padding:0;margin:0"
        >
          ${field("review-reason", "Motif de la demande", {
            required: true,
            area: true,
            max: 1000
          })}

          <button type="submit" class="hc-primary">
            Soumettre à l’administration
          </button>
        </fieldset>
      </form>
    `);

    $("#review-form", d).onsubmit = e => {
      e.preventDefault();

      const reason = $("#review-reason", d).value.trim();

      if (reason.length < 10) {
        return message(
          "Explique le problème en au moins 10 caractères.",
          "error",
          d
        );
      }

      task(
        $('button[type="submit"]', d),
        "order:" + id,
        async () => {
          await api("/api/merchant/request-review", {
            orderId: id,
            reason
          });

          closeModal(d);
          await afterWrite("Demande d’examen enregistrée.");
        },
        d
      );
    };
  }

  function renderOrders() {
    const node = $("#dashboard-orders");

    const term = $("#order-search").value
      .trim()
      .toLocaleLowerCase();

    const filter = $("#order-filter").value;

    if (!ordersReady) {
      return empty(
        node,
        "Commandes indisponibles. Utilise Actualiser pour réessayer."
      );
    }

    const rows = orders.filter(o =>
      (filter === "all" || o.status === filter) &&
      [
        o.id,
        o.productName,
        o.customerNom,
        o.customerPrenom,
        o.customerEmail
      ].join(" ").toLocaleLowerCase().includes(term)
    );

    node.innerHTML = "";

    if (!rows.length) {
      return empty(
        node,
        "Aucune commande correspondant à cette sélection."
      );
    }

    for (const o of pageData(rows, "orders")) {
      const item = document.createElement("article");
      item.className = "hc-item";

      item.innerHTML = `
        <div class="hc-row hc-between">
          <h3>${esc(o.productName || "Produit")}</h3>
          ${pill(o.status)}
        </div>

        <p class="hc-ref">N° ${esc(o.id)}</p>

        <p>
          ${esc(when(o.createdAtMs))}
          · ${esc(o.quantity)} unité(s)
        </p>

        <p>
          Total : ${esc(fmt(o.totalAmount))}
          · Livraison : ${esc(fmt(o.deliveryFee ?? 0))}
        </p>

        <p>${esc(
          o.deliveryMode === "delivery"
            ? "Livraison : " +
              (o.deliveryZoneName || "Zone enregistrée")
            : o.deliveryMode === "pickup"
              ? "Sans livraison"
              : "Livraison non précisée"
        )}</p>

        <p>${pill(o.fundsStatus)}</p>

        <div class="hc-actions"></div>
      `;

      const a = $(".hc-actions", item);
      const key = "order:" + o.id;

      addButton(a, "Consulter", key, () => viewOrder(o.id));

      if (o.status === "pending") {
        addButton(
          a,
          "Accepter",
          key,
          () => changeOrder(o.id, "accept-order"),
          "hc-primary",
          true
        );

        addButton(
          a,
          "Refuser",
          key,
          () => changeOrder(o.id, "reject-order"),
          "hc-danger",
          true
        );
      }

      if (o.status === "accepted") {
        addButton(
          a,
          "Mettre en livraison",
          key,
          () => changeOrder(o.id, "ship-order"),
          "",
          true
        );
      }

      if (["accepted", "shipping"].includes(o.status)) {
        const code = document.createElement("button");

        code.type = "button";
        code.className = "hc-primary";
        code.textContent = "Saisir le code de livraison";
        code.dataset.lock = key;
        code.setAttribute("data-business", "");

        code.onclick = () => confirmDelivery(o.id);
        a.appendChild(code);

        const review = document.createElement("button");

        review.type = "button";
        review.textContent = "Demander un examen";
        review.dataset.lock = key;
        review.onclick = () => requestReview(o.id);

        a.appendChild(review);
      }

      if (o.disputeId) {
        const b = document.createElement("button");

        b.type = "button";
        b.textContent = "Voir les litiges";
        b.onclick = () => switchTab("disputes", true);

        a.appendChild(b);
      }

      node.appendChild(item);
    }

    pager(node, rows, "orders", renderOrders);
    sync();
  }

  async function refreshOrders() {
    const version = ++orderVersion;

    try {
      const r = await api("/api/merchant/orders?side=seller");

      if (version !== orderVersion) return true;

      if (
        !Array.isArray(r.orders) ||
        r.orders.some(o => o.merchantUid !== user.uid)
      ) {
        throw new Error("Historique de commandes invalide.");
      }

      orders = r.orders;
      ordersReady = true;

      renderOrders();
      return true;

    } catch (e) {
      if (alive() && version === orderVersion) {
        orders = [];
        ordersReady = false;

        empty(
          $("#dashboard-orders"),
          "Commandes indisponibles : " + e.message
        );

        showError(e);
      }

      return false;
    }
  }

      locks.has(editing ? "product:" + editing.id : "product:new")

    editing = {

    $("#product-price").value = p.price;
    $("#product-stock").value = p.stock;
    $("#product-images").value = "";

    $("#product-form fieldset").dataset.lock = "product:" + p.id;

    sync();
    $("#product-name").focus();

  async function toggleProduct(p) {
    try {
      await api("/api/merchant/save-product", {
        productId: p.id,
        expectedVersion: Number(p.version || 0),
        isActive: p.isActive !== true,
        images: productImages(p)
      });

    } catch (e) {
      if (e.status === 409) await refreshProducts();
      throw e;
    }

    await afterWrite("État du produit mis à jour.");
  }

    if (!confirm(
      "Retirer ce produit de la boutique ? " +
      "Ses données resteront conservées pour l’historique."
    )) {
      return;
    }

    await api("/api/merchant/archive-product", {
      productId: p.id

    if (editing?.id === p.id) resetProduct();

    await afterWrite("Produit retiré du catalogue.");

      const edit = document.createElement("button");

      edit.type = "button";
      edit.textContent = "Modifier";
      edit.dataset.lock = key;
      edit.setAttribute("data-business", "");
      edit.onclick = () => editProduct(p);

      a.appendChild(edit);

      addButton(
        a,
        p.isActive === true ? "Désactiver" : "Activer",
        key,
        () => toggleProduct(p),
        "",
        true
      );

      addButton(
        a,
        "Retirer",
        key,
        () => archiveProduct(p),
        "hc-danger",
        true
      );

      node.appendChild(item);
    }

    pager(node, rows, "products", renderProducts);
    sync();
  }

  async function refreshProducts() {
    const version = ++productVersion;

    if (!me.active) {
      productsReady = false;
      products = [];

      empty(
        $("#dashboard-products"),
        "Gestion des produits désactivée pendant la suspension."
      );

      sync();
      return true;
    }

    try {
      const r = await api("/api/merchant/products");

      if (version !== productVersion) return true;

      if (
        !Array.isArray(r.products) ||
        r.products.some(p => p.merchantUid !== user.uid)
      ) {
        throw new Error("Liste de produits invalide.");
      }

      products = r.products.filter(p => p.archived !== true);
      productsReady = true;

      renderProducts();
      return true;

    } catch (e) {
      if (alive() && version === productVersion) {
        productsReady = false;
        products = [];

        empty(
          $("#dashboard-products"),
          "Produits indisponibles : " + e.message
        );

        showError(e);
        sync();
      }

      return false;
    }
  }

  $("#reset-product").onclick = resetProduct;

  $("#product-form").onsubmit = e => {
    e.preventDefault();

    const edit = editing ? { ...editing } : null;
    const key = edit ? "product:" + edit.id : "product:new";

    task(
      $('button[type="submit"]', e.currentTarget),
      key,
      async () => {
        if (!me.active || !productsReady) {
          throw new Error(
            "Recharge les produits avant de les modifier."
          );
        }

        const name = $("#product-name").value.trim();
        const description = $("#product-description").value.trim();
        const price = Number($("#product-price").value);
        const stock = Number($("#product-stock").value);
        const files = [...$("#product-images").files];

        if (
          name.length < 2 ||
          name.length > 80 ||
          description.length > 500
        ) {
          throw new Error(
            "Vérifie le nom et la description du produit."
          );
        }

        if (
          !Number.isFinite(price) ||
          price <= 0 ||
          Math.abs(price * 100 - Math.round(price * 100)) > 0.00001
        ) {
          throw new Error(
            "Le prix doit être positif, " +
            "avec deux décimales au maximum."
          );
        }

        if (
          !Number.isInteger(stock) ||
          stock < 0 ||
          stock > 1000000
        ) {
          throw new Error(
            "Le stock doit être un entier entre 0 et 1 000 000."
          );
        }

        if (files.length > 8 || (!edit && !files.length)) {
          throw new Error("Ajoute entre 1 et 8 photos.");
        }

        for (const f of files) {
          if (
            f.size > 15 * 1024 * 1024 ||
            !["image/jpeg", "image/png", "image/webp"].includes(f.type)
          ) {
            throw new Error(
              "Photos JPG, PNG ou WebP de 15 Mo maximum."
            );
          }
        }

        const images = files.length ? [] : productImages(edit);

        for (const file of files) {
          images.push(await upload(file, "product"));
        }

        const body = {
          name,
          description,
          price,
          stock,
          images,
          isActive: edit ? edit.isActive === true : true
        };

        if (edit) {
          body.productId = edit.id;
          body.expectedVersion = Number(edit.version || 0);
        }

        try {
          await api("/api/merchant/save-product", body);

        } catch (err) {
          if (err.status === 409) await refreshProducts();
          throw err;
        }

        resetProduct();

        await afterWrite(
          edit ? "Produit modifié." : "Produit ajouté."
        );
      }
    );
  };

 $("#shop-form").onsubmit = e => {
    e.preventDefault();

    task(
      $("button[type='submit']", e.currentTarget),
      "shop",
      async () => {
        if (!me.active || !accessVerified) {
          throw new Error("Boutique inactive.");
        }

        if (!deliveryReady) {
          throw new Error(
            "Actualise les zones de livraison."
          );
        }

        const body = {};

        for (const [id, key] of shopFields) {
          if (key !== "name") {
            body[key] = $("#" + id).value.trim();
          }
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) {
          throw new Error("Email invalide.");
        }

        body.deliveryRates = collectDeliveryRates();
        body.expectedDeliveryRatesVersion =
          deliveryEditorVersion;

        const logo = $("#shop-logo").files[0];
        const banner = $("#shop-banner").files[0];

        if (logo) {
          body.logo = await upload(logo, "shop");
        }

        if (banner) {
          body.banner = await upload(banner, "shop");
        }

        let saved;

        try {
          saved = await api(
            "/api/merchant/save-shop",
            body
          );
        } catch (err) {
          if (err.code === "DELIVERY_CHANGED") {
            message(
              "Zones modifiées ailleurs. Actualise les zones.",
              "error"
            );

            return;
          }

          throw err;
        }

        if (!alive()) return;

        fillDeliveryEditor(saved);

        me.shop.deliveryRates = saved.deliveryRates;
        me.shop.deliveryRatesVersion =
          saved.deliveryRatesVersion;

        $("#shop-logo").value = "";
        $("#shop-banner").value = "";

        await afterWrite("Boutique enregistrée.");
      }
    );
  };
  async function viewEvidence(dispute, file) {
    const blob = await api(
      `/api/merchant/dispute-evidence/${
        encodeURIComponent(dispute.id)
      }/${encodeURIComponent(file.id)}`,
      undefined,
      { blob: true }
    );

    if (![
      "image/jpeg",
      "image/png",
      "image/webp",
      "video/mp4"
    ].includes(blob.type.split(";")[0])) {
      throw new Error("Format de preuve non pris en charge.");
    }

    const url = URL.createObjectURL(blob);
    objectURLs.add(url);

    const d = modal(
      "Pièce du dossier",
      "<div data-proof></div>"
    );

    const media = document.createElement(
      blob.type.startsWith("video/") ? "video" : "img"
    );

    media.className = "hc-proof";
    media.src = url;

    if (media.tagName === "VIDEO") {
      media.controls = true;
      media.preload = "metadata";
    } else {
      media.alt = "Pièce fournie dans le dossier";
    }

    $("[data-proof]", d).appendChild(media);

    d.addEventListener("close", () => {
      media.removeAttribute("src");
      releaseURL(url);
    }, { once: true });
  }

  function disputeMessage(dossier) {
    const d = modal("Ajouter une explication", `
      <form id="dispute-message-form">
        <fieldset
          data-lock="dispute:${esc(dossier.id)}"
          style="border:0;padding:0;margin:0"
        >
          ${field("dispute-message", "Message pour le dossier", {
            area: true,
            required: true,
            max: 2000
          })}

          <button type="submit" class="hc-primary">Envoyer</button>
        </fieldset>
      </form>
    `);

    $("#dispute-message-form", d).onsubmit = e => {
      e.preventDefault();

      const text = $("#dispute-message", d).value.trim();

      if (text.length < 2) {
        return message(
          "Ajoute au moins deux caractères.",
          "error",
          d
        );
      }

      task(
        $('button[type="submit"]', d),
        "dispute:" + dossier.id,
        async () => {
          await api("/api/merchant/dispute-message", {
            disputeId: dossier.id,
            message: text
          });

          closeModal(d);
          await afterWrite("Explication ajoutée au dossier.");
        },
        d
      );
    };
  }

  function disputeEvidence(dossier) {
    const d = modal("Ajouter une preuve", `
      <form id="evidence-form">
        <fieldset style="border:0;padding:0;margin:0">
          <div class="hc-field">
            <label for="evidence-file">
              Photo JPG, PNG, WebP ou vidéo MP4 · 15 Mo maximum
            </label>

            <input
              id="evidence-file"
              type="file"
              accept="image/jpeg,image/png,image/webp,video/mp4"
              required
            >
          </div>

          <button type="submit" class="hc-primary">
            Ajouter au dossier
          </button>
        </fieldset>
      </form>
    `);

    $("fieldset", d).dataset.lock = "dispute:" + dossier.id;

    $("#evidence-form", d).onsubmit = e => {
      e.preventDefault();

      const file = $("#evidence-file", d).files[0];

      if (
        !file ||
        ![
          "image/jpeg",
          "image/png",
          "image/webp",
          "video/mp4"
        ].includes(file.type) ||
        file.size > 15 * 1024 * 1024
      ) {
        return message(
          "Choisis une photo ou une vidéo autorisée, de 15 Mo maximum.",
          "error",
          d
        );
      }

      task(
        $('button[type="submit"]', d),
        "dispute:" + dossier.id,
        async () => {
          const form = new FormData();

          form.append("file", file);
          form.append("disputeId", dossier.id);

          await api("/api/merchant/dispute-evidence", form);

          closeModal(d);
          await afterWrite("Preuve ajoutée au dossier.");
        },
        d
      );
    };
  }

  function renderDisputes() {
    const node = $("#dashboard-disputes");
    node.innerHTML = "";

    if (!disputes.length) {
      return empty(
        node,
        "Aucun dossier lié aux ventes de ta boutique."
      );
    }

    for (const x of pageData(disputes, "disputes")) {
      const item = document.createElement("article");
      item.className = "hc-item";

      const who = uid => uid === user.uid
        ? "Toi"
        : uid === x.buyerUid
          ? "Acheteur"
          : "Équipe HaytiClips";

      item.innerHTML = `
        <div class="hc-row hc-between">
          <h3>Dossier de la commande</h3>
          ${pill(x.status)}
        </div>

        <p class="hc-ref">${esc(x.orderId)}</p>
        <p>${esc(when(x.createdAtMs))}</p>
        <p>${esc(x.reason)}</p>

        ${x.status === "resolved" ? `
          <p class="hc-note">
            Décision :
            ${esc(
              x.decision === "refund"
                ? "Remboursement"
                : x.decision === "release"
                  ? "Libération des fonds"
                  : x.decision || "Voir le motif"
            )}
            <br>
            ${esc(x.reasonDecision || "")}
          </p>
        ` : ""}

        <details>
          <summary>
            Explications (${(x.messages || []).length})
          </summary>

          ${(x.messages || []).map(m => `
            <p>
              <strong>${esc(who(m.uid))}</strong>
              · ${esc(when(m.atMs))}
              <br>
              ${esc(m.text)}
            </p>
          `).join("") || "<p>Aucune explication.</p>"}
        </details>

        <div class="hc-actions" data-evidence></div>
        <div class="hc-actions" data-dispute-actions></div>
      `;

      (x.evidence || []).forEach((file, i) => {
        addButton(
          $("[data-evidence]", item),
          `Voir la preuve ${i + 1}`,
          "evidence:" + file.id,
          () => viewEvidence(x, file)
        );
      });

      if (x.status === "open") {
        const a = $("[data-dispute-actions]", item);

        for (const [title, fn] of [
          ["Ajouter une explication", () => disputeMessage(x)],
          ["Ajouter une preuve", () => disputeEvidence(x)]
        ]) {
          const b = document.createElement("button");

          b.type = "button";
          b.textContent = title;
          b.dataset.lock = "dispute:" + x.id;
          b.onclick = fn;

          a.appendChild(b);
        }
      }

      node.appendChild(item);
    }

    pager(node, disputes, "disputes", renderDisputes);
    sync();
  }

  async function refreshDisputes() {
    const version = ++disputeVersion;

    try {
      const r = await api("/api/merchant/disputes");

      if (version !== disputeVersion) return true;

      if (!Array.isArray(r.disputes)) {
        throw new Error("Liste des dossiers invalide.");
      }

      disputes = r.disputes.filter(
        x => x.merchantUid === user.uid
      );

      renderDisputes();
      return true;

    } catch (e) {
      if (alive() && version === disputeVersion) {
        disputes = [];

        empty(
          $("#dashboard-disputes"),
          "Dossiers indisponibles : " + e.message
        );

        showError(e);
      }

      return false;
    }
  }

  async function refreshAll(checkAccess = true) {
    if (checkAccess) {
      try {
        const fresh = await api("/api/merchant/me");

        if (fresh.uid !== user.uid || !fresh.shop) {
          throw new Error("Accès marchand invalide.");
        }

       me = fresh;
        accessVerified = true;

        if (!deliveryDirty && !locks.has("shop")) {
          try {
            fillDeliveryEditor(me.shop);
          } catch (e) {
            deliveryReady = false;

            empty(
              $("#delivery-rates-list"),
              e.message
            );
          }
        }

        header();
        
      } catch (e) {
        if (alive()) {
          accessVerified = false;
          header();
          showError(e);
        }

        return false;
      }
    }

    const results = await Promise.allSettled([
      refreshSummary(),
      refreshOrders(),
      refreshProducts(),
      refreshDisputes()
    ]);

    return results.every(
      r => r.status === "fulfilled" && r.value === true
    );
  }

  async function downloadReport() {
    validatePeriod();

    if (
      !summary ||
      summary.warnings.length ||
      summaryQuery !== query()
    ) {
      throw new Error(
        "Actualise les données et résous les anomalies signalées " +
        "avant de générer le rapport."
      );
    }

    const selected = summaryQuery;
    const range = { ...summary.range };

    const blob = await api(
      "/api/merchant/report.pdf?" + selected,
      undefined,
      { blob: true }
    );

    const signature = await blob.slice(0, 5).text();

    if (!alive()) return;

    if (signature !== "%PDF-") {
      throw new Error("Le serveur n’a pas renvoyé un PDF valide.");
    }

    if (pdfURL) releaseURL(pdfURL);

    pdfURL = URL.createObjectURL(blob);
    objectURLs.add(pdfURL);

    const node = $("#pdf-download");
    node.innerHTML = "";

    const link = document.createElement("a");

    link.className = "hc-button hc-success";
    link.href = pdfURL;
    link.download = `HaytiClips_${range.from}_${range.to}.pdf`;
    link.target = "_blank";
    link.rel = "noopener";

    link.textContent =
      `Ouvrir / télécharger le PDF · ${range.from} au ${range.to}`;

    node.appendChild(link);
    link.click();

    message(
      "Rapport généré. Sur mobile, utilise aussi le lien " +
      "de téléchargement affiché sous la période.",
      "success"
    );
  }

  $("#report-period").onchange = () => {
    $("#custom-dates").hidden =
      $("#report-period").value !== "custom";

    sync();

    if ($("#report-period").value !== "custom") {
      refreshSummary();
    }
  };

  for (const id of ["date-from", "date-to"]) {
    $("#" + id).onchange = sync;
  }

  $("#refresh-all").onclick = () =>
    task($("#refresh-all"), "refresh", async () => {
      const ok = await refreshAll();

      if (ok) message("Données actualisées.", "success");
    });

  $("#download-report").onclick = () =>
    task($("#download-report"), "pdf", downloadReport);

  $("#order-search").oninput =
  $("#order-filter").onchange = () => {
    pages.orders = 1;
    renderOrders();
  };

  $("#product-search").oninput = () => {
    pages.products = 1;

    if (productsReady) renderProducts();
  };

  header();

  for (const id of [
    "dashboard-stats",
    "sales-chart",
    "best-products",
    "order-chart",
    "finance-stats",
    "dashboard-transactions",
    "dashboard-products",
    "dashboard-orders",
    "dashboard-disputes"
  ]) {
    empty($("#" + id), "Chargement...");
  }

  await refreshAll(false);
}

onAuthStateChanged(auth, user => {
  const epoch = ++session;

  cleanup();
  shell();

  if (!user) {
    location.href = "login.html";
    return;
  }

  boot(user, epoch).catch(error => {
    if (epoch === session) showError(error);
  });
});

window.addEventListener("pagehide", e => {
  if (!e.persisted) cleanup();
});
</script>
