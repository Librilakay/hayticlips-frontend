<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inscription</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  min-height: 30vh;
  position: relative; /* Ajouté pour la bannière absolue */
}

/* ================= BANNIÈRE GMAIL ================= */
.gmail-banner {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  background: #121212;
  border-bottom: 2px solid #ff0050;
  z-index: 100;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
}

.banner-header {
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  background: #1a1a1a;
  color: #fff;
  transition: background 0.2s;
}

.banner-header:active {
  background: #222;
}

#bannerIcon {
  transition: transform 0.4s ease;
  display: inline-block;
  font-size: 12px;
}

.banner-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease, padding 0.5s ease;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  background: #121212;
}

/* Classe ajoutée par JS pour ouvrir la bannière */
.banner-content.open {
  max-height: 150px; 
  padding: 15px 20px;
}

.gmail-icon {
  width: 45px;
  height: 45px;
  object-fit: contain;
  flex-shrink: 0;
}

.banner-text p {
  margin: 0;
  font-size: 13px;
  line-height: 1.4;
  color: #ccc;
}

.banner-text strong {
  color: #ff0050;
}
/* ================= FIN BANNIÈRE ================= */

.container {
  width: 90%;
  max-width: 420px;
  background: #121212;
  padding: 25px;
  border-radius: 16px;
  margin-top: 40px; /* Laisse respirer sous la bannière */
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
  background: black;
  color:white;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  background: #ff0050;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.link {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

.link a {
  color: #ff0050;
  text-decoration: none;
}

.terms {
  margin-top: 12px;
  font-size: 13px;
  text-align: center;
  color: #aaa;
  line-height: 1.5;
}

.terms a {
  color: #ff0050;
  text-decoration: none;
  font-weight: 500;
}

.age-check {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1a1a1a;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 14px;
  cursor: pointer;
  font-size: 14px;
  color: #ddd;
  border: 1px solid #222;
  transition: all 0.2s ease;
}

.age-check:hover {
  border-color: #ff0050;
}

.age-check input {
  display: none;
}

.checkmark {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 2px solid #555;
  display: inline-block;
  position: relative;
  transition: all 0.2s ease;
}

.age-check input:checked + .checkmark {
  background: #ff0050;
  border-color: #ff0050;
}

.age-check input:checked + .checkmark::after {
  content: "✓";
  position: absolute;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  left: 4px;
  top: -1px;
}

input.error {
  border: 2px solid #ff0050;
}
</style>
</head>

<body>

<!-- BANNIÈRE D'INFORMATION GMAIL -->
<div class="gmail-banner">
  <div class="banner-header" id="bannerHeader">
    <span style="display:flex; align-items:center; gap:8px;">⚠️ <span>Information importante</span></span>
    <span id="bannerIcon">▼</span>
  </div>
  <div class="banner-content" id="bannerContent">
    <img src="gmail.jpeg" alt="Gmail App" class="gmail-icon">
    <div class="banner-text">
      <p>L'application <strong>Gmail</strong> est <strong>obligatoire</strong> pour recevoir le lien de vérification et activer votre compte sur HaytiClips.</p>
    </div>
  </div>
</div>

<div class="container">
  <h1>Créer un compte</h1>

  <input type="text" id="prenom" placeholder="Prénom">
  <input type="text" id="nom" placeholder="Nom">
  <input type="email" id="email" placeholder="Email (Gmail uniquement)">
  <input type="password" id="password" placeholder="Mot de passe">
  <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe">
  <input type="tel" id="phone" placeholder="Numéro de téléphone">
  
  <label class="age-check">
  <input type="checkbox" id="ageConfirm">
  <span class="checkmark"></span>
  Je confirme avoir <strong>15 ans ou plus</strong>
</label>

  <button id="signupBtn">S’inscrire</button>
  
  <p class="terms">
  En cliquant sur <strong>S’inscrire</strong>, vous acceptez nos 
  <a href="rules.html" target="_blank">Conditions d’utilisation</a>.
</p>

  <div class="link">
    Déjà un compte ? <a href="login.html">Se connecter</a>
    <div id="recaptcha-container"></div>
  </div>
</div>
        
<!-- SCRIPT POUR L'ANIMATION DE LA BANNIÈRE -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const header = document.getElementById("bannerHeader");
    const content = document.getElementById("bannerContent");
    const icon = document.getElementById("bannerIcon");

    function toggleBanner() {
      content.classList.toggle("open");
      if (content.classList.contains("open")) {
        icon.style.transform = "rotate(180deg)";
      } else {
        icon.style.transform = "rotate(0deg)";
      }
    }

    // Ouvre et ferme au clic
    header.addEventListener("click", toggleBanner);

    // Déploiement automatique et fluide 0.5s après le chargement de la page
    setTimeout(() => {
      if (!content.classList.contains("open")) {
        toggleBanner();
      }
    }, 500);
  });
</script>

<!-- TON SCRIPT FIREBASE MIS À JOUR (CÔTÉ SERVEUR) -->     
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification,
  deleteUser
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
// Plus besoin d'importer Firestore ici, tout se passe sur le serveur !

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const signupBtn = document.getElementById("signupBtn");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");

function formatEmail(val) {
  let cleaned = val.trim().toLowerCase();
  if (cleaned.length > 0 && !cleaned.includes("@")) {
    return cleaned + "@gmail.com";
  }
  return cleaned;
}

emailInput.addEventListener("blur", () => {
  emailInput.value = formatEmail(emailInput.value);
});

phoneInput.addEventListener("focus", () => {
  if (phoneInput.value === "") {
    phoneInput.value = "+509 ";
  }
});

phoneInput.addEventListener("input", (e) => {
  let val = phoneInput.value;
  if (!val.startsWith("+509 ")) {
    if (val.startsWith("+509")) {
      phoneInput.value = "+509 " + val.slice(4).replace(/\s/g, "");
    } else {
      phoneInput.value = "+509 ";
    }
  }
  
  if (phoneInput.value.length > 13) {
    phoneInput.value = phoneInput.value.slice(0, 13);
  }
});

function setButtonState(disabled) {
  signupBtn.disabled = disabled;
  signupBtn.textContent = disabled ? "Patiente..." : "S’inscrire";
}

function cleanName(value) {
  return value
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[^\p{L}\p{N}\s'-]/gu, "");
}

function normalizePhone(phone) {
  return phone.replace(/\s+/g, ""); 
}

function isValidGmail(email) {
  return /^[^\s@]+@gmail\.com$/.test(email);
}

function isValidHaitiPhone(phone) {
  return /^\+509\d{8}$/.test(phone);
}

signupBtn.addEventListener("click", async () => {
  setButtonState(true);

  try {
    const prenom = cleanName(document.getElementById("prenom").value);
    const nom = cleanName(document.getElementById("nom").value);
    
    const rawEmail = emailInput.value;
    const finalEmail = formatEmail(rawEmail);
    emailInput.value = finalEmail; 

    const phone = normalizePhone(phoneInput.value);
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const ageConfirm = document.getElementById("ageConfirm").checked;

    if (!prenom || !nom || !finalEmail || !phone || !password || !confirmPassword) {
      alert("Remplis correctement tous les champs.");
      setButtonState(false);
      return;
    }

    if (prenom.length < 2 || prenom.length > 30 || nom.length < 2 || nom.length > 30) {
      alert("Prénom ou nom invalide.");
      setButtonState(false);
      return;
    }

    if (!ageConfirm) {
      alert("Tu dois confirmer avoir 15 ans ou plus.");
      setButtonState(false);
      return;
    }

    if (!isValidGmail(finalEmail)) {
      alert("⚠️ Erreur : Seules les adresses @gmail.com sont acceptées sur HaytiClips.");
      setButtonState(false);
      return; 
    }

    if (!isValidHaitiPhone(phone)) {
      alert("Numéro haïtien invalide. Il doit comporter 8 chiffres après le +509.");
      setButtonState(false);
      return;
    }

    if (password.length < 6) {
      alert("Mot de passe minimum 6 caractères.");
      setButtonState(false);
      return;
    }

    if (password !== confirmPassword) {
      alert("Les mots de passe ne correspondent pas.");
      setButtonState(false);
      return;
    }

    let userCredential;
    try {
      userCredential = await createUserWithEmailAndPassword(auth, finalEmail, password);
    } catch (authError) {
      if (authError.code === "auth/email-already-in-use") {
        try {
          // APPEL AU SERVEUR POUR VÉRIFIER ET NETTOYER L'EMAIL
          const response = await fetch("https://hayticlip-server.onrender.com/api/check-and-clean-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: finalEmail })
          });
          
          const resData = await response.json();

          if (resData.cleaned) {
            // Le compte orphelin a été supprimé
            alert("Votre connexion est instable, veuillez recréer votre compte.");
            setButtonState(false);
            return; // Arrête la fonction pour forcer l'utilisateur à recliquer (création propre)
          } else {
            // Le document existe vraiment sur Firestore
            throw new Error("Vous avez déjà un compte. Veuillez vous connecter dans la page de connexion.");
          }
        } catch (recoveryError) {
          if (recoveryError.message.includes("déjà un compte")) {
            throw recoveryError; 
          }
          throw new Error("Cette adresse email est déjà utilisée. Si c'est votre compte, connectez-vous.");
        }
      } else {
        throw authError; 
      }
    }
    
    const user = userCredential.user;

    try {
      const token = await user.getIdToken(true);
      const response = await fetch("https://hayticlip-server.onrender.com/api/initUserProfile", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ prenom, nom, phone })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.error || "Impossible de créer le profil.");
      }

    } catch (backendError) {
      console.error("Erreur serveur, nettoyage du compte Auth...", backendError);
      await deleteUser(user).catch(err => console.error("Impossible de supprimer le compte fantôme:", err));
      throw new Error("L'inscription a échoué : " + backendError.message);
    }

    await sendEmailVerification(user, {
      url: "https://hayticlips.com/verify.html"
    });

    alert("🎉 Inscription réussie ! Nous vous avons envoyé un lien de vérification.");
    window.location.href = "login.html"; 

  } catch (error) {
    console.error("SIGNUP ERROR:", error);
    alert(error.message || "Erreur d'inscription. Veuillez réessayer.");
  } finally {
    setButtonState(false);
  }
});
</script>

</body>
</html>
