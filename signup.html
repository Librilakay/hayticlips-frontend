<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inscription</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  min-height:30vh;
}

.container {
  width: 90%;
  max-width: 420px;
  background: #121212;
  padding: 25px;
  border-radius: 16px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
  background: black;
  color:white;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  background: #ff0050;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.link {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
}

.link a {
  color: #ff0050;
  text-decoration: none;
}

.terms {
  margin-top: 12px;
  font-size: 13px;
  text-align: center;
  color: #aaa;
  line-height: 1.5;
}

.terms a {
  color: #ff0050;
  text-decoration: none;
  font-weight: 500;
}

.age-check {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1a1a1a;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 14px;
  cursor: pointer;
  font-size: 14px;
  color: #ddd;
  border: 1px solid #222;
  transition: all 0.2s ease;
}

.age-check:hover {
  border-color: #ff0050;
}

.age-check input {
  display: none;
}

.checkmark {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 2px solid #555;
  display: inline-block;
  position: relative;
  transition: all 0.2s ease;
}

.age-check input:checked + .checkmark {
  background: #ff0050;
  border-color: #ff0050;
}

.age-check input:checked + .checkmark::after {
  content: "✓";
  position: absolute;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  left: 4px;
  top: -1px;
}

input.error {
  border: 2px solid #ff0050;
}
</style>
</head>

<body>

<div class="container">
  <h1>Créer un compte</h1>

  <input type="text" id="prenom" placeholder="Prénom">
  <input type="text" id="nom" placeholder="Nom">
  <input type="email" id="email" placeholder="email: exemple12@gmail.com">
  <input type="password" id="password" placeholder="Mot de passe">
  <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe">
  <input type="tel" id="phone" placeholder="+509XXXXXXXX">
  
  <label class="age-check">
  <input type="checkbox" id="ageConfirm">
  <span class="checkmark"></span>
  Je confirme avoir <strong>15 ans ou plus</strong>
</label>

  <button id="signupBtn">S’inscrire</button>
  
  <p class="terms">
  En cliquant sur <strong>S’inscrire</strong>, vous acceptez nos 
  <a href="rules.html" target="_blank">Conditions d’utilisation</a>.
</p>

  <div class="link">
    Déjà un compte ? <a href="login.html">Se connecter</a>
    <div id="recaptcha-container"></div>
  </div>
</div>
        
        
<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const signupBtn = document.getElementById("signupBtn");

function setButtonState(disabled) {
  signupBtn.disabled = disabled;
  signupBtn.textContent = disabled ? "Patiente..." : "S’inscrire";
}

function cleanName(value) {
  return value
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[^\p{L}\p{N}\s'-]/gu, "");
}

function normalizePhone(phone) {
  return phone.replace(/\s+/g, "");
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function isValidHaitiPhone(phone) {
  return /^\+509\d{8}$/.test(phone);
}

signupBtn.addEventListener("click", async () => {
  setButtonState(true);

  try {
    const prenom = cleanName(document.getElementById("prenom").value);
    const nom = cleanName(document.getElementById("nom").value);
    const email = document.getElementById("email").value.trim().toLowerCase();
    const phone = normalizePhone(document.getElementById("phone").value);
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const ageConfirm = document.getElementById("ageConfirm").checked;

    if (!prenom || !nom || !email || !phone || !password || !confirmPassword) {
      alert("Remplis correctement tous les champs.");
      return;
    }

    if (prenom.length < 2 || prenom.length > 30 || nom.length < 2 || nom.length > 30) {
      alert("Prénom ou nom invalide.");
      return;
    }

    if (!ageConfirm) {
      alert("Tu dois confirmer avoir 15 ans ou plus.");
      return;
    }

    if (!isValidEmail(email)) {
      alert("Email invalide.");
      return;
    }

    if (!isValidHaitiPhone(phone)) {
      alert("Numéro haïtien invalide.");
      return;
    }

    if (password.length < 6) {
      alert("Mot de passe minimum 6 caractères.");
      return;
    }

    if (password !== confirmPassword) {
      alert("Les mots de passe ne correspondent pas.");
      return;
    }

    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    const token = await user.getIdToken(true);

    const response = await fetch("https://hayticlip-server.onrender.com/api/initUserProfile", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        prenom,
        nom,
        phone
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Impossible d'initialiser le profil");
    }

    await sendEmailVerification(user, {
  url: "https://hayticlips.com/verify.html"
});

alert("Vérifie ton email puis clique sur le lien envoyé.");

  } catch (error) {
    console.error("SIGNUP ERROR:", error);

    if (error.code === "auth/email-already-in-use") {
      alert("Cet email est déjà utilisé.");
    } else if (error.code === "auth/invalid-email") {
      alert("Email invalide.");
    } else if (error.code === "auth/weak-password") {
      alert("Mot de passe trop faible.");
    } else {
      alert("Erreur inscription : " + (error.message || error.code));
    }
  } finally {
    setButtonState(false);
  }
});
</script>

</body>
</html>
