<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff0050">
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin - Transferts Manuels</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    body { background: #000; color: #fff; overflow-x: hidden; }

    /* HEADER */
    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 100;
    }
    .header-left {
      position: absolute;
      left: 15px;
      font-size: 22px;
      cursor: pointer;
    }
    .header-center { font-weight: 700; font-size: 16px; }

    /* CONTENEUR GLOBAL */
    .container { padding: 15px; max-width: 900px; margin: 0 auto; }

    /* --- TABLEAU DE BORD (STATS) --- */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stat-title { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-value { font-size: 18px; font-weight: bold; }
    .stat-sub { font-size: 12px; color: #888; margin-top: 4px; }
    
    .color-in { color: #2ecc71; } 
    .color-out { color: #e74c3c; } 
    .color-neutral { color: #3498db; }
    .color-warning { color: #f1c40f; }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 15px;
      border-bottom: 2px solid #333;
      display: flex;
      align-items: center;
      padding-bottom: 8px;
      gap: 8px;
    }

    /* --- CARTES DE DEMANDES --- */
    .lists-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .lists-container { grid-template-columns: 1fr 1fr; }
    }

    .transfer-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
    }
    .deposit-card { border-left: 4px solid #2ecc71; }
    .withdraw-card { border-left: 4px solid #ff0050; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #222;
    }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid transparent; }
    .badge-deposit { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border-color: #2ecc71; }
    .badge-withdraw { background: rgba(255, 0, 80, 0.2); color: #ff0050; border-color: #ff0050; }
    .amount { font-size: 18px; font-weight: bold; }

    .info-row { margin-bottom: 6px; font-size: 13px; color: #bbb; }
    .info-row strong { color: #fff; }
    .highlight-text { color: #2ecc71; font-weight: bold; font-size: 15px; }
    
    /* LIEN UTILISATEUR */
    .user-link {
      color: #00acee;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .user-link:hover { text-decoration: underline; }

    img.receipt {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      margin: 10px 0;
      cursor: pointer;
    }

    /* ACTIONS */
    .action-area { margin-top: 12px; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #000;
      border: 1px solid #444;
      color: white;
      border-radius: 6px;
      font-size: 13px;
    }
    .btn-group { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      color: white;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-approve { background: #2ecc71; color: #000; }
    .btn-reject { background: #e74c3c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .empty-state { text-align: center; color: #666; padding: 40px 20px; font-size: 14px; background: #111; border-radius: 10px; border: 1px dashed #333; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left" onclick="window.location.href='profil.html'">←</div>
    <div class="header-center">💼 Transferts Manuels</div>
  </div>

  <div class="container">
    
    <div class="dashboard">
      <div class="stat-card">
        <div class="stat-title">⏳ Attente (Recharge)</div>
        <div class="stat-value color-warning" id="statPendingDepCount">0</div>
        <div class="stat-sub" id="statPendingDepVol">0 HTG</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">⏳ Attente (Retrait)</div>
        <div class="stat-value color-warning" id="statPendingWitCount">0</div>
        <div class="stat-sub" id="statPendingWitVol">0 HTG</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">✅ Approuvés (Auj.)</div>
        <div class="stat-value color-in" id="statApprovedToday">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">❌ Rejetés (Auj.)</div>
        <div class="stat-value color-out" id="statRejectedToday">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">📈 Volume (Auj.)</div>
        <div class="stat-value color-neutral" id="statVolumeToday">0 HTG</div>
      </div>
    </div>

    <div class="lists-container">
      <div>
        <div class="section-title" style="color: #2ecc71;">📥 Recharges en attente</div>
        <div id="depositList">
          <div class="empty-state">Chargement...</div>
        </div>
      </div>

      <div>
        <div class="section-title" style="color: #ff0050;">📤 Retraits en attente</div>
        <div id="withdrawList">
          <div class="empty-state">Chargement...</div>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, getDoc, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
      authDomain: "tstx-58474.firebaseapp.com",
      projectId: "tstx-58474",
      storageBucket: "tstx-58474.firebasestorage.app",
      messagingSenderId: "1010020144942",
      appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const API_BASE = "https://hayticlip-server.onrender.com";

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "login.html";
      
      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (!userSnap.exists() || userSnap.data().role !== "admin" || userSnap.data().suspended === true) {
  alert("Accès refusé.");
  return window.location.href = "profil.html";
}

      loadPendingTransfers();
      loadTodayStats();
    });

    const formatMoney = n => new Intl.NumberFormat("fr-HT").format(n);
const hcTime = { timeZone: "America/Port-au-Prince" };
const hcProcessing = new Set();
const hcEl = (tag, css, text) => {
  const e = document.createElement(tag);
  if (css) e.className = css;
  if (text !== undefined) e.textContent = text;
  return e;
};

async function hcAdmin(path, payload) {
  const user = auth.currentUser;
  if (!user) throw new Error("Reconnecte-toi.");
  const res = await fetch(API_BASE + path, {
    method: payload ? "POST" : "GET", cache: "no-store",
    headers: {
      Authorization: "Bearer " + await user.getIdToken(),
      ...(payload ? { "Content-Type": "application/json" } : {})
    },
    ...(payload ? { body: JSON.stringify(payload) } : {})
  });
  const result = await res.json().catch(() => null);
  if (!res.ok || !result?.success) throw new Error(result?.error || "Vérifie le statut de la demande.");
  return result;
}

function loadTodayStats() {
  const q = query(collection(db, "manualTransfers"), orderBy("createdAt", "desc"), limit(300));

  onSnapshot(q, snap => {
    const today = new Date().toLocaleDateString("fr-FR", hcTime);
    let approved = 0, rejected = 0, total = 0;

    snap.forEach(d => {
      const t = d.data(), when = t.processedAt?.toDate?.() || t.createdAt?.toDate?.();
      if (!when || when.toLocaleDateString("fr-FR", hcTime) !== today) return;
      if (t.status === "approved") {
        approved++;
        total += Number(t.amountRequested ?? t.amount) || 0;
      }
      if (t.status === "rejected") rejected++;
    });

    document.getElementById("statApprovedToday").textContent = approved;
    document.getElementById("statRejectedToday").textContent = rejected;
    document.getElementById("statVolumeToday").textContent = formatMoney(total) + " HTG";
  });
}

function hcReceiptURL(value) {
  try {
    const u = new URL(value);
    return u.protocol === "https:" && !u.username && !u.password && !u.port &&
      u.hostname.endsWith(".supabase.co") &&
      /^\/storage\/v1\/object\/(?:public\/media|sign\/manual-receipts)\//.test(u.pathname) ? u.href : null;
  } catch { return null; }
}

function loadPendingTransfers() {
  const q = query(collection(db, "manualTransfers"), where("status", "==", "pending"));

  onSnapshot(q, snap => {
    const dep = document.getElementById("depositList"), wit = document.getElementById("withdrawList");
    dep.replaceChildren();
    wit.replaceChildren();

    let depCount = 0, depVol = 0, witCount = 0, witVol = 0;
    const docs = [...snap.docs].sort((a, b) =>
      (a.data().createdAt?.toMillis?.() || 0) - (b.data().createdAt?.toMillis?.() || 0));

    for (const d of docs) {
      const t = d.data(), id = d.id, isDeposit = t.type === "deposit";
      if (!isDeposit && t.type !== "withdraw") continue;

      const method = String(t.method ?? "moncash").trim().toLowerCase();
      const label = method === "moncash" ? "MonCash" : method === "natcash" ? "NatCash" : "";
      const amount = Number(isDeposit ? t.amount : (t.amountRequested ?? t.amount));
      const net = Number(t.amountToReceive), beneficiary = String(t.accountName || "").trim();
      const legacy = t.source !== "server-v2" && !t.legacyReviewedBy;
      const tel = String(t.phone || "").trim();
      const canApprove = !legacy && !!label && Number.isFinite(amount) && amount > 0 &&
        (isDeposit || (/^(?:\+?509)?\d{8}$/.test(tel.replace(/[ .()-]/g, "")) &&
          beneficiary && Number.isFinite(net) && net > 0 && net <= amount));

      if (isDeposit) { depCount++; depVol += Number.isFinite(amount) ? amount : 0; }
      else { witCount++; witVol += Number.isFinite(amount) ? amount : 0; }

      const card = hcEl("div", "transfer-card " + (isDeposit ? "deposit-card" : "withdraw-card"));
      const header = hcEl("div", "card-header");
      header.append(
        hcEl("span", "badge " + (isDeposit ? "badge-deposit" : "badge-withdraw"), label || "Réseau inconnu"),
        hcEl("span", "amount", Number.isFinite(amount) ? formatMoney(amount) + " HTG" : "Montant invalide")
      );

      const profile = hcEl("a", "user-link", "Profil utilisateur");
      profile.href = "profil.html?uid=" + encodeURIComponent(String(t.userId ?? ""));
      card.append(header, profile);
      if (typeof t.userId === "string" && t.userId && !t.userId.includes("/")) {
        getDoc(doc(db, "users", t.userId)).then(u => {
          if (u.exists()) profile.textContent = u.data().username || "Profil utilisateur";
        }).catch(() => {});
      }

      const row = (label, value) => card.append(hcEl("div", "info-row", label + " : " + (value ?? "")));
      row("Téléphone", tel);
      row("Réf. demande", id);
      if (t.createdAt?.toDate) row("Date", t.createdAt.toDate().toLocaleString("fr-FR", hcTime));

      if (!isDeposit) {
        row("Bénéficiaire", beneficiary);
        row("Frais", (t.feeApplied ?? "?") + " HTG");
        row("À envoyer", Number.isFinite(net) ? formatMoney(net) + " HTG" : "Montant invalide");
      } else {
        const preview = hcEl("div");
        const show = url => {
          const safe = hcReceiptURL(url);
          if (!safe) throw new Error("Lien de reçu invalide.");
          const image = hcEl("img", "receipt");
          image.referrerPolicy = "no-referrer";
          image.alt = "Reçu de transfert";
          image.src = safe;
          preview.replaceChildren(image);
        };

        if (t.receiptStorage === "private-v1") {
          const view = hcEl("button", "btn", "Voir le reçu");
          view.type = "button";
          view.onclick = async () => {
            view.disabled = true;
            try { show((await hcAdmin("/api/admin/manual-receipt/" + encodeURIComponent(id))).url); }
            catch (e) { alert(e.message); }
            finally { view.disabled = false; }
          };
          card.append(view, preview);
        } else if (hcReceiptURL(t.receiptUrl)) {
          show(t.receiptUrl);
          card.append(preview);
        }
      }

      if (legacy) {
        const review = hcEl("button", "btn", "Rapprocher l’ancienne demande");
        review.type = "button";
        review.onclick = async () => {
          const reason = prompt(
            "Après vérification du mouvement chez l’opérateur et du journal du portefeuille, décris ce que tu as vérifié (15 caractères minimum)."
          )?.trim();
          if (!reason || reason.length < 15) return;

          review.disabled = true;
          try { await hcAdmin("/api/admin/review-legacy-manual-transfer", { transferId: id, reason }); }
          catch (e) { alert(e.message); }
          finally { review.disabled = false; }
        };
        card.append(review);
      } else {
        const proof = hcEl("input"), reason = hcEl("input");
        proof.type = reason.type = "text";
        proof.maxLength = 80;
        reason.maxLength = 1000;
        proof.placeholder = "Référence réelle du mouvement (si validé)";
        reason.placeholder = "Motif (si refusé)";

        const actions = hcEl("div", "action-area"), group = hcEl("div", "btn-group");
        const yes = hcEl("button", "btn btn-approve", isDeposit ? "Valider l’encaissement" : "Marquer payé");
        const no = hcEl("button", "btn btn-reject", "Refuser");
        yes.type = no.type = "button";
        yes.disabled = !canApprove || hcProcessing.has(id);
        no.disabled = hcProcessing.has(id);

        async function decide(status) {
          if (hcProcessing.has(id)) return;
          const approved = status === "approved";
          const operatorRef = proof.value.trim(), note = reason.value.trim();

          if (approved && (!canApprove || !/^[A-Za-z0-9][A-Za-z0-9._:/-]{3,79}$/.test(operatorRef))) {
            alert("Indique la référence du mouvement relevée chez l’opérateur.");
            return;
          }
          if (!approved && note.length < 5) { alert("Indique un motif de refus."); return; }

          const message = !approved ? "Confirmer le refus ?" : isDeposit
            ? "As-tu vérifié l’encaissement de " + formatMoney(amount) + " HTG dans " + label + " ?"
            : "As-tu déjà envoyé " + formatMoney(net) + " HTG via " + label + " au " + tel + " (" + beneficiary + ") ?";
          if (!confirm(message)) return;

          hcProcessing.add(id);
          yes.disabled = no.disabled = true;
          let done = false;
          try {
            await hcAdmin("/api/admin/process-manual-transfer", {
              transferId: id, status, method, reason: note, operatorRef
            });
            done = true;
          } catch (e) {
            alert(e.message || "Vérifie le statut avant de réessayer.");
          } finally {
            hcProcessing.delete(id);
            if (!done) { yes.disabled = !canApprove; no.disabled = false; }
          }
        }

        yes.onclick = () => void decide("approved");
        no.onclick = () => void decide("rejected");
        group.append(yes, no);
        actions.append(proof, reason, group);
        card.append(actions);
      }

      (isDeposit ? dep : wit).append(card);
    }

    if (!depCount) dep.append(hcEl("div", "empty-state", "Aucune recharge en attente."));
    if (!witCount) wit.append(hcEl("div", "empty-state", "Aucun retrait en attente."));
    document.getElementById("statPendingDepCount").textContent = depCount;
    document.getElementById("statPendingDepVol").textContent = formatMoney(depVol) + " HTG";
    document.getElementById("statPendingWitCount").textContent = witCount;
    document.getElementById("statPendingWitVol").textContent = formatMoney(witVol) + " HTG";
  }, () => {
    for (const id of ["depositList", "withdrawList"]) {
      document.getElementById(id).replaceChildren(hcEl("div", "empty-state", "Chargement impossible."));
    }
  });
}
  </script>
</body>
</html>
