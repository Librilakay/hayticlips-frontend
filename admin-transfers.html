<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff0050">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Transferts Manuels</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    body { background: #000; color: #fff; overflow-x: hidden; }

    /* HEADER */
    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 100;
    }
    .header-left {
      position: absolute;
      left: 15px;
      font-size: 22px;
      cursor: pointer;
    }
    .header-center { font-weight: 700; font-size: 16px; }

    /* CONTENEUR GLOBAL */
    .container { padding: 15px; max-width: 900px; margin: 0 auto; }

    /* --- TABLEAU DE BORD (STATS) --- */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .stat-title { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-value { font-size: 18px; font-weight: bold; }
    .stat-sub { font-size: 12px; color: #888; margin-top: 4px; }
    
    .color-in { color: #2ecc71; } 
    .color-out { color: #e74c3c; } 
    .color-neutral { color: #3498db; }
    .color-warning { color: #f1c40f; }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 15px;
      border-bottom: 2px solid #333;
      display: flex;
      align-items: center;
      padding-bottom: 8px;
      gap: 8px;
    }

    /* --- CARTES DE DEMANDES --- */
    .lists-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .lists-container { grid-template-columns: 1fr 1fr; }
    }

    .transfer-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
    }
    .deposit-card { border-left: 4px solid #2ecc71; }
    .withdraw-card { border-left: 4px solid #ff0050; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #222;
    }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid transparent; }
    .badge-deposit { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border-color: #2ecc71; }
    .badge-withdraw { background: rgba(255, 0, 80, 0.2); color: #ff0050; border-color: #ff0050; }
    .amount { font-size: 18px; font-weight: bold; }

    .info-row { margin-bottom: 6px; font-size: 13px; color: #bbb; }
    .info-row strong { color: #fff; }
    .highlight-text { color: #2ecc71; font-weight: bold; font-size: 15px; }
    
    /* LIEN UTILISATEUR */
    .user-link {
      color: #00acee;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .user-link:hover { text-decoration: underline; }

    img.receipt {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      margin: 10px 0;
      cursor: pointer;
    }

    /* ACTIONS */
    .action-area { margin-top: 12px; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #000;
      border: 1px solid #444;
      color: white;
      border-radius: 6px;
      font-size: 13px;
    }
    .btn-group { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      color: white;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-approve { background: #2ecc71; color: #000; }
    .btn-reject { background: #e74c3c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .empty-state { text-align: center; color: #666; padding: 40px 20px; font-size: 14px; background: #111; border-radius: 10px; border: 1px dashed #333; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left" onclick="window.location.href='profil.html'">←</div>
    <div class="header-center">💼 Transferts Manuels</div>
  </div>

  <div class="container">
    
    <div class="dashboard">
      <div class="stat-card">
        <div class="stat-title">⏳ Attente (Recharge)</div>
        <div class="stat-value color-warning" id="statPendingDepCount">0</div>
        <div class="stat-sub" id="statPendingDepVol">0 HTG</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">⏳ Attente (Retrait)</div>
        <div class="stat-value color-warning" id="statPendingWitCount">0</div>
        <div class="stat-sub" id="statPendingWitVol">0 HTG</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">✅ Approuvés (Auj.)</div>
        <div class="stat-value color-in" id="statApprovedToday">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">❌ Rejetés (Auj.)</div>
        <div class="stat-value color-out" id="statRejectedToday">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">📈 Volume (Auj.)</div>
        <div class="stat-value color-neutral" id="statVolumeToday">0 HTG</div>
      </div>
    </div>

    <div class="lists-container">
      <div>
        <div class="section-title" style="color: #2ecc71;">📥 Recharges en attente</div>
        <div id="depositList">
          <div class="empty-state">Chargement...</div>
        </div>
      </div>

      <div>
        <div class="section-title" style="color: #ff0050;">📤 Retraits en attente</div>
        <div id="withdrawList">
          <div class="empty-state">Chargement...</div>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, getDoc, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
      authDomain: "tstx-58474.firebaseapp.com",
      projectId: "tstx-58474",
      storageBucket: "tstx-58474.firebasestorage.app",
      messagingSenderId: "1010020144942",
      appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const API_BASE = "https://hayticlip-server.onrender.com";

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "login.html";
      
      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (!userSnap.exists() || userSnap.data().role !== "admin") {
        alert("Accès refusé.");
        return window.location.href = "profil.html";
      }

      loadPendingTransfers();
      loadTodayStats();
    });

    const formatMoney = (n) => new Intl.NumberFormat('fr-FR').format(n);

    // 📊 1. CHARGER LES STATS DU JOUR
    function loadTodayStats() {
      // Pour éviter les erreurs d'index, on prend les derniers transferts et on filtre par JavaScript
      const qRecent = query(collection(db, "manualTransfers"), orderBy("createdAt", "desc"), limit(300));
      
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);

      onSnapshot(qRecent, (snap) => {
        let approvedCount = 0;
        let rejectedCount = 0;
        let volumeToday = 0;

        snap.forEach(d => {
          const t = d.data();
          // On vérifie si ça a été traité aujourd'hui (ou créé aujourd'hui)
          const dateToCheck = t.processedAt ? t.processedAt.toDate() : (t.createdAt ? t.createdAt.toDate() : new Date());
          
          if (dateToCheck >= startOfDay) {
            if (t.status === "approved") {
              approvedCount++;
              volumeToday += Number(t.type === 'deposit' ? t.amount : (t.amountRequested || 0));
            } else if (t.status === "rejected") {
              rejectedCount++;
            }
          }
        });

        document.getElementById("statApprovedToday").textContent = formatMoney(approvedCount);
        document.getElementById("statRejectedToday").textContent = formatMoney(rejectedCount);
        document.getElementById("statVolumeToday").textContent = formatMoney(volumeToday) + " HTG";
      });
    }

    // 📋 2. CHARGER LES LISTES EN ATTENTE
    function loadPendingTransfers() {
      const qPending = query(
        collection(db, "manualTransfers"), 
        where("status", "==", "pending"),
        orderBy("createdAt", "asc") // asc pour traiter les plus vieux en premier
      );

      onSnapshot(qPending, (snap) => {
        const depositList = document.getElementById("depositList");
        const withdrawList = document.getElementById("withdrawList");
        
        depositList.innerHTML = "";
        withdrawList.innerHTML = "";

        let depCount = 0, depVol = 0;
        let witCount = 0, witVol = 0;

        if (snap.empty) {
          depositList.innerHTML = `<div class="empty-state">Aucune recharge en attente.</div>`;
          withdrawList.innerHTML = `<div class="empty-state">Aucun retrait en attente.</div>`;
        }

        snap.forEach(d => {
          const t = d.data();
          const transferId = d.id;
          const isDeposit = t.type === 'deposit';
          const dateStr = t.createdAt ? t.createdAt.toDate().toLocaleString('fr-FR') : "Date inconnue";
          
          // Mise à jour des compteurs
          if (isDeposit) {
            depCount++;
            depVol += Number(t.amount || 0);
          } else {
            witCount++;
            witVol += Number(t.amountRequested || t.amount || 0);
          }
          
          const card = document.createElement("div");
          card.className = `transfer-card ${isDeposit ? 'deposit-card' : 'withdraw-card'}`;
          
          let cardHTML = `
            <div class="card-header">
              <span class="badge ${isDeposit ? 'badge-deposit' : 'badge-withdraw'}">
                ${t.method.toUpperCase()}
              </span>
              <span class="amount">${formatMoney(t.amountRequested || t.amount)} HTG</span>
            </div>
            
            <div class="info-row">
              <strong>Utilisateur :</strong> 
              <a href="profil.html?uid=${t.userId}" class="user-link" id="userlink-${transferId}">
                Chargement... 🔗
              </a>
            </div>
            <div class="info-row" style="font-size:11px; color:#666;">UID: ${t.userId}</div>
            <div class="info-row"><strong>Tél :</strong> ${t.phone}</div>
          `;

          if (!isDeposit) {
            cardHTML += `
              <div class="info-row"><strong>Bénéficiaire :</strong> ${t.accountName}</div>
              <div class="info-row"><strong>Frais HaytiClips :</strong> ${t.feeApplied} HTG</div>
              <div class="info-row"><strong>À ENVOYER :</strong> <span class="highlight-text">${formatMoney(t.amountToReceive)} HTG</span></div>
            `;
          }

          cardHTML += `<div class="info-row"><strong>Date :</strong> ${dateStr}</div>`;

          if (isDeposit && t.receiptUrl) {
            cardHTML += `<img src="${t.receiptUrl}" class="receipt" onclick="window.open('${t.receiptUrl}', '_blank')" alt="Reçu">`;
          }

          cardHTML += `
            <div class="action-area">
              <input type="text" id="reason-${transferId}" placeholder="Motif (obligatoire si refusé)">
              <div class="btn-group">
                <button class="btn btn-approve" id="btn-approve-${transferId}" onclick="processTransfer('${transferId}', 'approved')">✓ Accepter</button>
                <button class="btn btn-reject" id="btn-reject-${transferId}" onclick="processTransfer('${transferId}', 'rejected')">✕ Refuser</button>
              </div>
            </div>
          `;

          card.innerHTML = cardHTML;
          
          // Ajouter à la bonne colonne
          if (isDeposit) {
            depositList.appendChild(card);
          } else {
            withdrawList.appendChild(card);
          }

          // 🔄 Récupération asynchrone du nom d'utilisateur
          getDoc(doc(db, "users", t.userId)).then(uSnap => {
            const linkEl = document.getElementById(`userlink-${transferId}`);
            if (linkEl && uSnap.exists()) {
              linkEl.innerHTML = `${uSnap.data().username} 🔗`;
            } else if (linkEl) {
              linkEl.innerHTML = `Utilisateur inconnu 🔗`;
            }
          }).catch(() => {});

        });

        // Afficher Empty state si une des colonnes est vide malgré des données dans l'autre
        if (depCount === 0) depositList.innerHTML = `<div class="empty-state">Aucune recharge en attente.</div>`;
        if (witCount === 0) withdrawList.innerHTML = `<div class="empty-state">Aucun retrait en attente.</div>`;

        // MAJ Stats Attente
        document.getElementById("statPendingDepCount").textContent = formatMoney(depCount);
        document.getElementById("statPendingDepVol").textContent = formatMoney(depVol) + " HTG";
        
        document.getElementById("statPendingWitCount").textContent = formatMoney(witCount);
        document.getElementById("statPendingWitVol").textContent = formatMoney(witVol) + " HTG";
      });
    }

    // ⚡ 3. ACTION (VALIDER/REFUSER)
    window.processTransfer = async (transferId, status) => {
      const reasonInput = document.getElementById(`reason-${transferId}`);
      const reason = reasonInput.value.trim();

      if (status === 'rejected' && !reason) {
        alert("Merci d'indiquer un motif pour le refus (le client le verra).");
        reasonInput.focus();
        return;
      }

      if (!confirm(status === 'approved' ? "Confirmer la VALIDATION définitive ?" : "Confirmer le REFUS définitif ?")) return;

      const btnApprove = document.getElementById(`btn-approve-${transferId}`);
      const btnReject = document.getElementById(`btn-reject-${transferId}`);
      btnApprove.disabled = true;
      btnReject.disabled = true;

      try {
        const token = await auth.currentUser.getIdToken(true);
        const res = await fetch(`${API_BASE}/api/admin/process-manual-transfer`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ transferId, status, reason })
        });

        const result = await res.json();
        if (!result.success) alert(result.error || "Erreur serveur.");
      } catch (err) {
        alert("Erreur de connexion avec le serveur.");
      } finally {
        // En cas d'erreur on réactive les boutons, sinon la carte disparaîtra d'elle-même (grâce au snapshot)
        if (btnApprove) btnApprove.disabled = false;
        if (btnReject) btnReject.disabled = false;
      }
    };
  </script>
</body>
</html>
