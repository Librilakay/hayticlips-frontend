<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications – HaytiClips</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
body{background:#000;color:#fff}

/* HEADER */
.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #222;
  font-weight:600;
  position:sticky;
  top:0;
  background:#000;
  z-index:10;
}

/* LIST */
.notifications{
  padding:15px;
  padding-bottom:90px;
}

.card{
  background:#111;
  border:1px solid #222;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  transition:.2s;
}

.card:hover{background:#1a1a1a}

.card.unread{
  border-left:4px solid #1da1f2;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.content{
  flex:1;
}

.text{
  font-size:14px;
}

.time{
  font-size:12px;
  opacity:.6;
  margin-top:4px;
}

.empty{
  text-align:center;
  opacity:.5;
  margin-top:40px;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#000;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav div{
  font-size:22px;
  cursor:pointer;
  position:relative;
}

.badge-count{
  position:absolute;
  top:-6px;
  right:-10px;
  background:red;
  color:white;
  font-size:10px;
  padding:3px 6px;
  border-radius:50px;
}

/* ===== MESSAGE CARD STYLE ===== */
.card.message{
  border-left:4px solid #ff0050;
  background:linear-gradient(90deg,#111,#141414);
}

.card.message .text strong{
  color:#ff0050;
}

.message-preview{
  font-size:13px;
  opacity:.7;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.online-dot{
  position:absolute;
  bottom:2px;
  right:2px;
  width:10px;
  height:10px;
  background:#2ecc71;
  border-radius:50%;
  border:2px solid #000;
}

.nav-btn{
  width:40px;
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.nav-btn svg{
  width:26px;
  height:26px;
  fill:white;
}

.upload{
  background:white;
  border-radius:8px;
}

.upload svg{
  width:22px;
  height:22px;
}
.card.gift{
  border-left:4px solid gold;
  background:linear-gradient(90deg,#111,#191400);
}
</style>

</head>
<body>

<div class="header" style="justify-content:space-between;padding:0 15px;">
  <span>Notifications</span>

  <svg id="openMessages"
       xmlns="http://www.w3.org/2000/svg"
       width="24"
       height="24"
       viewBox="0 0 24 24"
       fill="white"
       style="cursor:pointer;">
    <path d="M21 6h-18v12h4v4l4-4h10z"/>
  </svg>
</div>

<div class="notifications" id="notificationsContainer"></div>

<div class="nav">

  <div class="nav-btn" onclick="go('feed.html')">
    <svg viewBox="0 0 24 24">
      <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/>
    </svg>
  </div>

  <div class="nav-btn" onclick="go('search.html')">
    <svg viewBox="0 0 24 24">
      <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"
      stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="nav-btn upload" onclick="go('upload.html')">
    <svg viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"
      stroke="black" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="nav-btn" onclick="go('notif.html')" id="notifIcon">
    <svg viewBox="0 0 24 24">
      <path d="M12 22a2 2 0 002-2H10a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5l-2 2h16l-2-2z"/>
    </svg>
  </div>

  <div class="nav-btn" onclick="go('profil.html')">
    <svg viewBox="0 0 24 24">
      <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/>
    </svg>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain:"tstx-58474.firebaseapp.com",
  projectId:"tstx-58474"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const container = document.getElementById("notificationsContainer");
const notifIcon = document.getElementById("notifIcon");

// 🔥 TABLEAU POUR GARDER TRACE DES ÉCOUTES UTILISATEURS
let activeNotifListeners = [];

function closeAllNotifListeners() {
  activeNotifListeners.forEach(unsub => unsub());
  activeNotifListeners = [];
}

onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const q = query(
    collection(db,"notifications"),
    where("to","==",user.uid),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snapshot)=>{
    
    // Nettoyer les écoutes précédentes avant de vider le conteneur
    closeAllNotifListeners();
    container.innerHTML="";
    
    let unreadCount = 0;

    if(snapshot.empty){
      container.innerHTML=`<div class="empty">Aucune notification</div>`;
      updateBadge(0);
      return;
    }

    snapshot.forEach(docSnap=>{
      const data = docSnap.data();

      if(!data.read) unreadCount++;

      const card = document.createElement("div");
      card.className="card";
      card.dataset.id = docSnap.id; // Ajout d'un ID pour le cibler facilement

      if(data.type === "message"){
        card.classList.add("message");
      }
      if(data.type === "gift"){
         card.classList.add("gift");
      }
      if(!data.read) card.classList.add("unread");

      // On affiche par défaut l'image de base (au cas où Firestore est lent)
      let initialAvatar = getNotificationAvatar(data);

      card.innerHTML = `
        <div style="position:relative">
         <img class="avatar" src="${initialAvatar}">
          ${data.fromOnline ? `<div class="online-dot"></div>` : ``}
        </div>

        <div class="content">
          <div class="text">${buildMessage(data)}</div>

          ${data.type === "message" && data.preview 
            ? `<div class="message-preview">${data.preview}</div>` 
            : ``}

          <div class="time">${formatDate(data.createdAt)}</div>
        </div>
      `;

      card.onclick = async ()=>{

        await updateDoc(doc(db,"notifications",docSnap.id),{
          read:true
        });

        if(data.type === "message"){
          location.href = "chat.html?conv=" + data.conversationId;
          return;
        }

        if(data.videoId){
          location.href = "feed.html?videoId="+data.videoId;
          return;
        }

        if(data.type === "follow"){
          location.href = "profil.html?uid="+data.from;
          return;
        }
      };

      container.appendChild(card);

      // 🔥 ÉCOUTE EN TEMPS RÉEL SUR LE PROFIL DE L'EXPÉDITEUR 🔥
      // On ne fait ça que si la notif a été envoyée par un utilisateur spécifique ("from")
      if (data.from && data.type !== "transfer_rejected" && data.type !== "blue_approved" && data.type !== "blue_expired") {
        
        const userRef = doc(db, "users", data.from);
        const unsubUser = onSnapshot(userRef, userSnap => {
          if (!userSnap.exists()) return;
          const userData = userSnap.data();
          
          // Mettre à jour l'avatar visuellement dans cette carte spécifique
          const avatarImg = card.querySelector(".avatar");
          if (avatarImg && userData.avatar) {
            avatarImg.src = userData.avatar;
          }

          // Remplacer le nom d'utilisateur dans le texte (si tu as changé le nom)
          // On reconstruit le message avec le NOUVEAU pseudo
          const textContainer = card.querySelector(".text");
          if (textContainer) {
            // Petite astuce : on crée un "faux" objet data mis à jour
            const updatedData = { ...data, fromUsername: userData.username };
            textContainer.innerHTML = buildMessage(updatedData);
          }
        });
        
        activeNotifListeners.push(unsubUser);
      }

    }); // ✅ ferme forEach

    updateBadge(unreadCount);

  }); // ✅ ferme onSnapshot

}); // ✅ ferme onAuthStateChanged


function getNotificationAvatar(data){
  if(data.type === "transfer_rejected"){
    return "https://cdn-icons-png.flaticon.com/512/564/564619.png"; 
  }
  if(data.type === "blue_approved" || data.type === "blue_expired"){
    return data.userAvatar || data.toAvatar || "default-avatar.png";
  }
  return data.fromAvatar || "default-avatar.png";
}

function formatExpireDate(data){
  if(data.expiresAt?.toDate){
    return data.expiresAt.toDate().toLocaleDateString("fr-FR");
  }
  if(data.createdAt?.toDate){
    const d = data.createdAt.toDate();
    d.setDate(d.getDate() + 30);
    return d.toLocaleDateString("fr-FR");
  }
  return "dans 30 jours";
}

function buildMessage(data){
  switch(data.type){
    case "follow":
      return `<strong>${data.fromUsername}</strong> vous suit`;
    case "like":
      return `<strong>${data.fromUsername}</strong> a aimé votre vidéo`;
    case "comment":
      return `<strong>${data.fromUsername}</strong> a commenté votre vidéo`;
    case "repost":
      return `<strong>${data.fromUsername}</strong> a reposté votre vidéo`;
    case "blue_approved":
      return `Badge Blue activé pour 30 jours<br><span style="color:#888;font-size:12px;">Expire le : ${formatExpireDate(data)}</span>`;
    case "blue_expired":
      return `Votre badge Blue a expiré`;
    case "gift":
      return `<strong>${data.fromUsername}</strong> vous envoie ${data.amount} pour votre vidéo 🎁`;
    case "mention":
      return `<strong>${data.fromUsername}</strong> vous a mentionné`;
    case "message":
      return `<strong>${data.fromUsername}</strong> vous a envoyé un message`;
    case "transfer_rejected":
      return `<strong style="color:#e74c3c;">Transaction Refusée</strong><br><span style="font-size:13px;opacity:0.9;">${data.message}</span>`;
    default:
      return "Nouvelle notification";
  }
}

function updateBadge(count){
  const old = document.querySelector(".badge-count");
  if(old) old.remove();
  if(count>0){
    const badge=document.createElement("div");
    badge.className="badge-count";
    badge.textContent=count;
    notifIcon.appendChild(badge);
  }
}

function formatDate(timestamp){
  if(!timestamp) return "";
  return timestamp.toDate().toLocaleString();
}

document.getElementById("openMessages").onclick = ()=>{
  window.location.href = "conversations.html";
};

window.go=(url)=>location.href=url;

</script>
</body>
</html>
