<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff0050">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Notifications – HaytiClips</title>

<style>
/* ================= RESET ET BLOCAGE PAGE STATIQUE ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000000;
  color: #ffffff;
  overflow: hidden;
  overscroll-behavior-y: none;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ================= HEADER ================= */
.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 0 15px;
  border-bottom:1px solid #1a1a1a;
  font-weight:700;
  font-size: 18px;
  background:#000000;
  flex-shrink: 0;
  z-index:10;
}

/* ================= LISTE DES NOTIFICATIONS ================= */
.notifications{
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  overscroll-behavior-y: contain;
  padding-bottom: 20px;
}

.notifications::-webkit-scrollbar { width: 0; }

.card{
  background:#080808;
  border:1px solid #1a1a1a;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  transition:.1s;
}

.card:active { transform: scale(0.98); }

.card.unread{
  border-left:4px solid #1da1f2;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border: 1px solid #222;
  flex-shrink: 0;
}

.content{
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.text{
  font-size:14px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis; 
}

.message-preview{
  font-size:13px;
  color:#aaa;
  margin-top:4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.time{
  font-size:11px;
  color:#666;
  margin-top:5px;
}

.empty{
  text-align:center;
  color: #666;
  margin-top:60px;
  font-size: 15px;
}

.card.message{
  border-left:4px solid #ff0050;
}
.card.message .text strong{
  color:#ff0050;
}

.card.gift{
  border-left:4px solid #ffd700;
}

.online-dot{
  position:absolute;
  bottom:2px;
  right:2px;
  width:12px;
  height:12px;
  background:#2ecc71;
  border-radius:50%;
  border:2px solid #000;
}

/* ================= NAV BAR MOBILE ================= */
.nav{
  height:90px;
  background:#000000;
  border-top:1px solid #1a1a1a;
  display:flex;
  justify-content:space-around;
  align-items:center;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav div{
  font-size:22px;
  cursor:pointer;
  position:relative;
}

.badge-count{
  position:absolute;
  top:-4px;
  right:-8px;
  background:#ff0050;
  color:white;
  font-size:10px;
  font-weight:bold;
  padding:3px 6px;
  border-radius:50px;
}

.nav-btn{
  width:45px;
  height:45px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.nav-btn svg{
  width:26px;
  height:26px;
  fill:white;
}

.upload{
  background:white;
  border-radius:10px;
  width: 44px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.upload svg{
  width:22px;
  height:22px;
  fill: black;
}
</style>
</head>
<body>

<div class="header">
  <span>Notifications</span>
  <div style="display: flex; gap: 15px; align-items: center;">
    <span id="markAllReadBtn" style="font-size: 13px; font-weight: 500; color: #1da1f2; cursor: pointer; background: #1a1a1a; padding: 4px 10px; border-radius: 12px;">Tout lu</span>
    <svg id="openMessages" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white" style="cursor:pointer;">
      <path d="M21 6h-18v12h4v4l4-4h10z"/>
    </svg>
  </div>
</div>

<div class="notifications" id="notificationsContainer"></div>

<div class="nav">
  <div class="nav-btn" onclick="go('feed.html')">
    <svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
  </div>
  <div class="nav-btn" onclick="go('search.html')">
    <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="nav-btn upload" onclick="go('upload.html')">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="black" stroke-width="2.5" stroke-linecap="round"/></svg>
  </div>
  <div class="nav-btn" onclick="go('notif.html')" id="notifIcon">
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
  </div>
  <div class="nav-btn" onclick="go('profil.html')">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  getDocs,
  writeBatch,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const messaging = getMessaging(app);

// 🔔 CONFIGURATION CLÉ VAPID FIREBASE
// Remplace cette clé par la VAPID KEY de ta console Firebase Cloud Messaging
const VAPID_KEY = "BGg-uKOpPvj6zFPfJ7MBW2Yopg_SixHzhXh2H9x5zRn6kBuUIj8BlK-2MU-yn8hlNTZFhegaHcqDWySIaop7m9c"; 

const container = document.getElementById("notificationsContainer");
const notifIcon = document.getElementById("notifIcon");

let activeNotifListeners = [];

function closeAllNotifListeners() {
  activeNotifListeners.forEach(unsub => unsub());
  activeNotifListeners = [];
}

// Function d'activation des Notifications Push
async function setupPushNotifications(user) {
  try {
    // 👇 1. AJOUT DE LA VÉRIFICATION ICI 👇
    if (!("Notification" in window)) {
      console.warn("Ce navigateur ou appareil ne supporte pas les notifications Web Push.");
      return; // On arrête la fonction ici pour éviter le crash
    }
    // 👆 FIN DE LA VÉRIFICATION 👆

    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
      // Enregistre le service worker
      const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      
      const currentToken = await getToken(messaging, { 
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: registration 
      });

      if (currentToken) {
        console.log("Token FCM obtenu:", currentToken);
        // Sauvegarde du token dans Firestore sous le document utilisateur
        await setDoc(doc(db, "users", user.uid), {
          fcmToken: currentToken
        }, { merge: true });
      }
    }
  } catch (error) {
    console.error("Erreur d'activation des notifications push :", error);
  }
}

// Écoute des notifications en temps réel si l'application est ouverte à l'écran
onMessage(messaging, (payload) => {
  console.log("Notification reçue en premier plan :", payload);
});

onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  // Activer FCM Push
  setupPushNotifications(user);

  const q = query(
    collection(db,"notifications"),
    where("to","==",user.uid),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snapshot)=>{
    closeAllNotifListeners();
    container.innerHTML="";
    
    let unreadCount = 0;

    if(snapshot.empty){
      container.innerHTML=`<div class="empty">Aucune notification</div>`;
      updateBadge(0);
      return;
    }

    snapshot.forEach(docSnap=>{
      const data = docSnap.data();
      if(!data.read) unreadCount++;

      const card = document.createElement("div");
      card.className="card";
      card.dataset.id = docSnap.id; 

      if(data.type === "message") card.classList.add("message");
      if(data.type === "gift") card.classList.add("gift");
      if(!data.read) card.classList.add("unread");

      let initialAvatar = getNotificationAvatar(data);

      card.innerHTML = `
        <div style="position:relative; flex-shrink: 0;">
         <img class="avatar" src="${initialAvatar}">
          ${data.fromOnline ? `<div class="online-dot"></div>` : ``}
        </div>

        <div class="content">
          <div class="text">${buildMessage(data)}</div>
          ${data.type === "message" && data.preview ? `<div class="message-preview">${data.preview}</div>` : ``}
          <div class="time">${formatDate(data.createdAt)}</div>
        </div>
      `;

      card.onclick = async ()=>{
        await updateDoc(doc(db,"notifications",docSnap.id),{ read:true });
        if(data.type === "message") return location.href = "chat.html?conv=" + data.conversationId;
        if(data.videoId) return location.href = "feed.html?videoId="+data.videoId;
        if(data.type === "follow") return location.href = "profil.html?uid="+data.from;
      };

      container.appendChild(card);

      if (
        data.from && 
        data.type !== "transfer_rejected" && 
        data.type !== "blue_approved" && 
        data.type !== "blue_expired" &&
        data.type !== "wallet_frozen" && 
        data.type !== "wallet_unfrozen"
      ) {
        const userRef = doc(db, "users", data.from);
        const unsubUser = onSnapshot(userRef, userSnap => {
          if (!userSnap.exists()) return;
          const userData = userSnap.data();
          
          const avatarImg = card.querySelector(".avatar");
          if (avatarImg && userData.avatar) avatarImg.src = userData.avatar;

          const textContainer = card.querySelector(".text");
          if (textContainer) {
            const updatedData = { ...data, fromUsername: userData.username };
            textContainer.innerHTML = buildMessage(updatedData);
          }
        });
        activeNotifListeners.push(unsubUser);
      }
    });

    updateBadge(unreadCount);
  });
});

function getNotificationAvatar(data){
  if(data.type === "transfer_rejected") return "https://cdn-icons-png.flaticon.com/512/564/564619.png"; 
  if(data.type === "wallet_frozen") return "https://cdn-icons-png.flaticon.com/512/2913/2913133.png"; 
  if(data.type === "wallet_unfrozen") return "https://cdn-icons-png.flaticon.com/512/2913/2913520.png"; 
  if(data.type === "blue_approved" || data.type === "blue_expired") return data.userAvatar || data.toAvatar || "default-avatar.png";
  return data.fromAvatar || "default-avatar.png";
}

function formatExpireDate(data){
  if(data.expiresAt?.toDate) return data.expiresAt.toDate().toLocaleDateString("fr-FR");
  if(data.createdAt?.toDate){
    const d = data.createdAt.toDate();
    d.setDate(d.getDate() + 30);
    return d.toLocaleDateString("fr-FR");
  }
  return "dans 30 jours";
}

function buildMessage(data){
  switch(data.type){
    case "follow": return `<strong>${data.fromUsername}</strong> vous suit`;
    case "like": return `<strong>${data.fromUsername}</strong> a aimé votre vidéo`;
    case "comment": return `<strong>${data.fromUsername}</strong> a commenté votre vidéo`;
    case "repost": return `<strong>${data.fromUsername}</strong> a reposté votre vidéo`;
    
    case "comment_like": return `<strong>${data.fromUsername}</strong> a liké ton commentaire`;
    case "reply": return `<strong>${data.fromUsername}</strong> a répondu à ton commentaire`;
    
    case "blue_approved": return `Badge Blue activé pour 30 jours<br><span style="color:#888;font-size:12px;">Expire le : ${formatExpireDate(data)}</span>`;
    case "blue_expired": return `Votre badge Blue a expiré`;
    case "gift": return `<strong>${data.fromUsername}</strong> vous envoie ${data.amount} Gdes pour votre vidéo 🎁`;
    case "mention": return `<strong>${data.fromUsername}</strong> vous a mentionné`;
    case "message": return `<strong>${data.fromUsername}</strong> vous a envoyé un message`;
    case "transfer_rejected": return `<strong style="color:#e74c3c;">Transaction Refusée</strong><br><span style="font-size:13px;opacity:0.9;">${data.message}</span>`;
    
    case "wallet_frozen": return `<strong style="color:#e74c3c;">Compte Gelé </strong><br><span style="font-size:13px;opacity:0.9;">Votre wallet a été bloqué et votre balance a été mise en sécurité.</span>`;
    case "wallet_unfrozen": return `<strong style="color:#2ecc71;">Compte Dégelé </strong><br><span style="font-size:13px;opacity:0.9;">Votre wallet est à nouveau actif et votre argent a été restauré.</span>`;
    
    default: return "Nouvelle notification";
  }
}

function updateBadge(count){
  const old = document.querySelector(".badge-count");
  if(old) old.remove();
  if(count>0){
    const badge = document.createElement("div");
    badge.className="badge-count";
    badge.textContent=count > 99 ? "99+" : count;
    notifIcon.appendChild(badge);
  }
}

function formatDate(timestamp){
  if(!timestamp) return "";
  const date = timestamp.toDate();
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMins / 60);
  const diffDays = Math.floor(diffHours / 24);

  if(diffMins < 60) return `Il y a ${diffMins} min`;
  if(diffHours < 24) return `Il y a ${diffHours} h`;
  if(diffDays === 1) return `Hier`;
  return date.toLocaleDateString();
}

document.getElementById("markAllReadBtn").onclick = async () => {
  const user = auth.currentUser;
  if (!user) return;

  try {
    const q = query(
      collection(db, "notifications"),
      where("to", "==", user.uid),
      where("read", "==", false)
    );
    const snap = await getDocs(q);
    
    if (snap.empty) return;

    const batch = writeBatch(db);
    snap.forEach(docSnap => {
      batch.update(docSnap.ref, { read: true });
    });
    
    await batch.commit();
    console.log("Toutes les notifications marquées comme lues !");
    
  } catch (err) {
    console.error("Erreur Tout lu:", err);
  }
};

document.getElementById("openMessages").onclick = ()=>{ window.location.href = "conversations.html"; };
window.go = (url) => location.href = url;
</script>
</body>
</html>
