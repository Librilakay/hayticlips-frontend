<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gestion des rôles – HaytiClips</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.page{
  flex:1;
  padding:0 16px 80px;
  max-width:1000px;
  width:100%;
  margin:0 auto;
}

/* HEADER */
.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #222;
  background:#000;
  position:sticky;
  top:0;
  z-index:10;
  margin:0 -16px 20px;
}

.topbar p{
  flex:1;
  text-align:center;
  font-size:18px;
  font-weight:700;
}
.topbar a{
  font-size: 20px;
  border: 2px solid;
  color: black;
  background: #ff0050;
  border-radius: 10px;
  width:90px;
  text-align:center;
  text-decoration:none;
}

.topbar::after{
  content:"";
  width:40px;
  display:block;
}

.back-btn{
  width:40px;
  height:40px;
  background:none;
  border:none;
  color:#fff;
  font-size:24px;
  cursor:pointer;
  padding:0;
  border-radius:0;
}

/* HERO SIMPLE */
.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:22px;
  font-weight:700;
  text-align:center;
  margin-bottom:10px;
}

.hero p{
  color:#aaa;
  font-size:14px;
  line-height:1.5;
  text-align:center;
}

/* SEARCH */
.search-box{
  margin-top:18px;
}

.search-box input{
  width:100%;
  padding:12px 16px;
  border-radius:12px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  border-color:#ff0050;
}

/* RESULTS */
.results{
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* CARD */
.card{
  background:#000;
  border:1px solid #222;
  border-radius:16px;
  padding:16px;
}

.user-main{
  display:flex;
  align-items:flex-start;
  gap:12px;
  cursor:pointer;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #333;
  background:#111;
  flex-shrink:0;
}

.meta{
  flex:1;
  min-width:0;
}

.user-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:6px;
}

.username{
  font-size:16px;
  font-weight:700;
  word-break:break-word;
}

.uid{
  font-size:12px;
  color:#777;
  word-break:break-all;
  margin-bottom:6px;
}

.bio{
  font-size:13px;
  color:#aaa;
  line-height:1.5;
  word-break:break-word;
}

/* META */
.meta-box{
  margin-top:10px;
  padding:12px;
  background:#111;
  border:1px solid #222;
  border-radius:12px;
}

.meta-line{
  font-size:13px;
  color:#d4d4d8;
  line-height:1.5;
  word-break:break-word;
  margin-top:4px;
}

/* PILLS */
.role-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  border:1px solid #333;
  background:#1a1a1a;
}

.role-admin{
  color:#7fccff;
  border-color:rgba(29,161,242,.35);
  background:rgba(29,161,242,.12);
}

.role-moderator{
  color:#ffcf70;
  border-color:rgba(255,176,32,.35);
  background:rgba(255,176,32,.12);
}

.role-badge{
  color:#6ff0b6;
  border-color:rgba(25,195,125,.35);
  background:rgba(25,195,125,.12);
}

.role-merchant{
  color:#d5b3ff;
  border-color:rgba(155,89,255,.35);
  background:rgba(155,89,255,.12);
}

.role-user{
  color:#ddd;
}

.role-parrain{
  color:#ff7ac3;
  border-color:rgba(255,0,80,.35);
  background:rgba(255,0,80,.12);
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

button{
  border:none;
  border-radius:30px;
  padding:10px 16px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.btn-moderator{
  background:#ffb020;
  color:#111;
}

.btn-badge{
  background:#19c37d;
  color:#fff;
}

.btn-merchant{
  background:#9b59ff;
  color:#fff;
}

.btn-parrain{
  background:#ff0050;
  color:#fff;
}

.btn-remove{
  background:#ff4d4d;
  color:#fff;
}

button:disabled{
  background:#444;
  cursor:not-allowed;
}

/* EMPTY / MESSAGE */
.empty{
  text-align:center;
  color:#aaa;
  padding:24px 16px;
  border:1px solid #222;
  border-radius:16px;
  background:#111;
}

.message{
  margin-top:16px;
  text-align:center;
  color:#aaa;
  font-size:14px;
}

/* MOBILE */
@media(max-width:640px){
  .hero h1{
    font-size:20px;
  }

  .actions{
    flex-direction:column;
  }

  .actions button{
    width:100%;
  }
}
</style>
</head>
<body>

<div class="page">

  <div class="topbar">
    <button class="back-btn" onclick="history.back()">←</button>
    <p>Gestion des rôles</p>
    <a href="admin-finance.html">Finance</a> 
  </div>

  <div class="hero">
    <div class="search-box">
     <input
  type="search"
  id="searchInput"
  maxlength="128"
  autocomplete="off"
  autocapitalize="off"
  autocorrect="off"
  spellcheck="false"
  placeholder="UID exact ou début du nom d’utilisateur"
>
    </div>
  </div>

  <div class="results" id="results"></div>
  <div class="message" id="statusMsg" role="status" aria-live="polite"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const API_BASE = "https://hayticlip-server.onrender.com";

const results = document.getElementById("results");
const searchInput = document.getElementById("searchInput");
const statusMsg = document.getElementById("statusMsg");

let allUsers = [];
let currentAdminUid = null;
let searchTimer = null;
let searchController = null;
let searchVersion = 0;

const processingIds = new Set();

searchInput.disabled = true;
renderEmpty("Vérification de la connexion...");

function escapeHTML(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function setMessage(text, type = "") {
  statusMsg.textContent = text;

  statusMsg.style.color = type === "error"
    ? "#ff4d4d"
    : type === "success"
      ? "#19c37d"
      : "#aaa";
}

function renderEmpty(text) {
  results.innerHTML = `
    <div class="empty">${escapeHTML(text)}</div>
  `;
}

function getAvatar(user) {
  const fallback =
    `https://i.pravatar.cc/150?u=${encodeURIComponent(user.id)}`;

  try {
    const url = new URL(
      user.avatar || fallback,
      window.location.origin
    );

    return url.protocol === "https:" ? url.href : fallback;
  } catch {
    return fallback;
  }
}

function getRolePill(role) {
  const labels = {
    admin: ["role-admin", "ADMIN"],
    moderator: ["role-moderator", "MODERATOR"],
    badge_manager: ["role-badge", "BADGE MANAGER"],
    merchant_manager: ["role-merchant", "MERCHANT MANAGER"]
  };

  const [className, label] =
    Object.prototype.hasOwnProperty.call(labels, role)
      ? labels[role]
      : ["role-user", "USER"];

  return `
    <span class="role-pill ${className}">${label}</span>
  `;
}

async function apiRequest(path, options = {}) {
  const user = auth.currentUser;

  if (!user || user.uid !== currentAdminUid) {
    throw Object.assign(
      new Error("Session expirée"),
      { status: 401 }
    );
  }

  const token = await user.getIdToken();

  if (auth.currentUser?.uid !== user.uid) {
    throw Object.assign(
      new Error("Session modifiée"),
      { status: 401 }
    );
  }

  const headers = {
    "Accept": "application/json",
    "Authorization": "Bearer " + token
  };

  if (options.body !== undefined) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(API_BASE + path, {
    method: options.method || "GET",
    headers,
    cache: "no-store",
    signal: options.signal,
    body: options.body === undefined
      ? undefined
      : JSON.stringify(options.body)
  });

  let data;

  try {
    data = await response.json();
  } catch {
    throw Object.assign(
      new Error(
        "Réponse serveur invalide. Réessaie dans un instant."
      ),
      { status: response.status }
    );
  }

  if (!response.ok || data?.success !== true) {
    throw Object.assign(
      new Error(
        data?.error || "Requête refusée par le serveur"
      ),
      { status: response.status }
    );
  }

  return data;
}

function updateButtons(uid) {
  for (const card of results.children) {
    if (card.dataset.uid !== uid) continue;

    card.querySelectorAll("button[data-role]")
      .forEach(button => {
        button.disabled = processingIds.has(uid);
      });
  }
}

function renderUsers(list) {
  results.innerHTML = "";

  if (!list.length) {
    renderEmpty(
      searchInput.value.trim()
        ? "Aucun utilisateur trouvé."
        : "Aucun compte avec un rôle particulier."
    );
    return;
  }

  for (const user of list) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.uid = user.id;

    card.innerHTML = `
      <div class="user-main" role="link" tabindex="0">
        <img
          src="${escapeHTML(getAvatar(user))}"
          class="avatar"
          alt=""
        >

        <div class="meta">
          <div class="user-row">
            <div class="username">
              ${escapeHTML(user.username || "Sans nom")}
            </div>

            ${getRolePill(user.role)}
          </div>

          <div class="uid">
            ${escapeHTML(user.id)}
          </div>

          <div class="meta-box">
            <div class="meta-line">
              <strong>Rôle :</strong>
              ${escapeHTML(user.role)}
            </div>
          </div>
        </div>
      </div>

      <div class="actions"></div>
    `;

    const profile = card.querySelector(".user-main");

    profile.addEventListener("click", () => {
      window.openUserProfile(user.id);
    });

    profile.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        window.openUserProfile(user.id);
      }
    });

    const actions = card.querySelector(".actions");

    function addAction(label, className, role) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = className;
      button.textContent = label;
      button.dataset.role = role;
      button.disabled = processingIds.has(user.id);

      button.addEventListener("click", () => {
        window.setRole(user.id, role);
      });

      actions.appendChild(button);
    }

    if (
      user.role !== "admin" &&
      user.id !== currentAdminUid
    ) {
      if (user.role !== "moderator") {
        addAction(
          "Nommer modérateur",
          "btn-moderator",
          "moderator"
        );
      }

      if (user.role !== "badge_manager") {
        addAction(
          "Nommer Badge Manager",
          "btn-badge",
          "badge_manager"
        );
      }

      if (user.role !== "merchant_manager") {
        addAction(
          "Nommer Merchant Manager",
          "btn-merchant",
          "merchant_manager"
        );
      }

      if ([
        "moderator",
        "badge_manager",
        "merchant_manager"
      ].includes(user.role)) {
        addAction(
          "Enlever fonction",
          "btn-remove",
          "user"
        );
      }
    }

    if (user.id === currentAdminUid) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "btn-remove";
      button.textContent = "Votre compte admin";
      button.disabled = true;

      actions.appendChild(button);
    }

    results.appendChild(card);
  }
}

async function loadUsers(notice = "") {
  clearTimeout(searchTimer);
  searchController?.abort();

  const controller = new AbortController();
  searchController = controller;

  const version = ++searchVersion;
  const adminUid = currentAdminUid;
  const search = searchInput.value.trim();

  allUsers = [];
  results.setAttribute("aria-busy", "true");

  renderEmpty("Chargement...");

  setMessage(
    notice || "Recherche en cours...",
    notice ? "success" : ""
  );

  try {
    const data = await apiRequest(
      "/api/merchant/admin/users?search=" +
        encodeURIComponent(search),
      { signal: controller.signal }
    );

    if (
      version !== searchVersion ||
      adminUid !== currentAdminUid
    ) return;

    if (!Array.isArray(data.users)) {
      throw new Error("Liste reçue invalide");
    }

    allUsers = data.users
      .filter(user =>
        user &&
        typeof user.uid === "string" &&
        user.uid
      )
      .map(user => ({
        id: user.uid,
        username: String(user.username || "Sans nom"),
        avatar: String(user.avatar || ""),
        role: String(user.role || "user")
      }))
      .sort((a, b) =>
        a.username.localeCompare(b.username, "fr")
      );

    renderUsers(allUsers);

    const message = search
      ? `${allUsers.length} résultat(s). Précise la recherche si nécessaire.`
      : "Rôles particuliers affichés. Recherche par UID exact ou début du nom.";

    setMessage(
      notice || message,
      notice ? "success" : ""
    );

  } catch (error) {
    if (
      error.name === "AbortError" ||
      version !== searchVersion ||
      adminUid !== currentAdminUid
    ) return;

    if (error.status === 401 || error.status === 403) {
      window.location.href = error.status === 401
        ? "login.html"
        : "feed.html";
      return;
    }

    allUsers = [];
    renderEmpty("Impossible de charger la liste.");

    setMessage(
      notice
        ? notice + " La liste n’a pas pu être actualisée. Relance la recherche."
        : "Chargement impossible. Vérifie ta connexion et relance la recherche.",
      "error"
    );

  } finally {
    if (version === searchVersion) {
      results.setAttribute("aria-busy", "false");
    }
  }
}

window.openUserProfile = uid => {
  window.location.href =
    "profil.html?uid=" + encodeURIComponent(uid);
};

window.setRole = async (uid, role) => {
  if (processingIds.has(uid)) return;

  if (uid === currentAdminUid) {
    setMessage(
      "Impossible de modifier votre propre compte admin ici.",
      "error"
    );
    return;
  }

  if (![
    "user",
    "moderator",
    "badge_manager",
    "merchant_manager"
  ].includes(role)) {
    setMessage("Rôle non autorisé.", "error");
    return;
  }

  const adminUid = currentAdminUid;

  processingIds.add(uid);
  updateButtons(uid);
  setMessage("Modification en cours...");

  try {
    await apiRequest("/api/merchant/admin/set-role", {
      method: "POST",
      body: {
        targetUid: uid,
        role
      }
    });

    if (adminUid !== currentAdminUid) return;

    await loadUsers(
      role === "user"
        ? "Fonction retirée."
        : "Rôle mis à jour."
    );

  } catch (error) {
    if (adminUid !== currentAdminUid) return;

    if (error.status === 401) {
      window.location.href = "login.html";
      return;
    }

    setMessage(
      error.status === 403
        ? "Action refusée : " + error.message
        : "Modification non confirmée. Relance la recherche pour vérifier le rôle actuel.",
      "error"
    );

  } finally {
    processingIds.delete(uid);
    updateButtons(uid);
  }
};

window.removeRole = uid => {
  return window.setRole(uid, "user");
};

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchController?.abort();
  searchVersion++;

  if (!currentAdminUid) return;

  allUsers = [];
  results.setAttribute("aria-busy", "true");
  renderEmpty("Recherche en cours...");

  searchTimer = setTimeout(() => {
    loadUsers();
  }, 350);
});

onAuthStateChanged(auth, async user => {
  clearTimeout(searchTimer);
  searchController?.abort();
  searchVersion++;

  allUsers = [];
  currentAdminUid = user?.uid || null;

  searchInput.disabled = !user;
  results.innerHTML = "";

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  await loadUsers();
});
</script>

</body>
</html>
