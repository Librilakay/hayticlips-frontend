<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modifier le profil – HaytiClips</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER (identique à profil.html) */
    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #222;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      font-size: 24px;
      cursor: pointer;
      width: 40px;
    }

    .header-center {
      font-weight: 700;
      font-size: 18px;
    }

    .header-right {
      width: 40px;
    }

    /* CONTENEUR PRINCIPAL */
    .container {
      flex: 1;
      padding: 20px 16px;
      padding-bottom: 80px; /* pour la navigation */
    }

    /* AVATAR */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .avatar-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #333;
      margin-bottom: 15px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-preview .placeholder {
      color: #555;
      font-size: 14px;
    }

    .avatar-actions {
      display: flex;
      gap: 15px;
    }

    .avatar-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .avatar-btn:hover {
      background: #333;
    }

    /* FORMULAIRE */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #aaa;
      margin-bottom: 5px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #ff0050;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .info-text {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    /* BOUTON SAUVEGARDER */
    .save-btn {
      width: 100%;
      padding: 16px;
      background: #ff0050;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: opacity 0.2s;
    }

    .save-btn:disabled {
      background: #444;
      cursor: not-allowed;
    }

    /* MESSAGES */
    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #00a86b20;
      border: 1px solid #00a86b;
      color: #00d084;
      display: block;
    }

    .message.error {
      background: #ff4d4d20;
      border: 1px solid #ff4d4d;
      color: #ff4d4d;
      display: block;
    }

    /* LIEN MOT DE PASSE */
    .password-link {
      text-align: center;
      margin-top: 25px;
    }

    .password-link a {
      color: #ff0050;
      text-decoration: none;
      font-size: 14px;
    }



    .nav div {
      font-size: 22px;
      cursor: pointer;
    }

    /* Cache le input file */
    #avatarFile {
      display: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left" onclick="history.back()">←</div>
    <div class="header-center">Modifier le profil</div>
    <div class="header-right"></div>
  </div>

  <!-- CONTENU -->
  <div class="container">
    <div id="message" class="message"></div>

    <!-- AVATAR -->
    <div class="avatar-section">
      <div class="avatar-preview" id="avatarPreview">
        <img id="avatarImg" src="" alt="Avatar" style="display: none;">
        <span class="placeholder" id="avatarPlaceholder">Photo</span>
      </div>
      <div class="avatar-actions">
        <div class="avatar-btn" id="changeAvatarBtn">Changer</div>
        <div class="avatar-btn" id="removeAvatarBtn">Supprimer</div>
      </div>
    </div>

    <!-- FORMULAIRE -->
    <div class="form-group">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="ex: jean_duval" maxlength="30">
      <div class="info-text">Peut être modifié tous les 90 jours</div>
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea id="bio" placeholder="Parle-nous de toi..."></textarea>
    </div>

    <button class="save-btn" id="saveBtn">Enregistrer</button>

  </div>



  <!-- INPUT CACHÉ POUR L'AVATAR -->
  <input type="file" id="avatarFile" accept="image/*">

  <!-- SCRIPTS -->
  <script type="module">
    // ========== IMPORTS ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { collection, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ========== CONFIGURATION ==========
    // Firebase (identique à profil.html)
    const firebaseConfig = {
      apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
      authDomain: "tstx-58474.firebaseapp.com",
      projectId: "tstx-58474",
      storageBucket: "tstx-58474.firebasestorage.app",
      messagingSenderId: "1010020144942",
      appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
    };

    // Supabase (à remplacer par vos identifiants)
    const supabaseUrl = "https://nxpifzslxoigcuuhslox.supabase.co";    // ← REMPLACEZ
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54cGlmenNseG9pZ2N1dWhzbG94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MTgwODgsImV4cCI6MjA4NTk5NDA4OH0.yYQ3nQn6Z0ZCC9ZjuHt_HGJbf1CQVPHlz-b6nnEhFqg";                    // ← REMPLACEZ
    const supabase = createClient(supabaseUrl, supabaseKey);
    const BUCKET_NAME = "media";                    // Nom du bucket (à créer)

    // Initialisation Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ========== ÉLÉMENTS DOM ==========
    const messageEl = document.getElementById("message");
    const avatarImg = document.getElementById("avatarImg");
    const avatarPlaceholder = document.getElementById("avatarPlaceholder");
    const usernameInput = document.getElementById("username");
    const bioInput = document.getElementById("bio");
    const saveBtn = document.getElementById("saveBtn");
    const changeAvatarBtn = document.getElementById("changeAvatarBtn");
    const removeAvatarBtn = document.getElementById("removeAvatarBtn");
    const avatarFile = document.getElementById("avatarFile");

    // ========== ÉTAT ==========
    let currentUser = null;
    let currentUserData = null;
    let selectedAvatarFile = null;
    let avatarChanged = false;
    let avatarRemoved = false;

    // ========== FONCTIONS ==========
    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }

    // Charger les données utilisateur
    async function loadUserData() {
      if (!currentUser) return;

      try {
        const userRef = doc(db, "users", currentUser.uid);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
          currentUserData = userSnap.data();
          usernameInput.value = currentUserData.username || "";
          bioInput.value = currentUserData.bio || "";

          // Afficher l'avatar
          if (currentUserData.avatar) {
            avatarImg.src = currentUserData.avatar;
            avatarImg.style.display = "block";
            avatarPlaceholder.style.display = "none";
          } else {
            avatarImg.style.display = "none";
            avatarPlaceholder.style.display = "block";
          }
        }
      } catch (error) {
        console.error("Erreur chargement utilisateur:", error);
        showMessage("Erreur lors du chargement du profil", "error");
      }
    }

    // Upload d'un fichier vers Supabase
    async function uploadAvatar(file, userId) {
      const fileExt = file.name.split('.').pop();
      const fileName = `avatars/${userId}/${Date.now()}.${fileExt}`;

      const { data, error } = await supabase.storage
        .from(BUCKET_NAME)
        .upload(fileName, file, { upsert: true });

      if (error) throw error;

      // Récupérer l'URL publique
      const { data: urlData } = supabase.storage
        .from(BUCKET_NAME)
        .getPublicUrl(fileName);

      return urlData.publicUrl;
    }

    // Supprimer un avatar du storage
    async function deleteAvatar(avatarUrl) {
      if (!avatarUrl) return;
      // Extraire le chemin du fichier depuis l'URL
      const urlParts = avatarUrl.split('/');
      const fileName = urlParts.slice(urlParts.indexOf(BUCKET_NAME) + 1).join('/');
      if (fileName) {
        await supabase.storage.from(BUCKET_NAME).remove([fileName]);
      }
    }

    // Sauvegarder les modifications
    async function saveProfile() {
      if (!currentUser) return;

      saveBtn.disabled = true;
      saveBtn.textContent = "Enregistrement...";

      try {
        const updates = {};
        
// Username (si modifié)
const newUsername = usernameInput.value.trim();

if (newUsername && newUsername !== currentUserData.username) {

  const now = new Date();

  const lastChange = currentUserData.usernameLastChanged
    ? currentUserData.usernameLastChanged.toDate()
    : null;

  if (lastChange) {

    const diffTime = now - lastChange;
    const diffDays = diffTime / (1000 * 60 * 60 * 24);

    if (diffDays < 90) {

      const remainingDays = Math.ceil(90 - diffDays);

      showMessage(
        `Vous pourrez modifier votre nom d'utilisateur dans ${remainingDays} jour(s)`,
        "error"
      );

      saveBtn.disabled = false;
      saveBtn.textContent = "Enregistrer";
      return;
    }
  }
  
  // Vérifier si username déjà pris
const usersRef = collection(db, "users");
const q = query(usersRef, where("usernameLower", "==", newUsername.toLowerCase()));
const snap = await getDocs(q);

if (!snap.empty) {
  showMessage("Ce nom d'utilisateur est déjà utilisé", "error");
  saveBtn.disabled = false;
  saveBtn.textContent = "Enregistrer";
  return;
}

  // ✅ Autorisé → enregistrer nouveau username + date
  updates.username = newUsername;
updates.usernameLower = newUsername.toLowerCase();
updates.usernameLastChanged = new Date();
}

        // Bio
        const newBio = bioInput.value.trim();
        if (newBio !== (currentUserData.bio || "")) {
          updates.bio = newBio;
        }

        // Avatar
        if (avatarRemoved) {
          // Supprimer l'ancien avatar
          if (currentUserData.avatar) {
            await deleteAvatar(currentUserData.avatar);
          }
          updates.avatar = null;
        } else if (selectedAvatarFile) {
          // Upload nouvel avatar
          const avatarUrl = await uploadAvatar(selectedAvatarFile, currentUser.uid);
          // Supprimer l'ancien si existant
          if (currentUserData.avatar) {
            await deleteAvatar(currentUserData.avatar);
          }
          updates.avatar = avatarUrl;
        }

        // Si rien à modifier
        if (Object.keys(updates).length === 0) {
          showMessage("Aucune modification", "error");
          saveBtn.disabled = false;
          saveBtn.textContent = "Enregistrer";
          return;
        }

        // Mise à jour Firestore
        const userRef = doc(db, "users", currentUser.uid);
        await updateDoc(userRef, updates);

        showMessage("Profil mis à jour avec succès !", "success");

        // Recharger les données (pour afficher les changements dans la page)
        await loadUserData();

      } catch (error) {
        console.error("Erreur sauvegarde:", error);
        showMessage("Erreur lors de la sauvegarde : " + error.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Enregistrer";
        selectedAvatarFile = null;
        avatarChanged = false;
        avatarRemoved = false;
      }
    }

    // ========== ÉVÉNEMENTS ==========
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      await loadUserData();
    });

    // Changer avatar
    changeAvatarBtn.addEventListener("click", () => {
      avatarFile.click();
    });

    avatarFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Prévisualisation
      const reader = new FileReader();
      reader.onload = (event) => {
        avatarImg.src = event.target.result;
        avatarImg.style.display = "block";
        avatarPlaceholder.style.display = "none";
      };
      reader.readAsDataURL(file);

      selectedAvatarFile = file;
      avatarChanged = true;
      avatarRemoved = false;
    });

    // Supprimer avatar
    removeAvatarBtn.addEventListener("click", () => {
      avatarImg.src = "";
      avatarImg.style.display = "none";
      avatarPlaceholder.style.display = "block";
      selectedAvatarFile = null;
      avatarChanged = true;
      avatarRemoved = true;
    });

    // Sauvegarder
    saveBtn.addEventListener("click", saveProfile);

    // Raccourci Ctrl+Enter (ou Cmd+Enter) pour sauvegarder
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        saveProfile();
      }
    });

  </script>
</body>
</html>
