<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

html,body{
  min-height:100%;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

body{
  min-height:30vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 16px;
 
}

/* WARNING PWA (Écran bloquant) */
.pwa-warning {
  display: none; /* Caché par défaut, activé par le script */
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 9999;
  padding: 20px;
}

.pwa-warning h2 {
  color: #ff0050;
  font-size: 24px;
  margin-bottom: 12px;
}

.pwa-warning p {
  color: #aaa;
  font-size: 18px;
  line-height: 1.5;
}

/* CONTAINER */
.container{
  background:#000;
  border:5px solid #222;
  border-radius:18px;
  width:900px;
  padding:30px;
  margin-top:105px;
}

/* HEADER */
.title{
  font-size:28px;
  font-weight:800;
  text-align:center;
  margin-bottom:22px;
}

/* INPUT */
.input-group{
  margin-bottom:16px;
}

.input-group input{
  width:100%;
  padding:12px 16px;
  border-radius:12px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  font-size:16px;
  outline:none;
}

.input-group input:focus{
  border-color:#ff0050;
}

/* BUTTON */
button{
  width:100%;
  padding:15px 16px;
  border:none;
  border-radius:30px;
  background:#ff0050;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

button:disabled{
  background:#444;
  cursor:not-allowed;
}

button:active{
  transform:scale(0.98);
}

/* LINKS */
.links{
  margin-top:18px;
  text-align:center;
  font-size:14px;
  color:#aaa;
  line-height:1.5;
}

.links a{
  color:#ff0050;
  text-decoration:none;
  font-weight:600;
}

.links a:active{
  opacity:.8;
}

/* MOBILE STABLE */
@media(max-width:480px){
  body{
    align-items:flex-start;
    padding-top:80px;
  }

  .title{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="pwa-warning" id="pwaWarning">
  <h2>⚠️ Action requise</h2>
  <p>Utilise HaytiClips sur votre écran d'accueil.</p>
</div>

<div class="container" id="mainContent">

  <div class="title">Connexion</div>

  <div class="input-group">
    <input type="email" id="email" placeholder="Email">
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder="Mot de passe">
  </div>

  <button id="loginBtn">Se connecter</button>

  <div class="links">
    Pas encore de compte ? <a href="signup.html">S’inscrire</a>
  </div>

  <div class="links">
    <a href="forgot.html">Mot de passe oublié ?</a>
  </div>

</div>

<script>
  const isPwa = ('standalone' in window.navigator && window.navigator.standalone) || window.matchMedia('(display-mode: standalone)').matches;
  
  if (!isPwa) {
    // Si ce n'est pas dans l'écran d'accueil, on masque le formulaire et on affiche le message
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('pwaWarning').style.display = 'flex';
  }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence).catch(console.error);

/* LOGIN */
document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Entre email et mot de passe");
    return;
  }

  try {
    // 1. On tente la connexion
    const cred = await signInWithEmailAndPassword(auth, email, password);

    if(!cred.user.emailVerified){
      alert("Vérifie ton email avant de te connecter.");
      await signOut(auth);
      return;
    }

    // 2. On récupère les infos Firestore
    const snap = await getDoc(doc(db,"users",cred.user.uid));

    if (!snap.exists()) {
      alert("Erreur compte.");
      return;
    }

    const data = snap.data();

    if(!data.profileCompleted){
      window.location.href = "interest.html";
      return;
    }

    if (data.suspended) {
      const now = new Date();
      const until = data.suspendUntil?.toDate?.();

      if (until && until > now) {
        alert("Compte suspendu jusqu’au " + until.toLocaleDateString());
        await signOut(auth);
        window.location.href = "login.html";
        return;
      } else {
        await updateDoc(doc(db,"users",cred.user.uid),{
          suspended:false,
          suspendUntil:null
        });
      }
    }

    // 🔥 LA CORRECTION EST ICI 🔥
    // On isole cette opération pour qu'elle ne casse pas la connexion si elle est bloquée par Firestore
    if (data.security && data.security.enabled) {
      try {
        await updateDoc(doc(db,"users",cred.user.uid),{
          "security.lastVerified": null
        });
      } catch (secErr) {
        console.log("Info: Impossible de mettre à jour lastVerified depuis le client (bloqué par les règles de sécurité). La connexion continue normalement.");
      }
    }

    // 3. Tout est bon, on redirige !
    window.location.href = "feed.html";

  } catch (error) {
    console.error("Erreur de connexion globale:", error);
    alert("Email ou mot de passe incorrect");
  }

});
</script>

</body>
</html>
