<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff0050">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conversations - HaytiClips</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 20px;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-bottom: 1px solid #222;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .total-unread-badge {
      background: #ff0050;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .new-chat-btn {
      background: #ff0050;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: transform 0.2s ease, background-color 0.2s;
    }

    .new-chat-btn:active {
      transform: scale(0.92);
      background: #e00045;
    }

    /* SEARCH BAR */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: 12px;
      border: 1px solid #222;
      outline: none;
      font-size: 15px;
      background: #121212;
      color: #ffffff;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #ff0050;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    /* CONVERSATION LIST */
    .conversations-list {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* CONVERSATION ITEM WRAPPER FOR SWIPE */
    .conv-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-bottom: 1px solid #141414;
    }

    /* SWIPE ACTION BUTTONS (BEHIND ITEM) */
    .swipe-actions {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      display: flex;
      align-items: center;
      height: 100%;
      z-index: 1;
    }

    .swipe-btn {
      height: 100%;
      padding: 0 16px;
      border: none;
      color: white;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .swipe-mute { background: #333333; }
    .swipe-block { background: #e65100; }
    .swipe-delete { background: #d32f2f; }

    /* CONVERSATION ITEM CONTENT */
    .conv-item {
      position: relative;
      z-index: 2;
      background: #000000;
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.25s ease, background-color 0.2s;
      user-select: none;
    }

    .conv-item:active {
      background: #121212;
    }

    .conv-item.pinned {
      background: #0d0d0d;
    }

    /* AVATAR & ONLINE STATUS */
    .avatar-container {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }

    .online-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 13px;
      height: 13px;
      background: #00e676;
      border: 2px solid #000;
      border-radius: 50%;
    }

    /* INFO AREA */
    .conv-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .conv-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-name {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .time-stamp {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
    }

    .conv-preview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .message-preview {
      font-size: 14px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .conv-item.unread .message-preview {
      color: #fff;
      font-weight: 600;
    }

    .status-check {
      display: inline-flex;
      align-items: center;
      color: #777;
    }

    .status-check.read {
      color: #ff0050;
    }

    .indicators {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-indicator {
      color: #777;
      display: inline-flex;
      align-items: center;
    }

    .unread-badge {
      background: #ff0050;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    /* EMPTY STATE */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .empty-state.active {
      display: flex;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      color: #333;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      line-height: 1.5;
      max-width: 280px;
      margin-bottom: 20px;
    }

    .start-chat-btn {
      background: #ff0050;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* MODAL CONTEXT MENU (LONG PRESS) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      width: 100%;
      background: #181818;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    .modal-overlay.active .bottom-sheet {
      transform: translateY(0);
    }

    .sheet-header {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 16px;
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #282828;
    }

    .sheet-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sheet-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      text-align: left;
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
    }

    .sheet-item:active {
      background: #252525;
    }

    .sheet-item.danger {
      color: #ff4d4d;
    }

    .sheet-item.danger svg {
      color: #ff4d4d;
    }
  </style>
</head>

<body>

<div class="app-container">

  <header class="header">
    <div class="header-top">
      <div class="title-area">
        <h1>Conversations</h1>
        <span class="total-unread-badge" id="totalUnreadBadge">0</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" title="Nouvelle conversation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="bottom-sheet">
    <div class="sheet-header" id="modalUserName">Options</div>
    <div class="sheet-menu">
      <button class="sheet-item" id="actionToggleRead">

          <line x1="23" y1="9" x2="17" y2="15"></line>

      <button class="sheet-item danger" id="actionDelete">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  query, 
  where, 
  onSnapshot, 
  doc, 
  updateDoc, 
  deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// État Global
let currentUserId = null;
let conversations = [];
let selectedConvId = null;
let longPressTimer = null;

// Éléments DOM
const container = document.getElementById("conversationsContainer");
const emptyState = document.getElementById("emptyState");
const totalUnreadBadge = document.getElementById("totalUnreadBadge");
const searchInput = document.getElementById("searchInput");
const modalOverlay = document.getElementById("modalOverlay");
const modalUserName = document.getElementById("modalUserName");

// Données de démonstration si Firestore n'a pas encore de conversations
const demoConversations = [
  {
    id: "demo1",
    userName: "Jean-Baptiste Alex",
    avatar: "https://i.pravatar.cc/150?img=11",
    lastMessage: "D’accord, merci !",
    lastMessageSenderId: "other",
    timestamp: new Date(Date.now() - 5 * 60000), // il y a 5 min
    unreadCount: 2,
    isOnline: true,
    isPinned: true,
    isMuted: false,
    readStatus: "read"
  },
  {
    id: "demo2",
    userName: "Marie Luce",
    avatar: "https://i.pravatar.cc/150?img=5",
    lastMessage: "As-tu vu le dernier clip vidéo ?",
    lastMessageSenderId: "me",
    timestamp: new Date(Date.now() - 3600000), // il y a 1h
    unreadCount: 0,
    isOnline: true,
    isPinned: false,
    isMuted: true,
    readStatus: "read" // ✓✓
  },
  {
    id: "demo3",
    userName: "HaitiClips Support",
    avatar: "https://i.pravatar.cc/150?img=60",
    lastMessage: "Bienvenue sur HaytiClips ! Profitez de la plateforme.",
    lastMessageSenderId: "other",
    timestamp: new Date(Date.now() - 86400000), // Hier
    unreadCount: 0,
    isOnline: false,
    isPinned: false,
    isMuted: false,
    readStatus: "sent" // ✓
  }
];

// Initialisation de l'Auth
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUserId = user.uid;
    listenToConversations();
  } else {
    // Si l'utilisateur n'est pas connecté, charger la démo
    currentUserId = "me";
    conversations = demoConversations;
    renderConversations();
  }
});

// Écouteur Firestore en temps réel
function listenToConversations() {
  const q = query(
    collection(db, "conversations"),
    where("participants", "array-contains", currentUserId)
  );

  onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      conversations = demoConversations; // Fallback démo
    } else {
      conversations = snapshot.docs.map(docSnap => {
        const data = docSnap.data();
        const otherParticipant = data.participantDetails ? data.participantDetails.find(p => p.uid !== currentUserId) : {};
        return {
          id: docSnap.id,
          userName: otherParticipant?.name || data.title || "Utilisateur",
          avatar: otherParticipant?.avatar || "https://i.pravatar.cc/150",
          lastMessage: data.lastMessage || "",
          lastMessageSenderId: data.lastSenderId === currentUserId ? "me" : "other",
          timestamp: data.updatedAt ? data.updatedAt.toDate() : new Date(),
          unreadCount: data.unreadCount ? (data.unreadCount[currentUserId] || 0) : 0,
          isOnline: otherParticipant?.isOnline || false,
          isPinned: data.pinnedBy ? data.pinnedBy.includes(currentUserId) : false,
          isMuted: data.mutedBy ? data.mutedBy.includes(currentUserId) : false,
          readStatus: data.lastMessageRead ? "read" : "sent"
        };
      });
    }
    renderConversations();
  }, (error) => {
    console.error("Erreur Firestore conversations:", error);
    conversations = demoConversations;
    renderConversations();
  });
}

// Formatage de la date/heure
function formatTime(date) {
  if (!date) return "";
  const now = new Date();
  const d = new Date(date);

  const diffMs = now - d;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  if (diffDays === 0) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } else if (diffDays === 1) {
    return "Hier";
  } else if (diffDays < 7) {
    const days = ["Dim.", "Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam."];
    return days[d.getDay()];
  } else {
    return d.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
  }
}

// Rendu HTML principal
function renderConversations() {
  const filterText = searchInput.value.trim().toLowerCase();

  // Filtrage
  let filtered = conversations.filter(c => 
    c.userName.toLowerCase().includes(filterText) ||
    c.lastMessage.toLowerCase().includes(filterText)
  );

  // Tri : Épinglés en premier, puis par date
  filtered.sort((a, b) => {
    if (a.isPinned && !b.isPinned) return -1;
    if (!a.isPinned && b.isPinned) return 1;
    return new Date(b.timestamp) - new Date(a.timestamp);
  });

  // Calcul du total de messages non lus
  const totalUnread = conversations.reduce((acc, curr) => acc + (curr.unreadCount || 0), 0);
  totalUnreadBadge.textContent = totalUnread;
  totalUnreadBadge.style.display = totalUnread > 0 ? "inline-flex" : "none";

  container.innerHTML = "";

  if (filtered.length === 0) {
    emptyState.classList.add("active");
    return;
  } else {
    emptyState.classList.remove("active");
  }

  filtered.forEach(conv => {
    const isMe = conv.lastMessageSenderId === "me";
    
    // SVG Statut de lecture
    let statusSvg = "";
    if (isMe) {
      if (conv.readStatus === "read") {
        // Double Check Bleu/Rouge (Lu)
        statusSvg = `
          <span class="status-check read" title="Lu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M18 6L7 17l-5-5"></path>
              <path d="M22 10l-7.5 7.5L13 16"></path>
            </svg>
          </span>`;
      } else {
        // Simple Check (Envoyé)
        statusSvg = `
          <span class="status-check" title="Envoyé">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>`;
      }
    }

    const wrapper = document.createElement("div");
    wrapper.className = "conv-wrapper";
    wrapper.dataset.id = conv.id;

    wrapper.innerHTML = `
      <div class="swipe-actions">
        <button class="swipe-btn swipe-mute" onclick="toggleMute('${conv.id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
          ${conv.isMuted ? 'Activer' : 'Sourdine'}
        </button>
        <button class="swipe-btn swipe-block" onclick="blockUser('${conv.id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
          </svg>
          Bloquer
        </button>
        <button class="swipe-btn swipe-delete" onclick="deleteConversation('${conv.id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Suppr.
        </button>
      </div>

      <div class="conv-item ${conv.unreadCount > 0 ? 'unread' : ''} ${conv.isPinned ? 'pinned' : ''}" id="item-${conv.id}">
        <div class="avatar-container">
          <img class="avatar-img" src="${conv.avatar}" alt="${conv.userName}" onerror="this.src='https://i.pravatar.cc/150'">
          ${conv.isOnline ? '<div class="online-indicator" title="En ligne"></div>' : ''}
        </div>

        <div class="conv-info">
          <div class="conv-header-row">
            <h3 class="user-name">${conv.userName}</h3>
            <span class="time-stamp">${formatTime(conv.timestamp)}</span>
          </div>

          <div class="conv-preview-row">
            <p class="message-preview">
              ${isMe ? '<span>Vous : </span>' : ''}
              ${statusSvg}
              <span>${conv.lastMessage}</span>
            </p>

            <div class="indicators">
              ${conv.isMuted ? `
                <span class="icon-indicator" title="Sourdine">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                  </svg>
                </span>` : ''}

              ${conv.isPinned ? `
                <span class="icon-indicator" title="Épinglé">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="17" x2="12" y2="22"></line>
                    <path d="M5 17h14l-1.5-6h-11L5 17z"></path>
                  </svg>
                </span>` : ''}

              ${conv.unreadCount > 0 ? `
                <span class="unread-badge">${conv.unreadCount}</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    `;

    container.appendChild(wrapper);
    setupInteractions(wrapper, conv);
  });
}

// Gestion des Interactions (Clic, Swipe Left & Appui long)
function setupInteractions(wrapper, conv) {
  const item = wrapper.querySelector(".conv-item");
  let startX = 0;
  let currentX = 0;
  let isSwiping = false;

  // 1. Clic Simple -> Ouvrir le Chat
  item.addEventListener("click", (e) => {
    if (isSwiping) return;
    // Redirection vers la page de chat
    window.location.href = `chat.html?id=${conv.id}`;
  });

  // 2. Gestion du Touch Swipe Left
  item.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    isSwiping = false;

    // Début du timer pour appui long
    longPressTimer = setTimeout(() => {
      openModal(conv);
    }, 500);
  }, { passive: true });

  item.addEventListener("touchmove", (e) => {
    currentX = e.touches[0].clientX;
    const diffX = currentX - startX;

    // Si l'utilisateur bouge le doigt, annuler l'appui long
    if (Math.abs(diffX) > 10) {
      clearTimeout(longPressTimer);
    }

    // Glissement vers la gauche uniquement
    if (diffX < 0 && diffX > -200) {
      isSwiping = true;
      item.style.transform = `translateX(${diffX}px)`;
    }
  }, { passive: true });

  item.addEventListener("touchend", () => {
    clearTimeout(longPressTimer);
    const diffX = currentX - startX;

    if (diffX < -70) {
      // Déplier les boutons d'action (180px)
      item.style.transform = `translateX(-180px)`;
    } else {
      // Revenir à la position normale
      item.style.transform = `translateX(0px)`;
      setTimeout(() => { isSwiping = false; }, 100);
    }
  });

  // Réinitialiser les autres items quand on clique ailleurs
  document.addEventListener("touchstart", (e) => {
    if (!wrapper.contains(e.target)) {
      item.style.transform = `translateX(0px)`;
    }
  }, { passive: true });
}

// OUVRIRE LE MENU D'OPTIONS (APPUI LONG)
function openModal(conv) {
  selectedConvId = conv.id;
  modalUserName.textContent = conv.userName;

  document.getElementById("labelToggleRead").textContent = conv.unreadCount > 0 ? "Marquer comme lu" : "Marquer comme non lu";
  document.getElementById("labelTogglePin").textContent = conv.isPinned ? "Désépingler" : "Épingler la conversation";
  document.getElementById("labelToggleMute").textContent = conv.isMuted ? "Rétablir le son" : "Mettre en sourdine";

  modalOverlay.classList.add("active");
}

function closeModal() {
  modalOverlay.classList.remove("active");
  selectedConvId = null;
}

modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) closeModal();
});

// ACTIONS DU MENU MODAL ET SWIPE
window.toggleMute = function(id) {
  const targetId = id || selectedConvId;
  const conv = conversations.find(c => c.id === targetId);
  if (conv) {
    conv.isMuted = !conv.isMuted;
    renderConversations();
    closeModal();
  }
};

window.blockUser = function(id) {
  const targetId = id || selectedConvId;
  if (confirm("Voulez-vous vraiment bloquer cet utilisateur ?")) {
    conversations = conversations.filter(c => c.id !== targetId);
    renderConversations();
    closeModal();
  }
};

window.deleteConversation = function(id) {
  const targetId = id || selectedConvId;
  if (confirm("Supprimer définitivement cette conversation ?")) {
    conversations = conversations.filter(c => c.id !== targetId);
    renderConversations();
    closeModal();
  }
};

document.getElementById("actionToggleRead").addEventListener("click", () => {
  const conv = conversations.find(c => c.id === selectedConvId);
  if (conv) {
    conv.unreadCount = conv.unreadCount > 0 ? 0 : 1;
    renderConversations();
    closeModal();
  }
});

document.getElementById("actionTogglePin").addEventListener("click", () => {
  const conv = conversations.find(c => c.id === selectedConvId);
  if (conv) {
    conv.isPinned = !conv.isPinned;
    renderConversations();
    closeModal();
  }
});

document.getElementById("actionToggleMute").addEventListener("click", () => window.toggleMute());
document.getElementById("actionDelete").addEventListener("click", () => window.deleteConversation());
document.getElementById("actionBlock").addEventListener("click", () => window.blockUser());
document.getElementById("actionReport").addEventListener("click", () => {
  alert("Merci. La conversation a été signalée à l'équipe de modération HaytiClips.");
  closeModal();
});

// BARRE DE RECHERCHE DYNAMIQUE
searchInput.addEventListener("input", () => renderConversations());

// BOUTONS DE NOUVELLE DISCUSSIONS
document.getElementById("newChatBtn").addEventListener("click", () => {
  alert("Ouverture de la recherche d'utilisateurs HaytiClips...");
});
document.getElementById("emptyStartBtn").addEventListener("click", () => {
  alert("Recherche d'utilisateurs pour commencer une discussion...");
});

</script>
