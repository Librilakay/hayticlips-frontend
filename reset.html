<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe – HaytiClips</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
}

body{
background:#000;
color:#fff;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding:20px;
}

/* HEADER */

.header{
width:100%;
display:flex;
justify-content:center;
align-items:center;
margin-top:40px;
}

.logo-img{
width:120px;
height:auto;
object-fit:contain;
}

/* CONTAINER */

.container{
max-width:420px;
width:100%;
margin-top:40px;
}

/* CARD */

.card{
background:#111;
border-radius:18px;
padding:28px;
border:1px solid #222;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

/* TITRE */

h1{
font-size:22px;
text-align:center;
margin-bottom:22px;
}

/* INPUT */

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:6px;
font-size:14px;
color:#bbb;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #333;
background:#1a1a1a;
color:#fff;
font-size:16px;
outline:none;
transition:0.2s;
}

input:focus{
border-color:#ff0050;
box-shadow:0 0 0 1px #ff0050;
}

/* BOUTON */

button{
width:100%;
padding:15px;
border-radius:12px;
border:none;
background:#ff0050;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
margin-top:10px;
transition:0.2s;
}

button:hover{
background:#e00046;
}

button:disabled{
opacity:0.5;
cursor:not-allowed;
}

/* MESSAGE */

.message{
margin-bottom:15px;
padding:12px;
border-radius:10px;
font-size:14px;
text-align:center;
display:none;
}

.success{
background:rgba(0,200,83,0.15);
border:1px solid #00c853;
color:#00c853;
}

.error{
background:rgba(255,0,80,0.15);
border:1px solid #ff0050;
color:#ff0050;
}

/* FOOTER */

.footer{
margin-top:30px;
text-align:center;
font-size:13px;
color:#666;
}
</style>
</head>

<body>




<div class="container">
  <div class="card">
    <h1>Créer un nouveau mot de passe</h1>

    <div id="message" class="message"></div>

    <form id="resetForm">
      <div class="input-group">
        <label>Nouveau mot de passe</label>
        <input type="password" id="password" required minlength="6">
      </div>

      <div class="input-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" required minlength="6">
      </div>

      <button type="submit" id="submitBtn">Réinitialiser</button>
    </form>
  </div>

  <div class="footer">
    © 2026 HaytiClips
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  verifyPasswordResetCode,
  confirmPasswordReset
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("resetForm");
const messageDiv = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

// 🔎 Récupérer le code depuis l'URL
const params = new URLSearchParams(window.location.search);
const oobCode = params.get("oobCode");

if (!oobCode) {
  showMessage("Lien invalide ou expiré.", "error");
  form.style.display = "none";
}

// Vérifier que le code est valide
try {
  await verifyPasswordResetCode(auth, oobCode);
} catch (error) {
  showMessage("Ce lien est invalide ou a expiré.", "error");
  form.style.display = "none";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (password.length < 6) {
    showMessage("Le mot de passe doit contenir au moins 6 caractères.", "error");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Les mots de passe ne correspondent pas.", "error");
    return;
  }

  submitBtn.disabled = true;

  try {
    await confirmPasswordReset(auth, oobCode, password);

    showMessage("✅ Mot de passe modifié avec succès !", "success");

    setTimeout(() => {
      window.location.href = "login.html";
    }, 3000);

  } catch (error) {
    showMessage("Erreur lors de la réinitialisation.", "error");
  } finally {
    submitBtn.disabled = false;
  }
});

function showMessage(text, type){
  messageDiv.textContent = text;
  messageDiv.className = `message ${type}`;
  messageDiv.style.display = "block";
}
</script>

</body>
</html>
