<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wallet – HaytiClips</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Arial}
body{background:#000;color:#fff}

/* HEADER */
.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #222;
  font-weight:700;
}

.header-left{
position:absolute;
left:15px;
font-size:22px;
cursor:pointer;
}

/* BALANCE CARD */
.balance-card{
  margin:20px;
  padding:25px;
  background:linear-gradient(135deg,black);
  border-radius:16px;
  text-align:center;
}

.balance-card h2{
  font-size:14px;
  opacity:0.8;
}

.balance-card .amount{
  font-size:32px;
  font-weight:700;
  margin-top:10px;
}

/* WITHDRAW SECTION */
.section{
  padding:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#111;
  color:#fff;
}

button{
  width:100%;
  padding:12px;
  background:#ff0033;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:600;
}

/* TRANSACTIONS */
.transactions{
  padding:20px;
  border: 2px Solid; 
  border-radius: 10px;
  text-align: center;
  margin:30px;
  margin-top: 15px;
  box-shadow:
  0 0 8px rgba(255,0,80,0.6),
  0 0 20px rgba(255,0,80,0.4),
  0 0 40px rgba(255,0,80,0.2);
  background:rgba(255,255,255,0.02);
}

.tx{
  background:#111;
  border:1px solid #222;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.tx .left{
  font-size:14px;
}

.tx .right{
  text-align:right;
}

.tx.deposit{border-left:4px solid #2ecc71;}
.tx.withdraw{border-left:4px solid #ff0033;}

.status{
  font-size:12px;
  opacity:0.7;
}

.recharge-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:10px;
  margin-bottom:10px;
}

.recharge-item{
  background:#111;
  border:1px solid #333;
  padding:12px;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
}

.recharge-item.selected{
  border:2px solid #ff0033;
  background:#1a1a1a;
}
/* MODE BÊTA : recharge/retrait désactivés */
.beta-disabled{
  opacity:.45;
  pointer-events:none;
}

.beta-note{
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  background:#111;
  border:1px solid #333;
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}


  .recharge-grid[hidden]{display:none;}
</style>
</head>

<body>

<div class="header">
  <div class="header-left" onclick="history.back()">←</div>
  <div class="header-center">Mon Wallet</div>
  </div>

<div class="balance-card">
  <h2>Solde réel</h2>
  <div class="amount" id="balanceAmount">0 Gdes</div>

  <div style="margin-top:14px;font-size:14px;opacity:0.85;">
    <div>Montant bloqué : <strong id="lockedAmount">0 Gdes</strong></div>
    <div style="margin-top:6px;">Disponible : <strong id="availableAmount">0 Gdes</strong></div>
  </div>
</div>

<div class="section">
  <h3>Transfert manuel</h3>
  <button type="button"
    onclick="window.location.href='manual-transfer.html'"
    style="background:#111;border:1px solid #ff0033;margin-top:10px;">
    Faire un dépôt ou un retrait manuel
  </button>
</div>

<div class="section">
  <h3>Recharger le wallet</h3>

<div id="twControls" hidden>
  <label for="twNetwork">Réseau du portefeuille</label>
  <select id="twNetwork">
    <option value="moncash">MonCash</option>
    <option value="natcash">NatCash</option>
  </select>
  <button id="twOpen" type="button" hidden>Reprendre le paiement si tu n'a pas encore paye</button>
  <button id="twCheck" type="button" hidden>Vérifier la recharge</button>
  <button id="twSimulate" type="button" hidden>Simuler MonCash</button>
</div>
<p id="twInfo"></p>
<p id="twStatus" role="status"></p>
  
  <div class="recharge-grid" hidden>

    <div class="recharge-item" data-amount="50">50 Gdes</div>
    <div class="recharge-item" data-amount="100">100 Gdes</div>
    <div class="recharge-item" data-amount="250">250 Gdes</div>
    <div class="recharge-item" data-amount="500">500 Gdes</div>
    <div class="recharge-item" data-amount="1000">1000 Gdes</div>
    <div class="recharge-item" data-amount="5000">5000 Gdes</div>
    <div class="recharge-item" data-amount="10000">10000 Gdes</div>

  </div>

<button id="buyBtn" type="button" disabled hidden>Choisir un montant</button>
</div>

<div class="transactions">
  <h3 onclick="window.location.href='transaction.html'" style="cursor:pointer">Historique</h3>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const API_BASE = "https://hayticlip-server.onrender.com";
const byId = id => document.getElementById(id);
const grid = document.querySelector(".recharge-grid");
const items = [...grid.querySelectorAll(".recharge-item")];
const networkSelect = byId("twNetwork");
const buy = byId("buyBtn");
const open = byId("twOpen");
const check = byId("twCheck");
const simulate = byId("twSimulate");
const keys = new Map();
const htg = n => new Intl.NumberFormat("fr-HT").format(n) + " HTG";

let config = null, amount = null, busy = false, error = "";

function draw() {
  const c = config, p = c?.pending;
  const enabled = c?.enabled === true;
  const ready = enabled && c.rechargeAllowed === true && !p && !busy;

  grid.hidden = buy.hidden = byId("twControls").hidden = !enabled;
  buy.disabled = !ready || amount === null;
  buy.textContent = amount === null ? "Choisir un montant" : "Recharger " + htg(amount);
  networkSelect.disabled = !ready;

  if (enabled) {
    networkSelect.value = c.network;
    networkSelect.querySelector('[value="natcash"]').disabled =
      !c.natcashAllowed && c.network !== "natcash";
  }

  for (const item of items) {
    item.classList.toggle("selected", Number(item.dataset.amount) === amount);
  }

  byId("twInfo").textContent = !c ? "Chargement de la recharge…"
    : !enabled ? "Recharge automatique indisponible. Le transfert manuel reste accessible."
    : c.mode === "test" ? "Sandbox : " + htg(c.testBalance) + " fictifs."
    : "Choisis ton réseau avant la première recharge.";

  open.hidden = !p?.redirectUrl;
  check.hidden = !p;
  simulate.hidden = !(c?.mode === "test" && p?.network === "moncash");
  open.disabled = check.disabled = simulate.disabled = busy;

  byId("twStatus").textContent = error || (busy ? "Vérification en cours…"
    : p ? "Recharge en attente. Si tu as déjà payé, vérifie son statut. Référence : " + p.id
    : c?.last?.status === "completed" ? "Recharge confirmée : " + htg(c.last.amount) + "."
    : c?.last?.status === "failed" ? "La dernière recharge n’a pas abouti."
    : enabled && !c.rechargeAllowed ? "Recharge bloquée pour ce compte." : "");
}

async function api(user, route, body) {
  const headers = { Authorization: "Bearer " + await user.getIdToken() };
  if (body) headers["Content-Type"] = "application/json";

  const res = await fetch(API_BASE + route, {
    method: body ? "POST" : "GET",
    cache: "no-store",
    headers,
    ...(body ? { body: JSON.stringify(body) } : {})
  });

  if (res.status === 401) throw new Error("Reconnecte-toi puis reviens au wallet.");
  const data = await res.json().catch(() => null);

  if (!res.ok || !data || (body && data.success !== true)) {
    throw new Error(data?.error || "Impossible de vérifier la recharge. Actualise la page.");
  }
  return data;
}

async function load(user) {
  const data = await api(user, "/api/tranzak/wallet");
  if (typeof data.enabled !== "boolean" ||
      (data.enabled && !["test", "live"].includes(data.mode))) {
    throw new Error("Configuration de recharge indisponible.");
  }
  if (auth.currentUser?.uid === user.uid) config = data;
  return data;
}

async function loadBalance(user) {
  const ids = ["balanceAmount", "lockedAmount", "availableAmount"];

  try {
    const snap = await getDocFromServer(doc(db, "users", user.uid));
    if (!snap.exists()) throw new Error("Profil introuvable.");
    if (auth.currentUser?.uid !== user.uid) return;

    const data = snap.data();
    const total = Number(data.wallet || 0), locked = Number(data.walletLocked || 0);
    [total, locked, Math.max(0, total - locked)].forEach((n, i) => {
      byId(ids[i]).textContent = htg(n);
    });
  } catch {
    if (auth.currentUser?.uid === user.uid) {
      ids.forEach(id => { byId(id).textContent = "—"; });
    }
  }
}

async function run(action) {
  const user = auth.currentUser;
  if (!user || busy) return;

  busy = true;
  error = "";
  draw();
  let navigating = false;

  try {
    navigating = await action(user) === true;
    if (!navigating) await load(user);
  } catch (e) {
    error = e.message || "Vérifie le statut avant de réessayer.";
    try { await load(user); } catch { config = null; }
  } finally {
    busy = false;
    draw();
    if (!navigating) void loadBalance(user);
  }
}

for (const item of items) {
  item.onclick = () => {
    if (busy || !config?.rechargeAllowed || config.pending) return;
    amount = Number(item.dataset.amount);
    draw();
  };
}

networkSelect.onchange = () => {
  if (networkSelect.disabled || !config) return;

  const network = networkSelect.value;
  const mode = config.mode;
  if (network === config.network) return;

  if (mode === "test" && !confirm("Changer de réseau remet le solde fictif à zéro. Continuer ?")) {
    draw();
    return;
  }

  amount = null;
  void run(user => api(user, "/api/tranzak/network", { mode, network }));
};

buy.onclick = () => {
  if (buy.disabled || !config) return;
  const { mode, network } = config;
  const selected = amount;

  void run(async user => {
    const slot = ["hayticlips-recharge", user.uid, mode, network, selected].join(":");
    let requestKey = keys.get(slot);
    try { requestKey ||= sessionStorage.getItem(slot); } catch {}
    requestKey ||= crypto.randomUUID();
    keys.set(slot, requestKey);
    try { sessionStorage.setItem(slot, requestKey); } catch {}

    const result = await api(user, "/api/requestRecharge", {
      mode, network, amount: selected, requestKey
    });
    keys.delete(slot);
    try { sessionStorage.removeItem(slot); } catch {}
    amount = null;

    if (result.redirectUrl) {
      window.location.assign(result.redirectUrl);
      return true;
    }
  });
};

open.onclick = () => {
  if (!busy && config?.pending?.redirectUrl) {
    window.location.assign(config.pending.redirectUrl);
  }
};

function checkRecharge(simulatePayment = false) {
  if (!config?.enabled || !config.pending || busy) return;
  const { mode } = config;
  if (simulatePayment && (mode !== "test" || config.pending.network !== "moncash")) return;

  void run(user => api(user, "/api/tranzak/check", {
    mode, ...(simulatePayment ? { simulate: true } : {})
  }));
}

check.onclick = () => checkRecharge();
simulate.onclick = () => checkRecharge(true);

async function refreshOnOpen(user) {
  const url = new URL(window.location.href);

  if (url.searchParams.get("tranzak") === "retour") {
    const c = await load(user);
    if (!c.enabled) return;
    if (c.pending) await api(user, "/api/tranzak/check", { mode: c.mode });
    url.searchParams.delete("tranzak");
    window.history.replaceState(null, "", url);
  }
}

onAuthStateChanged(auth, user => {
  if (!user) {
    config = null;
    draw();
    window.location.replace("login.html");
    return;
  }

  void run(refreshOnOpen);
});

window.addEventListener("pageshow", event => {
  if (event.persisted) void run(refreshOnOpen);
});
</script>

</body>
</html>
