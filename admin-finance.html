<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Finance – HaytiClips</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

html,body{
  background:#000;
  color:#fff;
  min-height:100%;
}

body{
  min-height:100vh;
  padding-bottom:30px;
}

/* HEADER */
.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#000;
  position:sticky;
  top:0;
  z-index:100;
}

.header-left{ font-size:24px; cursor:pointer; width:40px; }
.header-center{ font-size:18px; font-weight:800; }
.header-right{ width:40px; text-align:right; }

/* TABS */
.tabs{
  display:flex;
  border-bottom:1px solid #222;
  margin-bottom:20px;
  background:#000;
  position:sticky;
  top:60px;
  z-index:99;
}

.tab{
  flex:1;
  text-align:center;
  padding:16px 10px;
  color:#888;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s ease;
  border-bottom:3px solid transparent;
}

.tab.active{
  color:#fff;
  border-bottom:3px solid #ff0050;
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

/* CONTAINERS */
.page{
  max-width:1100px;
  margin:0 auto;
  padding:0 16px;
}

/* BUTTONS & INPUTS */
button{
  border:none;
  border-radius:30px;
  padding:13px 20px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:transform 0.1s;
}
button:active{ transform:scale(0.97); }
button:disabled{ opacity:.5; cursor:not-allowed; }

.primary{ background:#ff0050; color:#fff; }
.secondary{ background:#1a1a1a; color:#fff; border:1px solid #333; }
.danger{ background:#ff4d4f; color:#fff; }

input{
  width:100%;
  background:#111;
  border:1px solid #333;
  color:#fff;
  padding:14px 16px;
  border-radius:12px;
  font-size:15px;
  outline:none;
}
input:focus{ border-color:#ff0050; }

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.search-box input{ flex:1; }

/* GRID & CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:12px;
  margin-bottom:24px;
}

.card{
  background:#111;
  border:1px solid #222;
  border-radius:16px;
  padding:18px;
}

.card-title{
  font-size:14px;
  color:#aaa;
  margin-bottom:8px;
  font-weight:600;
}

.card-value{
  font-size:26px;
  font-weight:900;
}

/* UTILS */
.green{color:#00d084}
.red{color:#ff4d4f}
.pink{color:#ff0050}
.white{color:#fff}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:30px 0 16px;
}

/* LISTS (Transactions) */
.tx-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.tx-card{
  background:#111;
  border:1px solid #222;
  border-radius:16px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tx-info{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.tx-type{
  font-weight:800;
  font-size:15px;
}

.tx-date{
  font-size:13px;
  color:#888;
}

.tx-amount{
  font-weight:900;
  font-size:16px;
}

.empty{
  padding:30px;
  text-align:center;
  color:#666;
  border:1px dashed #333;
  border-radius:16px;
  font-weight:600;
}

/* USER PROFILE CARD */
.user-profile{
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  padding:20px;
  margin-bottom:24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
}

.user-info p{ margin-bottom:4px; color:#aaa; font-size:14px; }
.user-info h3{ font-size:20px; margin-bottom:8px; }
.badge-locked{ background:#ff4d4f; color:#fff; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:bold; }

@media(max-width:600px){
  .search-box{ flex-direction:column; }
  .user-profile{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-left" onclick="history.back()">←</div>
  <div class="header-center">Finance Admin</div>
  <div class="header-right">
    <svg id="logoutBtn" style="cursor:pointer" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tabGlobal">Global</div>
  <div class="tab" id="tabUtilisateur">Utilisateur</div>
</div>

<div class="page">

  <!-- ================= ONGLET GLOBAL ================= -->
  <div class="tab-content active" id="contentGlobal">
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <p style="color:#aaa; font-size:13px;" id="statusText">Statut : Prêt</p>
      <button class="secondary" id="refreshBtn" style="padding:8px 16px; font-size:13px;">Actualiser</button>
    </div>

    <div class="grid">
      <!-- Argent total sur la plateforme -->
      <div class="card" style="border-color:#ff0050;">
        <div class="card-title">Fonds Totaux Utilisateurs</div>
        <div class="card-value white" id="platformTotal">0 Gdes</div>
      </div>
      <div class="card">
        <div class="card-title">Entrées Admin</div>
        <div class="card-value green" id="totalIn">0 Gdes</div>
      </div>
      <div class="card">
        <div class="card-title">Sorties Admin</div>
        <div class="card-value red" id="totalOut">0 Gdes</div>
      </div>
      <div class="card">
        <div class="card-title">Balance Nette Admin</div>
        <div class="card-value pink" id="netTotal">0 Gdes</div>
      </div>
    </div>
  </div>

  <!-- ================= ONGLET UTILISATEUR ================= -->
  <div class="tab-content" id="contentUtilisateur">
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher par Username ou ID...">
      <button class="primary" id="searchBtn">Rechercher</button>
    </div>

    <div id="userResultArea" style="display:none;">
      
      <div class="user-profile">
        <div class="user-info">
          <h3 id="uEmail">@username</h3>
          <p>ID: <span id="uId">...</span></p>
          <p style="margin-top:10px;">Balance actuelle : <strong class="pink" style="font-size:22px;" id="uBalance">0 Gdes</strong></p>
          <div id="uLockBadge" style="margin-top:6px; display:none;"><span class="badge-locked">COMPTE GELÉ</span></div>
        </div>
        <div>
          <button id="lockBtn" class="danger">Geler la balance</button>
        </div>
      </div>

      <div class="section-title">Historique des transactions</div>
      <div class="tx-list" id="userTxList">
        <!-- Rempli par JS -->
      </div>
      
    </div>
    <div id="userEmptyArea" class="empty" style="display:none;">Utilisateur introuvable.</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, limit, orderBy, getAggregateFromServer, sum 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Utilitaires
function money(n){ return `${Number(n || 0).toLocaleString("fr-FR")} Gdes`; }
function formatDate(val){
  if(!val) return "-";
  let d = val.seconds ? new Date(val.seconds * 1000) : new Date(val);
  return d.toLocaleString("fr-FR");
}

/* ================= GESTION DES ONGLETS ================= */
const tabGlobal = document.getElementById("tabGlobal");
const tabUtilisateur = document.getElementById("tabUtilisateur");
const contentGlobal = document.getElementById("contentGlobal");
const contentUtilisateur = document.getElementById("contentUtilisateur");

function switchTab(tab) {
  tabGlobal.classList.remove("active");
  tabUtilisateur.classList.remove("active");
  contentGlobal.classList.remove("active");
  contentUtilisateur.classList.remove("active");

  if(tab === 'global') {
    tabGlobal.classList.add("active");
    contentGlobal.classList.add("active");
  } else {
    tabUtilisateur.classList.add("active");
    contentUtilisateur.classList.add("active");
  }
}

tabGlobal.onclick = () => switchTab('global');
tabUtilisateur.onclick = () => switchTab('utilisateur');

/* ================= ONGLET GLOBAL ================= */
async function getAdminToken(){
  return await auth.currentUser.getIdToken(true);
}

async function loadFinance(){
  document.getElementById("statusText").textContent = "Chargement...";
  try {
    const token = await getAdminToken();
    const res = await fetch("https://hayticlip-server.onrender.com/api/admin/finance-summary", {
      headers: { "Authorization": "Bearer " + token }
    });
    const data = await res.json();
    
    if(data.success){
      document.getElementById("totalIn").textContent = money(data.totalIn);
      document.getElementById("totalOut").textContent = money(data.totalOut);
      document.getElementById("netTotal").textContent = money(data.netTotal);
    }

    // Calcul corrigé : Utilisation de sum("wallet") au lieu de sum("balance")
    const usersColl = collection(db, "users");
    const snapshot = await getAggregateFromServer(usersColl, {
      totalMoney: sum("wallet")
    });
    const platformMoney = snapshot.data().totalMoney || 0;
    document.getElementById("platformTotal").textContent = money(platformMoney);

    document.getElementById("statusText").textContent = "À jour";
  } catch(err) {
    document.getElementById("statusText").textContent = "Erreur de chargement";
    console.error(err);
  }
}
document.getElementById("refreshBtn").onclick = loadFinance;

/* ================= ONGLET UTILISATEUR ================= */
let currentUserLoaded = null;

document.getElementById("searchBtn").onclick = async () => {
  const val = document.getElementById("searchInput").value.trim();
  if(!val) return;
  
  const searchBtn = document.getElementById("searchBtn");
  searchBtn.textContent = "...";
  searchBtn.disabled = true;

  document.getElementById("userResultArea").style.display = "none";
  document.getElementById("userEmptyArea").style.display = "none";

  try {
    let userSnap;
    let uid = val;
    
    // 1. Essayer par ID
    userSnap = await getDoc(doc(db, "users", val));
    
    // 2. Essayer par USERNAME
    if(!userSnap.exists()){
      const q = query(collection(db, "users"), where("usernameLower", "==", val.toLowerCase()), limit(1));
      const querySnapshot = await getDocs(q);
      if(!querySnapshot.empty){
        userSnap = querySnapshot.docs[0];
        uid = userSnap.id;
      }
    }

    if(!userSnap || !userSnap.exists()){
      document.getElementById("userEmptyArea").style.display = "block";
      return;
    }

    const userData = userSnap.data();
    currentUserLoaded = uid;

    document.getElementById("uEmail").textContent = "@" + (userData.username || "inconnu");
    document.getElementById("uId").textContent = uid;
    document.getElementById("uBalance").textContent = money(userData.wallet); 
    
    const isLocked = userData.walletLocked === true;
    updateLockButtonUI(isLocked);

    document.getElementById("userResultArea").style.display = "block";
    loadUserTransactions(uid);

  } catch(e) {
    console.error(e);
    alert("Erreur de recherche");
  } finally {
    searchBtn.textContent = "Rechercher";
    searchBtn.disabled = false;
  }
};

function updateLockButtonUI(isLocked){
  const lockBtn = document.getElementById("lockBtn");
  const lockBadge = document.getElementById("uLockBadge");
  
  if(isLocked){
    lockBtn.textContent = "Dégeler le wallet";
    lockBtn.className = "secondary";
    lockBadge.style.display = "block";
  } else {
    lockBtn.textContent = "Geler le wallet (Vider)";
    lockBtn.className = "danger";
    lockBadge.style.display = "none";
  }
  
  lockBtn.onclick = () => toggleLock(isLocked);
}

// Fonction corrigée pour "prendre la totalité" (mettre wallet à 0)
async function toggleLock(currentlyLocked){
  if(!currentUserLoaded) return;
  const newStatus = !currentlyLocked;
  
  const messageConfirm = newStatus 
    ? "Voulez-vous vraiment GELER ce compte et VIDER totalement sa balance (prendre la totalité et mettre à 0 Gdes) ?" 
    : "Voulez-vous vraiment DÉGELER le compte de cet utilisateur ?";
  
  if(confirm(messageConfirm)){
    try {
      const updates = { walletLocked: newStatus };
      
      // Si on active le verrouillage, on force le wallet à 0 (confiscation totale)
      if (newStatus === true) {
        updates.wallet = 0;
      }

      await updateDoc(doc(db, "users", currentUserLoaded), updates);
      
      // Mise à jour de l'affichage en direct de la balance
      if (newStatus === true) {
        document.getElementById("uBalance").textContent = money(0);
      }
      
      updateLockButtonUI(newStatus);
    } catch(e) {
      alert("Erreur lors de la mise à jour : " + e.message);
    }
  }
}

async function loadUserTransactions(uid){
  const txList = document.getElementById("userTxList");
  txList.innerHTML = "Chargement...";
  
  try {
    const q = query(collection(db, "walletTransactions"), where("userId", "==", uid), orderBy("createdAt", "desc"), limit(30));
    const snaps = await getDocs(q);
    
    if(snaps.empty){
      txList.innerHTML = `<div class="empty">Aucune transaction trouvée.</div>`;
      return;
    }

    txList.innerHTML = "";
    snaps.forEach(docSnap => {
      const tx = docSnap.data();
      const amount = Number(tx.amount || 0);
      const isOut = tx.direction === "out" || tx.type === "sendGift" || tx.type === "achat_badge"; 
      const amountClass = isOut ? "red" : "green";
      const sign = isOut ? "-" : "+";

      const div = document.createElement("div");
      div.className = "tx-card";
      div.innerHTML = `
        <div class="tx-info">
          <div class="tx-type">${tx.type || "Transaction"} ${tx.status === 'failed' ? '(Échoué)' : ''}</div>
          <div class="tx-date">${formatDate(tx.createdAt)}</div>
        </div>
        <div class="tx-amount ${amountClass}">
          ${sign}${money(amount)}
        </div>
      `;
      txList.appendChild(div);
    });

  } catch(e) {
    console.error(e);
    txList.innerHTML = `<div class="empty" style="color:#ff4d4f">Erreur de lecture des transactions. (Avez-vous créé l'index dans Firebase ?)</div>`;
  }
}

/* ================= AUTHENTIFICATION ================= */
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  window.location.href = "profil.html";
};

onAuthStateChanged(auth, async(user)=>{
  if(!user) { window.location.href = "login.html"; return; }
  
  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists() || snap.data().role !== "admin"){
    alert("Accès refusé");
    window.location.href = "feed.html";
    return;
  }
  
  loadFinance();
});
</script>

</body>
</html>
