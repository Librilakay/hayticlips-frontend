<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changer mot de passe</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}

html,body{
  height:100%;
  background:#000;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

/* CONTAINER */
.container{
  width:100%;
  max-width:420px;
  background:#111;
  padding:22px 18px;
  border-radius:18px;
  border:1px solid #222;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* TITLE */
h2{
  text-align:center;
  margin-bottom:22px;
  font-size:20px;
  font-weight:700;
}

/* INPUTS */
input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:12px;
  border:1px solid #2a2a2a;
  background:#0c0c0c;
  color:#fff;
  font-size:15px;
  outline:none;
  transition:0.15s;
}

input::placeholder{
  color:#777;
}

input:focus{
  border-color:#ff0050;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#ff0050;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:0.15s;
}

button:active{
  transform:scale(0.97);
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

/* MOBILE */
@media(max-width:480px){
  .container{
    padding:20px 16px;
  }

  h2{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h2> Changer mot de passe</h2>

  <input type="password" id="currentPassword" placeholder="Mot de passe actuel">
  <input type="password" id="newPassword" placeholder="Nouveau mot de passe">
  <input type="password" id="confirmPassword" placeholder="Confirmer nouveau mot de passe">

  <button id="changeBtn">Mettre à jour</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  reauthenticateWithCredential,
  EmailAuthProvider,
  updatePassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("changeBtn").onclick = async () => {

  const currentPassword = document.getElementById("currentPassword").value.trim();
  const newPassword = document.getElementById("newPassword").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if(!currentPassword || !newPassword || !confirmPassword){
    alert("Remplis tous les champs");
    return;
  }

  // 🔐 Validation avancée mot de passe
const strongPasswordRegex =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{10,}$/;

if(!strongPasswordRegex.test(newPassword)){
  alert(
`Mot de passe invalide :

Minimum 10 caractères
1 majuscule
1 minuscule
1 chiffre
1 caractère spécial (!@#$%^&*)`
  );
  return;
}

  if(newPassword !== confirmPassword){
    alert("Les mots de passe ne correspondent pas");
    return;
  }
  if(newPassword === currentPassword){
  alert("Le nouveau mot de passe doit être différent de l’ancien");
  return;
}

  try{


if(!auth.currentUser){
alert("Session expirée. Reconnectez-vous.");
window.location.href = "login.html";
return;
}
const user = auth.currentUser;

const userSnap = await getDoc(doc(db,"users",user.uid));
const userData = userSnap.data();

if(userData.security?.enabled){

const pin = prompt("Entrez votre code PIN 2FA");

if(!pin){
alert("PIN requis");
return;
}

const encoder = new TextEncoder();
const data = encoder.encode(pin);

const hashBuffer = await crypto.subtle.digest("SHA-256", data);
const hashArray = Array.from(new Uint8Array(hashBuffer));
const hashHex = hashArray.map(b => b.toString(16).padStart(2,"0")).join("");

if(hashHex !== userData.security.pinHash){
alert("Code PIN incorrect");
return;
}

}

const credential = EmailAuthProvider.credential(
  user.email,
  currentPassword
);

await reauthenticateWithCredential(user, credential);

await updatePassword(user, newPassword);

// 🔒 Invalider token
await user.getIdToken(true);

// 🔄 Déconnexion
await signOut(auth);

alert("Mot de passe changé. Veuillez vous reconnecter.");

window.location.href = "login.html";

}catch(err){

console.error(err);
alert("Mot de passe actuel incorrect");

}

};
</script>

</body>
</html>
