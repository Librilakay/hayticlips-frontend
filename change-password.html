<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Changer mot de passe</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}

html,body{
  height:100%;
  background:#000;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

/* CONTAINER */
.container{
  width:100%;
  max-width:420px;
  background:#111;
  padding:30px 22px;
  border-radius:18px;
  border:1px solid #222;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* TITLE */
h2{
  text-align:center;
  margin-bottom:26px;
  font-size:22px;
  font-weight:700;
}

/* INPUT WRAPPER */
.input-wrapper {
  position: relative;
  margin-bottom: 16px;
}

input{
  width:100%;
  padding:14px 45px 14px 14px; /* Espace à droite pour l'icône */
  border-radius:12px;
  border:1px solid #2a2a2a;
  background:#0c0c0c;
  color:#fff;
  font-size:15px;
  outline:none;
  transition:0.2s;
}

input::placeholder{
  color:#777;
}

input:focus{
  border-color:#ff0050;
  background:#111;
}

/* EYE ICON */
.eye-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.5;
  transition: 0.2s;
}

.eye-btn:hover {
  opacity: 1;
}

/* STRENGTH METER */
.strength-container {
  margin-top: -6px;
  margin-bottom: 16px;
  padding: 0 4px;
}

.strength-meter {
  height: 4px;
  background: #333;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 6px;
}

.strength-bar {
  height: 100%;
  width: 0%;
  transition: width 0.3s ease, background-color 0.3s ease;
}

.strength-text {
  font-size: 11px;
  color: #777;
  display: flex;
  justify-content: space-between;
}

/* MATCH INDICATOR */
.match-indicator {
  font-size: 12px;
  margin-top: -6px;
  margin-bottom: 16px;
  padding-left: 4px;
  display: none;
  font-weight: 500;
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#ff0050;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
  margin-top: 10px;
}

button:active{
  transform:scale(0.97);
}

button:disabled{
  background: #333;
  color: #777;
  cursor:not-allowed;
  transform: none;
}

/* MOBILE */
@media(max-width:480px){
  .container{
    padding:24px 16px;
  }
  h2{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h2>Changer mot de passe</h2>

  <div class="input-wrapper">
    <input type="password" id="currentPassword" placeholder="Mot de passe actuel">
    <div class="eye-btn" onclick="toggleVisibility('currentPassword', this)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
      </svg>
    </div>
  </div>

  <div class="input-wrapper">
    <input type="password" id="newPassword" placeholder="Nouveau mot de passe">
    <div class="eye-btn" onclick="toggleVisibility('newPassword', this)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
      </svg>
    </div>
  </div>

  <div class="strength-container">
    <div class="strength-meter">
      <div class="strength-bar" id="strengthBar"></div>
    </div>
    <div class="strength-text">
      <span id="strengthLabel">Au moins 8 caractères, 1 Majuscule, 1 Chiffre</span>
    </div>
  </div>

  <div class="input-wrapper" style="margin-bottom: 8px;">
    <input type="password" id="confirmPassword" placeholder="Confirmer nouveau mot de passe">
    <div class="eye-btn" onclick="toggleVisibility('confirmPassword', this)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
      </svg>
    </div>
  </div>
  
  <div class="match-indicator" id="matchIndicator">Les mots de passe correspondent ✓</div>

  <button id="changeBtn" disabled>Mettre à jour</button>
</div>

<script>
  // Fonction pour afficher/masquer le mot de passe
  function toggleVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
      input.type = "text";
      btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
    } else {
      input.type = "password";
      btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>`;
    }
  }

  // Éléments du DOM
  const currentInput = document.getElementById("currentPassword");
  const newInput = document.getElementById("newPassword");
  const confirmInput = document.getElementById("confirmPassword");
  const btn = document.getElementById("changeBtn");
  
  const strengthBar = document.getElementById("strengthBar");
  const strengthLabel = document.getElementById("strengthLabel");
  const matchIndicator = document.getElementById("matchIndicator");

  // Regex exact (8+ char, 1 majuscule, 1 minuscule, 1 chiffre)
  const exactRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

  function validateForm() {
    const currentVal = currentInput.value.trim();
    const newVal = newInput.value.trim();
    const confirmVal = confirmInput.value.trim();

    // 1. Calcul de la force (Indicateur visuel)
    let score = 0;
    if(newVal.length >= 8) score++;
    if(/[A-Z]/.test(newVal)) score++;
    if(/[a-z]/.test(newVal)) score++;
    if(/\d/.test(newVal)) score++;
    if(/[^A-Za-z0-9]/.test(newVal)) score++; // Bonus pour caractère spécial

    if (newVal.length === 0) {
      strengthBar.style.width = "0%";
      strengthLabel.textContent = "Au moins 8 caractères, 1 Majuscule, 1 Chiffre";
      strengthLabel.style.color = "#777";
    } else if (score <= 2) {
      strengthBar.style.width = "33%";
      strengthBar.style.backgroundColor = "#ff4d4d";
      strengthLabel.textContent = "Faible";
      strengthLabel.style.color = "#ff4d4d";
    } else if (score === 3 || score === 4) {
      strengthBar.style.width = "66%";
      strengthBar.style.backgroundColor = "#f1c40f";
      strengthLabel.textContent = "Moyen";
      strengthLabel.style.color = "#f1c40f";
    } else {
      strengthBar.style.width = "100%";
      strengthBar.style.backgroundColor = "#2ecc71";
      strengthLabel.textContent = "Fort";
      strengthLabel.style.color = "#2ecc71";
    }

    // 2. Vérification Regex Finale
    const isStrongEnough = exactRegex.test(newVal);

    // 3. Vérification de la correspondance
    let isMatching = false;
    if (confirmVal.length > 0) {
      matchIndicator.style.display = "block";
      if (newVal === confirmVal) {
        matchIndicator.textContent = "Les mots de passe correspondent ✓";
        matchIndicator.style.color = "#2ecc71";
        isMatching = true;
      } else {
        matchIndicator.textContent = "Les mots de passe ne correspondent pas ✕";
        matchIndicator.style.color = "#ff4d4d";
        isMatching = false;
      }
    } else {
      matchIndicator.style.display = "none";
    }

    // 4. Activer/Désactiver le bouton final
    const isDifferent = (newVal !== currentVal);
    const hasCurrent = (currentVal.length > 0);

    if (hasCurrent && isStrongEnough && isMatching && isDifferent) {
      btn.disabled = false;
    } else {
      btn.disabled = true;
    }
  }

  // Écouteurs d'événements en temps réel
  currentInput.addEventListener("input", validateForm);
  newInput.addEventListener("input", validateForm);
  confirmInput.addEventListener("input", validateForm);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  reauthenticateWithCredential,
  EmailAuthProvider,
  updatePassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain: "tstx-58474.firebaseapp.com",
  projectId: "tstx-58474",
  storageBucket: "tstx-58474.firebasestorage.app",
  messagingSenderId: "1010020144942",
  appId: "1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("changeBtn").onclick = async () => {

  const currentPassword = document.getElementById("currentPassword").value.trim();
  const newPassword = document.getElementById("newPassword").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  // Double vérification au clic (au cas où)
  if(!currentPassword || !newPassword || !confirmPassword){
    alert("Remplis tous les champs");
    return;
  }

  // Nouvelle Regex adaptée à ta demande (8 char, 1 maj, 1 min, 1 chiffre)
  const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

  if(!strongPasswordRegex.test(newPassword)){
    alert("Mot de passe invalide :\n\nMinimum 8 caractères\n1 majuscule\n1 minuscule\n1 chiffre");
    return;
  }

  if(newPassword !== confirmPassword){
    alert("Les mots de passe ne correspondent pas");
    return;
  }
  
  if(newPassword === currentPassword){
    alert("Le nouveau mot de passe doit être différent de l’ancien");
    return;
  }

  try{
    if(!auth.currentUser){
      alert("Session expirée. Reconnectez-vous.");
      window.location.href = "login.html";
      return;
    }
    
    const user = auth.currentUser;
    const btn = document.getElementById("changeBtn");
    btn.disabled = true;
    btn.textContent = "Mise à jour...";

    const userSnap = await getDoc(doc(db,"users",user.uid));
    const userData = userSnap.data();

    // Gestion du code PIN 2FA
    if(userData.security?.enabled){
      const pin = prompt("Entrez votre code PIN 2FA");
      if(!pin){
        alert("PIN requis");
        btn.disabled = false;
        btn.textContent = "Mettre à jour";
        return;
      }

      const encoder = new TextEncoder();
      const data = encoder.encode(pin);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2,"0")).join("");

      if(hashHex !== userData.security.pinHash){
        alert("Code PIN incorrect");
        btn.disabled = false;
        btn.textContent = "Mettre à jour";
        return;
      }
    }

    const credential = EmailAuthProvider.credential(
      user.email,
      currentPassword
    );

    // Re-authentification avec Firebase
    await reauthenticateWithCredential(user, credential);

    // Mise à jour du mot de passe
    await updatePassword(user, newPassword);

    // Invalider token et déconnexion
    await user.getIdToken(true);
    await signOut(auth);

    alert("Mot de passe changé. Veuillez vous reconnecter.");
    window.location.href = "login.html";

  }catch(err){
    console.error(err);
    alert("Mot de passe actuel incorrect ou erreur de connexion.");
    const btn = document.getElementById("changeBtn");
    btn.disabled = false;
    btn.textContent = "Mettre à jour";
  }
};
</script>

</body>
</html>
