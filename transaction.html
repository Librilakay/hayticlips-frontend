<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transactions – HaytiClips</title>

<!-- IMPORTS POUR LA GÉNÉRATION DE PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,Arial;
}

body{
background:#000;
color:#fff;
padding:20px;
}

/* HEADER */

.header{
display:flex;
justify-content:center;
align-items:center;
margin-bottom:30px;
}

.logo-img{
width:200px;
max-width:80%;
/* Optionnel : ajout d'un petit arrondi pour que l'icône soit propre */
border-radius: 16px; 
}

/* LIST */

.list{
margin-top:20px;
}

/* CARD */

.card{
background:#111;
border:1px solid #222;
border-radius:14px;
padding:16px;
margin-bottom:12px;
}

/* ROW */

.row{
display:flex;
justify-content:space-between;
margin-bottom:6px;
}

.label{
opacity:0.6;
font-size:13px;
}

.value{
font-weight:600;
}

/* BUTTON */

.download{
margin-top:0px;
margin-bottom:20px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#ff0050;
color:white;
font-weight:700;
cursor:pointer;
font-size:14px;
transition: transform 0.1s;
}

.download:active {
  transform: scale(0.98);
}

.download:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.back{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff0050;
  padding:10px 15px;
  border-radius:8px;
  color:white;
  text-decoration:none;
  font-size:14px;
  z-index: 100;
}

/* NOUVEAUX STYLES : RÉSUMÉ & FILTRES */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.summary-card {
  background: #111;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #333;
  text-align: center;
}
.summary-title {
  font-size: 11px;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.summary-val {
  font-size: 15px;
  font-weight: 700;
}
.summary-val.solde { color: #fff; }
.summary-val.in { color: #2ecc71; }
.summary-val.out { color: #ff0033; }
.summary-val.gift { color: #f39c12; }

.filters {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
  background: #111;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #222;
}
.filter-row {
  display: flex;
  gap: 10px;
}
.filter-input, .filter-select {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #000;
  color: #fff;
  font-size: 13px;
  outline: none;
}
.filter-input:focus, .filter-select:focus {
  border-color: #ff0050;
}
.filter-input::placeholder {
  color: #777;
}

</style>

</head>

<body>

<div class="header">
  <!-- TON VRAI LOGO INTÉGRÉ ICI -->
  <img src="icons/icon-192.jpg" class="logo-img" alt="Logo HaytiClips">
</div>

<div class="summary-grid" id="summaryGrid">
  <div class="summary-card">
    <div class="summary-title">Solde actuel</div>
    <div class="summary-val solde" id="sumBalance">0 Gdes</div>
  </div>
  <div class="summary-card">
    <div class="summary-title">Total Recharges</div>
    <div class="summary-val in" id="sumDeposits">0 Gdes</div>
  </div>
  <div class="summary-card">
    <div class="summary-title">Total Retraits</div>
    <div class="summary-val out" id="sumWithdrawals">0 Gdes</div>
  </div>
  <div class="summary-card">
    <div class="summary-title">Cadeaux (Env/Reç)</div>
    <div class="summary-val gift" id="sumGifts">0 Gdes</div>
  </div>
</div>

<!-- BOUTON D'EXPORT PDF -->
<button id="btnExportPDF" class="download">📄 Télécharger mon relevé (PDF)</button>

<div class="filters">
  <input type="text" id="searchInput" class="filter-input" placeholder="Rechercher (ID, Montant, Date...)">
  <div class="filter-row">
    <select id="typeFilter" class="filter-select">
      <option value="all">Toutes</option>
      <option value="deposit">Recharges</option>
      <option value="withdraw">Retraits</option>
      <option value="gift">Cadeaux</option>
      <option value="pending">En attente</option>
      <option value="completed">Réussies</option>
      <option value="failed">Échouées</option>
    </select>
    <select id="dateFilter" class="filter-select">
      <option value="all">Toutes les dates</option>
      <option value="today">Aujourd'hui</option>
      <option value="week">Cette semaine</option>
      <option value="month">Ce mois-ci</option>
      <option value="custom">Personnalisé</option>
    </select>
  </div>
  <div class="filter-row" id="customDateRow" style="display:none;">
    <input type="date" id="dateStart" class="filter-input">
    <input type="date" id="dateEnd" class="filter-input">
  </div>
</div>

<div class="list" id="txList"></div>

<a href="profil.html" class="back">Retour</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain:"tstx-58474.firebaseapp.com",
  projectId:"tstx-58474",
  storageBucket:"tstx-58474.firebasestorage.app",
  messagingSenderId:"1010020144942",
  appId:"1:1010020144942:web:9b7d15db2bda42af9f8cbf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const txList = document.getElementById("txList");
const searchInput = document.getElementById("searchInput");
const typeFilter = document.getElementById("typeFilter");
const dateFilter = document.getElementById("dateFilter");
const customDateRow = document.getElementById("customDateRow");
const dateStart = document.getElementById("dateStart");
const dateEnd = document.getElementById("dateEnd");
const btnExportPDF = document.getElementById("btnExportPDF");

let allTransactions = []; 
let currentFilteredList = []; // Utilisé pour savoir quoi mettre dans le PDF
let currentUserData = null; 

// Utilitaire pour charger le logo en base64 (nécessaire pour jsPDF)
async function getBase64Image(url) {
  return new Promise((resolve) => {
    let img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = () => {
      let canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      let ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL("image/jpeg"));
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  try {
    // 1. Récupérer le solde actuel
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (userSnap.exists()) {
      currentUserData = { uid: user.uid, ...userSnap.data() };
      document.getElementById("sumBalance").textContent = `${currentUserData.wallet || 0} Gdes`;
    } else {
      currentUserData = { uid: user.uid, username: "Utilisateur" };
    }

    // 2. Récupérer toutes ses transactions
    const q = query(
      collection(db, "walletTransactions"),
      where("userId", "==", user.uid),
      orderBy("createdAt", "desc")
    );
    const snap = await getDocs(q);

    allTransactions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    currentFilteredList = allTransactions; 

    // 3. Calculer les totaux
    calculateSummary(allTransactions);

    // 4. Affichage initial (3 derniers)
    renderTransactions(allTransactions.slice(0, 3), true);

  } catch (e) {
    console.error("Erreur chargement:", e);
    txList.innerHTML = `<div style="padding:20px;text-align:center;">Erreur de chargement</div>`;
  }
});

// Calcul du résumé
function calculateSummary(transactions) {
  let deposits = 0;
  let withdrawals = 0;
  let gifts = 0;

  transactions.forEach(tx => {
    if (tx.status === "completed") {
      if (tx.type === "deposit") deposits += Number(tx.amount || 0);
      if (tx.type === "withdraw") withdrawals += Number(tx.amount || 0);
      if (tx.type === "gift_sent" || tx.type === "gift_received") gifts += Number(tx.amount || 0);
    }
  });

  document.getElementById("sumDeposits").textContent = `${deposits} Gdes`;
  document.getElementById("sumWithdrawals").textContent = `${withdrawals} Gdes`;
  document.getElementById("sumGifts").textContent = `${gifts} Gdes`;
}

// Rendu HTML
function renderTransactions(transactions, isInitial = false) {
  txList.innerHTML = "";

  if (transactions.length === 0) {
    txList.innerHTML = `<div style="padding:20px;text-align:center;opacity:0.7;font-size:14px;">Aucune transaction trouvée</div>`;
    return;
  }

  let html = "";
  if (isInitial && allTransactions.length > 3) {
    html += `<div style="text-align:center; margin-bottom:10px; font-size:13px; color:#aaa;">Affichage des 3 dernières transactions. Utilisez la recherche ou téléchargez le PDF pour voir l'historique complet.</div>`;
  }

  transactions.forEach(tx => {
    let date = "—";
    let rawDate = "";
    if (tx.createdAt && tx.createdAt.toDate) {
      const d = tx.createdAt.toDate();
      date = d.toLocaleString('fr-FR');
      rawDate = d.toISOString().split('T')[0];
    }

    let label = tx.type || "Transaction";
    let color = "#ffffff";
    let sign = tx.amount >= 0 ? "+" : "-";

    switch (tx.type) {
      case "deposit": label = "Recharge"; color = "#2ecc71"; sign = "+"; break;
      case "withdraw": label = "Retrait"; color = "#ff0033"; sign = "-"; break;
      case "gift_sent": label = "Cadeau envoyé"; color = "#f39c12"; sign = "-"; break;
      case "gift_received": label = "Cadeau reçu"; color = "#f39c12"; sign = "+"; break;
      case "blue_payment": label = "Badge Blue"; color = "#3498db"; sign = "-"; break;
      case "merchant_request_payment": label = "Paiement marchand"; color = "#ff0050"; sign = "-"; break;
    }

    let statusLabel = tx.status || "—";
    let statusColor = "#aaa";
    if (tx.status === "pending") { statusLabel = "En attente"; statusColor = "#f39c12"; }
    if (tx.status === "completed") { statusLabel = "Terminée"; statusColor = "#2ecc71"; }
    if (tx.status === "failed") { statusLabel = "Échouée"; statusColor = "#ff0033"; }

    html += `
      <div class="card" data-raw-date="${rawDate}">
        <div class="row">
          <span class="label">ID</span>
          <span class="value" style="font-size:11px; opacity:0.7;">${tx.id}</span>
        </div>
        <div class="row"><span class="label">Date</span><span class="value" style="font-size:13px;">${date}</span></div>
        <div class="row"><span class="label">Détails</span><span class="value" style="color:${color}; font-size:13px;">${label}</span></div>
        <div class="row"><span class="label">Statut</span><span class="value" style="color:${statusColor}; font-size:13px;">${statusLabel}</span></div>
        <div class="row"><span class="label">Montant</span><span class="value" style="font-size:14px;">${sign}${tx.amount} Gdes</span></div>
      </div>
    `;
  });

  txList.innerHTML = html;
}

// Filtres
function applyFilters() {
  const searchVal = searchInput.value.toLowerCase().trim();
  const typeVal = typeFilter.value;
  const dateVal = dateFilter.value;

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfToday);
  startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  let filtered = allTransactions.filter(tx => {
    let matchSearch = true;
    if (searchVal) {
      const stringData = `${tx.id} ${tx.amount} ${tx.type}`.toLowerCase();
      matchSearch = stringData.includes(searchVal);
    }

    let matchType = true;
    if (typeVal !== "all") {
      if (typeVal === "deposit") matchType = (tx.type === "deposit");
      else if (typeVal === "withdraw") matchType = (tx.type === "withdraw");
      else if (typeVal === "gift") matchType = tx.type.includes("gift");
      else if (["pending", "completed", "failed"].includes(typeVal)) matchType = (tx.status === typeVal);
    }

    let matchDate = true;
    if (dateVal !== "all" && tx.createdAt) {
      const txDate = tx.createdAt.toDate();
      if (dateVal === "today") matchDate = (txDate >= startOfToday);
      else if (dateVal === "week") matchDate = (txDate >= startOfWeek);
      else if (dateVal === "month") matchDate = (txDate >= startOfMonth);
      else if (dateVal === "custom") {
        const dStart = new Date(dateStart.value);
        const dEnd = new Date(dateEnd.value);
        dEnd.setHours(23, 59, 59); 
        if (dateStart.value && dateEnd.value) {
          matchDate = (txDate >= dStart && txDate <= dEnd);
        }
      }
    }

    return matchSearch && matchType && matchDate;
  });

  currentFilteredList = filtered; // On garde en mémoire pour le PDF
  const isFiltering = searchVal !== "" || typeVal !== "all" || dateVal !== "all";
  renderTransactions(isFiltering ? filtered : filtered.slice(0, 3), !isFiltering);
}

// LOGIQUE DE GÉNÉRATION PDF
btnExportPDF.addEventListener("click", async () => {
  if (currentFilteredList.length === 0) {
    alert("Aucune transaction à exporter selon vos filtres actuels.");
    return;
  }
  
  btnExportPDF.textContent = "⏳ Création du relevé...";
  btnExportPDF.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const dateStr = new Date().toLocaleString("fr-FR");

    // 1. En-tête : Tentative de charger le logo HaytiClips
    let b64Logo = await getBase64Image("icons/icon-192.jpg");
    if(b64Logo) {
      doc.addImage(b64Logo, "JPEG", 14, 15, 20, 20);
    } else {
      // Fallback visuel si l'image ne charge pas (même si le chemin est bon)
      doc.setFillColor(255, 0, 80);
      doc.rect(14, 15, 10, 10, "F");
    }

    doc.setFontSize(16).setTextColor(255, 0, 80).setFont(undefined, 'bold');
    doc.text("Relevé de Transactions - HaytiClips", 40, 24);
    
    doc.setFontSize(10).setTextColor(100, 100, 100).setFont(undefined, 'normal');
    doc.text(`Généré le : ${dateStr}`, 40, 31);
    
    let username = currentUserData ? (currentUserData.name || currentUserData.username || "Utilisateur") : "Utilisateur";
    doc.text(`Compte : @${username}`, 196, 24, { align: "right" });
    
    doc.setDrawColor(200, 200, 200);
    doc.line(14, 40, 196, 40);

    // 2. Formatage des données du tableau
    let tableData = currentFilteredList.map(tx => {
      let dateText = tx.createdAt && tx.createdAt.toDate ? tx.createdAt.toDate().toLocaleString('fr-FR') : "—";
      
      let typeText = tx.type;
      switch (tx.type) {
        case "deposit": typeText = "Recharge"; break;
        case "withdraw": typeText = "Retrait"; break;
        case "gift_sent": typeText = "Cadeau (Envoyé)"; break;
        case "gift_received": typeText = "Cadeau (Reçu)"; break;
      }
      
      let statusText = tx.status === "completed" ? "Terminée" : (tx.status === "pending" ? "En attente" : "Échouée");
      let sign = (tx.amount >= 0 && tx.type !== "withdraw" && tx.type !== "gift_sent") ? "+" : "-";

      return [
        dateText,
        typeText,
        `${sign}${tx.amount} Gdes`,
        statusText,
        tx.id.substring(0, 10) + "..."
      ];
    });

    // 3. Dessiner le tableau avec autoTable
    doc.autoTable({
      startY: 45,
      head: [['Date', 'Opération', 'Montant', 'Statut', 'Référence']],
      body: tableData,
      theme: 'grid',
      headStyles: { fillColor: [255, 0, 80], textColor: [255,255,255], fontStyle: 'bold' },
      styles: { fontSize: 9 },
      alternateRowStyles: { fillColor: [245, 245, 245] }
    });

    doc.save(`Releve_HaytiClips_${username}.pdf`);
  } catch (err) {
    console.error(err);
    alert("Erreur lors de la création du fichier PDF.");
  }

  btnExportPDF.textContent = "📄 Télécharger mon relevé (PDF)";
  btnExportPDF.disabled = false;
});

// Écouteurs d'événements
searchInput.addEventListener("input", applyFilters);
typeFilter.addEventListener("change", applyFilters);

dateFilter.addEventListener("change", (e) => {
  if (e.target.value === "custom") {
    customDateRow.style.display = "flex";
  } else {
    customDateRow.style.display = "none";
    applyFilters();
  }
});

dateStart.addEventListener("change", applyFilters);
dateEnd.addEventListener("change", applyFilters);

console.log("Historique chargé");
</script>

</body>
</html>
