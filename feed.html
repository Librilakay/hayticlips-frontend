<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff0050">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>HaytiClips</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  height: 100%;
  overflow: hidden; /* 🔥 bloque scroll global */
  min-height: 100%;
  min-width: 100%;
}


.video-box {
  position: relative;
  width: 102%;
  height: 100dvh;
  scroll-snap-align: start;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

.video-container {
  position:absolute;
  width: 100%;
  height: calc(93vh - 60px); /* hauteur écran moins nav */
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.video-container video {
  height: 100%;
  width: auto; /* 🔥 très important */
  max-width: 100%;
  object-fit: contain;
  background: black;
}


/* TOP */

.logo{font-weight:700;font-size:20px}

/* FEED */
.feed {
  position: relative;
  height: 100dvh; /* 🔥 remplace 100vh */
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  
}


/* INFO */
.info {
  position: absolute;
  left: -50px;
  bottom: -215px;
  width: 65%;
  z-index: 5;
  color:white;
}
.username{font-weight:700;margin-bottom:-40px}
.caption{font-size:15px;margin-top:55px}

/* ACTIONS */
.actions{
  position:absolute;right:1px;bottom:210px;
  display:flex;flex-direction:column;gap:15px;
  align-items:center; gap:11px;
}
  .actions,
  .actions *{
    pointer-events: auto;
    z-index: 50;
  }
.avatar{
  width:48px;height:48px;border-radius:50%;
  overflow:hidden;border:2px solid #fff
}
.action{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:22px;
    cursor:pointer;
  }

  .action span{
    font-size:12px;
    line-height:1;
  }
  .like span{color:white;font-size:12px;}
.like.active{color:#ff0050}
.favorite.active{color:#ffd700}

/* FOLLOW */
  .avatar-wrapper{
    position:relative;
    width:48px;
    height:48px;
  }

  .avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #fff;
  }

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

  .follow-plus{
    position:absolute;
    bottom:-10px;
    left:53%;
    transform:translateX(-50%);
    width:15px;
    height:15px;
    border-radius:50%;
    background:#ff0050;
    color:#fff;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:2px solid #000;
  }
  .follow-plus.following{
    background:#555;
  }
  .follow-plus.following::before{
    content:"✓";
  }
  .follow-plus.following{
    color:#fff;
  }
/* NAV */
.nav{
  position:fixed;bottom:0;left:0;width:100%;
  height:70px;display:flex;justify-content:space-around;
  align-items:center;background:#000;border-top:1px solid #222;z-index: 1000;
}

/* COMMENTS PANEL REVISITÉ POUR CLAVIER MOBILE */
.comments-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  /* On limite la hauteur à 50% de l'écran pour ne JAMAIS cacher la vidéo en haut */
  height: 50vh; 
  max-height: 380px; 
  background: white;
  border-radius: 16px 16px 0 0;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
}

.comments-panel.show {
  transform: translateY(0);
}

.comments-header {
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: black;
  font-weight: 700;
  font-size: 16px;
  border-bottom: 1px solid #eee;
  flex-shrink: 0;
}

.comments-header button {
  background: #f0f0f0;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: black;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.comments-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  /* Empêche la page entière de rebondir quand on défile les commentaires sur iOS */
  overscroll-behavior: contain; 
  -webkit-overflow-scrolling: touch;
}

/* BARRE DE SAISIE MOBILE ET ATTACHÉE */
.comment-input {
  position: sticky; /* Reste toujours collée en bas du panneau */
  bottom: 0;
  display: flex;
  padding: 12px 16px;
  gap: 10px;
  background: white;
  border-top: 1px solid #eee;
  /* Marge de sécurité pour la barre d'accueil des iPhone récents */
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 10;
}

.comment-input input {
  flex: 1;
  border-radius: 20px;
  padding: 10px 15px;
  border: 1px solid #ddd;
  background: #f9f9f9;
  font-size: 15px;
  outline: none;
  color: black;
}

.comment-input input:focus {
  border-color: #ff0050;
  background: white;
}

.comment-input button {
  border-radius: 20px;
  padding: 0 16px;
  color: white;
  background: #ff0050;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

/* Corriger le bouton commentaire sur la vidéo */
.comment-btn {
  pointer-events: auto !important;
  z-index: 100 !important;
  position: relative;
  color: white;
}
  .comment{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }
  .comment img{
    width:32px;
    height:32px;
    border-radius:50%;
  }
  .comment .meta{
    font-size:13px;
  }
  .comment .date{
    color:#aaa;
    font-size:11px;
    margin-left:6px;
  }
  .feed.disabled {
    pointer-events: none;
  }
  .replies.hidden {
    display: none;
  }
  .replies.hidden { display: none; }
  .video-box {
    background: #000;
  }

  .video-box video {
    background: #000;
  }
  .gift-list { padding: 20px; }
.gift-item {
  padding: 15px;
  margin: 10px 0;
  background: #222;
  border-radius: 10px;
  cursor: pointer;
}
/* CADEAUX */
.gift-item {
  padding: 15px;
  margin: 10px 0;
  background: black;
  border-radius: 10px;
  color:white;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  text-align: center;
}
.closeGifts{
  background:black;
  color:white;
}
.gift-item.selected {
  border-color: #ff0050;
  background: #1a1a1a;
}

#sendGift:disabled {
  background: #555;
  cursor: not-allowed;
}

#sendGift:not(:disabled) {
  background: #ff0050;
  cursor: pointer;
}

.gift-item.selected { border: 9px solid #ff0050; }

#giftPanel {
  overflow-y: auto;
  max-height: 100vh;
}

#feed.disabled {
  overflow: hidden;
}
.video-box .info {
  position: relative;
  z-index: 3;
  opacity: 1 !important;
  visibility: visible !important;
}
.video-box video {
  z-index: 1;
}
.actions {
  z-index: 4;
}
.mention{
  color:#4da6ff;
  font-weight:600;
  cursor:pointer;
}
.hashtag{
  color:#ff0050;
  cursor:pointer;
}

.report-item{
  color: black;
  font-size: 15px;
  }
#reportPanel{
color:white;
  font-size: 18px;
}

/* BADGE BASE */
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:16px;
  height:16px;
  border-radius:50%;
  margin-left:-2px;
}

.comment-username,
.reply-username{
  display:inline-flex;
  align-items:center;
  gap:-3px;
}

.comment-username .badge,
.reply-username .badge{
  width:12px;
  height:12px;
  margin-left:2px;
  box-shadow: 0 0 4px rgba(29,161,242,0.5);
}
.comment-username .badge svg,
.reply-username .badge svg{
  width:6px;
  height:6px
}
.badge svg{
  width:10px;
  height:10px;
}

/* GOLD */
.badge-gold{
  background:linear-gradient(135deg,#ffd700,#ffb700,#ff8c00);
  box-shadow:0 0 10px rgba(255,215,0,0.7);
  animation:goldPulse 2s infinite alternate;
}

@keyframes goldPulse{
  from{ box-shadow:0 0 8px rgba(255,215,0,0.6);}
  to{ box-shadow:0 0 16px rgba(255,200,0,1);}
}

/* BLUE */
.badge-blue{
  background:linear-gradient(135deg,#1da1f2,#0d8ddb);
  box-shadow:0 0 5px rgba(29,161,242,0.5);
  animation:blueGlow 2s infinite alternate;
}

@keyframes blueGlow{
  from{ box-shadow:0 0 6px rgba(29,161,242,0.5);}
  to{ box-shadow:0 0 12px rgba(29,161,242,0.9);}
}

.comment .date {
  color: black;
  font-size: 12px;
}

.reply-btn {
  color: black !important;
}

.toggle-replies {
  color: black !important;
}

.comment-like {
  cursor: pointer;
  color: #999;
  font-size: 14px;
}

.comment-like.active {
  color: #ff0050;
}

.reply-item {
  font-size: 13px;
  color: black;   /* 🔥 réponses en noir */
  margin-bottom: 4px;
}

.reply-badge {
  font-size: 9px;   /* ultra petit */
  margin-left: -2px;
  vertical-align: middle;
}

.nav-btn{
  width:40px;
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.nav-btn svg{
  width:26px;
  height:26px;
  fill:white;
}

.upload{
  background:white;
  border-radius:8px;
}

.upload svg{
  width:22px;
  height:22px;
}

/* Animation de rebond pour le Like */
@keyframes heartPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* Le cœur devient rouge quand il est liké */
.action.like.active .heart-icon,
.comment-like.active .heart-icon {
  fill: #ff0050 !important;
  animation: heartPop 0.3s ease-in-out;
}

</style>
</head>

<body>

<div class="feed" id="feed"></div>

<div class="nav">
    <div id="nav-home" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg></div>
    <div id="nav-search" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>
    <div id="nav-add" class="nav-btn upload"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="black" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div id="nav-notif" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></div>
    <div id="nav-profile" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
  </div>
  
  <div id="pinModal" style="
position:fixed;
display:flex;
align-items:center;
justify-content:center;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="background:#111;padding:20px;border-radius:16px;width:90%;max-width:350px;text-align:center;">
<h3>Entrer votre code PIN</h3>
<input id="pinInput"
maxlength="6"
type="password"
inputmode="numeric"
pattern="[0-9]*"
style="
width:100%;
padding:12px;
margin-top:15px;
background:#1a1a1a;
border:1px solid #333;
color:white;
border-radius:10px;
text-align:center;
font-size:20px;
letter-spacing:5px;">
<button id="verifyPinBtn" style="
width:100%;
padding:12px;
margin-top:15px;
background:#ff0050;
border:none;
border-radius:10px;
color:white;">Valider</button>
</div>
</div>

<!-- COMMENTS -->
  <div id="commentsPanel" class="comments-panel">
  <div class="comments-header">
    <span>Commentaires</span>
    <button id="closeComments">✕</button>
  </div>
  <div id="commentsList" class="comments-list"></div>
  <div class="comment-input">
    <input id="commentText" placeholder="Ajouter un commentaire…" />
    <button id="sendComment" type="button">Envoyer</button>
  </div>
</div>

   <!-- MODAL CADEAUX -->
<!-- MODAL CADEAUX -->
<div id="giftPanel" class="comments-panel">
  <div class="comments-header">
    <span>Envoyer un cadeau</span>
    <button id="closeGifts">✕</button>
  </div>
  <div style="padding:20px;">
    <div class="gift-item" data-amount="25" data-fee="10"> 25 G </div>
    <div class="gift-item" data-amount="50" data-fee="15"> 50 G </div>
    <div class="gift-item" data-amount="100" data-fee="25"> 100 G </div>
    <div class="gift-item" data-amount="250" data-fee="50"> 250 G </div>
    <div class="gift-item" data-amount="500" data-fee="100"> 500 G </div>
    <div class="gift-item" data-amount="1000" data-fee="200"> 1000 G </div>
  </div>
  <!-- ⬇️ BOUTON AJOUTÉ ICI ⬇️ -->
  <button id="sendGift" style="margin:20px;padding:15px;background:#ff0050;border:none;color:white;border-radius:10px;width:calc(100% - 40px);">
    Envoyer le cadeau
  </button>
</div>

<!-- MODAL SIGNALEMENT -->
<div id="reportPanel" class="comments-panel">
  <div class="comments-header">
    <span>Signaler la vidéo</span>
    <button id="closeReport">✕</button>
  </div>
<div style="padding:20px;">
    <div class="report-item" data-reason="nudity">Contenu sexuel</div>
    <div class="report-item" data-reason="violence">Violence</div>
    <div class="report-item" data-reason="hate">Discours haineux</div>
    <div class="report-item" data-reason="spam">Spam</div>
  </div>
  <button id="sendReport" style="
    margin:20px;
    padding:15px;
    background:#ff0050;
    border:none;
    color:white;
    border-radius:10px;
    width:calc(100% - 40px);">
    Envoyer signalement
  </button>
</div>

  <script type="module" src="feed.js"></script>


</body>
</html>
