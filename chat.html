<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff0050">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  overflow:hidden;
}

body{
  height:100dvh;
  display:flex;
  flex-direction:column;
  background: #0a0a0a; /* Fond légèrement plus clair que noir pur pour contraster avec le header */
}

/* ================= HEADER PRO ================= */
.header{
  height:65px;
  min-height:65px;
  display:flex;
  align-items:center;
  padding:0 10px;
  background:rgba(0, 0, 0, 0.85);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  position:sticky;
  top:0;
  z-index:100;
}

.back-btn{
  width:40px;
  height:40px;
  border:none;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.back-btn svg{
  fill:#fff;
  width:24px;
  height:24px;
}

.header-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  margin:0 10px 0 2px;
  border:1px solid #333;
  display:none; /* Affiché via JS */
}

.header-main{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title-wrap{
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

#chatTitle{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:center;
}

#chatStatus{
  font-size:12px;
  color:#aaa;
  margin-top:2px;
  font-weight:500;
}

#streakBox{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:20px;
  background:rgba(255, 255, 255, 0.05);
  border:1px solid rgba(255,255,255,0.1);
  font-weight:700;
  font-size:13px;
  flex-shrink:0;
}

/* ================= MESSAGES ================= */
.messages{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 10px;
  display:flex;
  flex-direction:column;
  gap:6px; /* Espace réduit pour regrouper les messages */
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

.messages::-webkit-scrollbar{ width:0; }

.message-row{
  display:flex;
  align-items:flex-end;
  width:100%;
  margin-bottom: 6px;
}

.me-row{ justify-content:flex-end; }
.other-row{ justify-content:flex-start; }

.msg-wrapper{
  display:flex;
  flex-direction:column;
  max-width:78%;
}

.me-row .msg-wrapper { align-items:flex-end; }
.other-row .msg-wrapper { align-items:flex-start; }

.msg-sender-name{
  font-size:11px;
  color:#888;
  margin-bottom:3px;
  margin-left:4px;
}

/* Bulle de message */
.msg{
  position:relative;
  padding:8px 12px 24px 12px; /* Plus d'espace en bas pour l'heure */
  font-size:15px;
  line-height:1.4;
  white-space:pre-wrap;
  word-wrap:break-word;
  border-radius:18px;
  min-width: 80px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}

.me{
  background:#ff0050;
  color:#fff;
  border-bottom-right-radius:4px; /* Effet bulle */
}

.other{
  background:#262628;
  color:#eaeaea;
  border-bottom-left-radius:4px; /* Effet bulle */
}

/* Méta info DANS la bulle (heure + vu) */
.msg-meta{
  position:absolute;
  bottom:4px;
  right:10px;
  display:flex;
  align-items:center;
  gap:4px;
  font-size:10px;
  color:rgba(255,255,255,0.7);
  user-select:none;
}

.msg-ticks svg{
  width:14px;
  height:14px;
  fill:rgba(255,255,255,0.9);
}

.system-message{
  align-self:center;
  background:rgba(255,255,255,0.08);
  padding:5px 12px;
  border-radius:12px;
  font-size:11.5px;
  font-weight:600;
  color:#ccc;
  margin:12px 0;
  max-width:90%;
  text-align:center;
}

/* ================= TYPING INDICATOR ================= */
.typing-indicator{
  display:none; /* Prêt pour quand tu coderas la logique */
  align-items:center;
  gap:4px;
  background:#262628;
  padding:12px 16px;
  border-radius:18px;
  width:fit-content;
  border-bottom-left-radius:4px;
  margin-bottom:10px;
}
.typing-indicator span{
  width:6px; height:6px;
  background:#aaa;
  border-radius:50%;
  animation: typing 1.4s infinite ease-in-out both;
}
.typing-indicator span:nth-child(1){ animation-delay:-0.32s; }
.typing-indicator span:nth-child(2){ animation-delay:-0.16s; }
@keyframes typing {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* ================= INPUT BAR PRO ================= */
.inputBar{
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:#0a0a0a;
  border-top:1px solid rgba(255,255,255,0.05);
}

.attach-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:transparent;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  margin-bottom:4px;
}
.attach-btn svg{ fill:#ff0050; width:26px; height:26px; }

.inputBox{
  flex:1;
  display:flex;
  align-items:center;
  background:#1e1e1e;
  border-radius:22px;
  padding:2px 4px 2px 14px;
  min-height:44px;
  border:1px solid rgba(255,255,255,0.05);
}

.inputBox input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:15px;
  padding:10px 0;
}

.inputBox input::placeholder{ color:#777; }

.send-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#ff0050;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition: transform 0.1s;
}
.send-btn:active{ transform:scale(0.9); }
.send-btn svg{ fill:#fff; width:18px; height:18px; margin-left:2px; }

/* ================= BADGES ================= */
.chat-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:14px;
  height:14px;
  border-radius:50%;
  margin-left:4px;
}
.chat-badge.gold{
  background:linear-gradient(135deg,#ffd700,#ffb700,#ff8c00);
}
.chat-badge.blue{
  background:linear-gradient(135deg,#1da1f2,#0d8ddb);
}
.chat-badge svg{ width:8px; height:8px; }
.chat-badge.gold svg{ fill:black; }
.chat-badge.blue svg{ fill:white; }

@keyframes pinkPulse{
  0%{box-shadow:0 0 15px #ff0050}
  50%{box-shadow:0 0 45px #ff0050}
  100%{box-shadow:0 0 15px #ff0050}
}
</style>
</head>
<body>

<div class="header" id="chatHeader">
  <button class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
  </button>

  <img id="headerAvatar" src="" class="header-avatar">

  <div class="header-main">
    <div class="header-title-wrap">
      <div id="chatTitle">...</div>
      <span id="chatStatus">Connexion...</span>
    </div>

    <div id="streakBox">
      <svg id="streakFire" width="16" height="16" viewBox="0 0 24 24" fill="#555">
        <path d="M12 2C10 6 6 8 6 13a6 6 0 0012 0c0-3-2-5-4-7 0 2-1 3-2 4-1-1-1-3 0-8z"/>
      </svg>
      <span id="streakNumber">0</span>
    </div>
  </div>
</div>

<div class="messages" id="messages">
  <div class="typing-indicator" id="typingIndicator">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="inputBar">
  <button class="attach-btn">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
  
  <div class="inputBox">
    <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot,
  serverTimestamp, deleteDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain:"tstx-58474.firebaseapp.com",
  projectId:"tstx-58474"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const messagesDiv = document.getElementById("messages");
const typingIndicator = document.getElementById("typingIndicator"); // Pour ne pas le supprimer
const sendBtn = document.getElementById("sendBtn");
const input = document.getElementById("messageInput");
const header = document.getElementById("chatTitle");
const chatStatus = document.getElementById("chatStatus");
const headerAvatar = document.getElementById("headerAvatar");
const streakNumber = document.getElementById("streakNumber");
const streakFire = document.getElementById("streakFire");

const convId = new URLSearchParams(window.location.search).get("conv");

// --- HELPER TEMPS ---
function formatTime(timestamp) {
  if(!timestamp) return "";
  const date = timestamp.toDate();
  return date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}

onAuthStateChanged(auth, async (user)=>{

  if(!user || !convId){
    location.href="conversations.html";
    return;
  }

  const convoRef = doc(db,"conversations",convId);
  const convoSnap = await getDoc(convoRef);

  if(!convoSnap.exists()){
    location.href="conversations.html";
    return;
  }

  const data = convoSnap.data();
  const participants = data.participants;
  const p1 = participants[0];
  const p2 = participants[1];

  // Gestion Game 365 (Intacte)
  onSnapshot(convoRef,(snap)=>{
    const game = snap.data().game365;
    if(!game) return;

    streakNumber.textContent = game.streak || 0;
    const today = new Date().toISOString().slice(0,10);

    if(game.todayPlayers && game.todayPlayers[p1] && game.todayPlayers[p2] && game.lastDay === today){
      streakFire.style.fill = "#ff2b2b";
    }else{
      streakFire.style.fill = "#555";
    }
  });

  function resetFireAtMidnight(){
    const now = new Date();
    const midnight = new Date();
    midnight.setHours(24,0,0,0);
    const timeout = midnight.getTime() - now.getTime();
    setTimeout(()=>{ streakFire.style.fill = "#555"; resetFireAtMidnight(); },timeout);
  }
  resetFireAtMidnight();

  if(!data.participants.includes(user.uid)){
    location.href="conversations.html";
    return;
  }

  // HEADER : Info de l'autre utilisateur + STATUT EN LIGNE
  const otherUid = data.participants.find(p=>p!==user.uid);
  
  onSnapshot(doc(db,"users",otherUid), (snap) => {
    if(snap.exists()){
      const u = snap.data();
      headerAvatar.src = u.avatar || "https://i.pravatar.cc/150";
      headerAvatar.style.display = "block";
      
      let badgeHTML = "";
      if(u.verification?.type === "blue") badgeHTML = `<span class="chat-badge blue"><svg viewBox="0 0 24 24"><path d="M20.285 6.709l-11.025 11.025-5.545-5.545 1.414-1.414 4.131 4.131 9.611-9.611z"/></svg></span>`;
      if(u.verification?.type === "gold" && u.verification?.status === "active") badgeHTML = `<span class="chat-badge gold"><svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.193-5.934 5.782 1.402 8.177L12 18.896l-7.336 3.874 1.402-8.177L.132 9.211l8.2-1.193z"/></svg></span>`;
      
      header.innerHTML = `${u.username || "Utilisateur"} ${badgeHTML}`;

      // En ligne ou hors ligne
      if(u.online){
        chatStatus.textContent = "En ligne";
        chatStatus.style.color = "#19c37d";
      } else {
        chatStatus.textContent = "Hors ligne";
        chatStatus.style.color = "#aaa";
      }
    }
  });

  // LECTURE DES MESSAGES
  const msgQuery = query(collection(db,"conversations",convId,"messages"), orderBy("createdAt","asc"));

  onSnapshot(msgQuery, (snap)=>{
    // On nettoie tout SAUF le typing indicator
    Array.from(messagesDiv.children).forEach(child => {
      if(child.id !== "typingIndicator") child.remove();
    });

    if(snap.empty){
      const emptyDiv = document.createElement("div");
      emptyDiv.className = "empty-chat";
      emptyDiv.textContent = "Aucun message pour le moment. Lancez la conversation !";
      messagesDiv.insertBefore(emptyDiv, typingIndicator);
      return;
    }

    let lastSenderId = null;

    snap.docs.forEach(d => {
      const m = d.data();
      
      // Messages Système
      if(m.system && !m.type){
        const sys = document.createElement("div");
        sys.className = "system-message";
        sys.textContent = m.text;
        messagesDiv.insertBefore(sys, typingIndicator);
        lastSenderId = "system";
        return;
      }

      // Message Game 365 Win
      if(m.type === "game365_win"){
        const box = document.createElement("div");
        box.style.cssText = "text-align:center; padding:22px 18px; margin:15px 0; border-radius:20px; background:linear-gradient(135deg,#111,#000); box-shadow:0 0 25px rgba(255,0,80,0.6); animation:pinkPulse 2s infinite;";
        box.innerHTML = `
        <div style="margin-bottom:15px">
          <svg width="52" height="52" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 18px #ff0050);">
            <defs><linearGradient id="starPremium" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff2a6d"/><stop offset="100%" stop-color="#ff0050"/></linearGradient></defs>
            <path fill="url(#starPremium)" d="M12 .587l3.668 7.431 8.2 1.193-5.934 5.782 1.402 8.177L12 18.896l-7.336 3.874 1.402-8.177L.132 9.211l8.2-1.193z"/>
          </svg>
        </div>
        <div style="font-size:22px; font-weight:bold; color:#ff0050; text-shadow:0 0 10px #ff0050; margin-bottom:8px;">365 / 365</div>
        <div style="font-size:15px; opacity:.9; line-height:1.5;"><strong>${header.textContent}</strong> & <strong>vous</strong><br>officiellement nommés<br><b>Amis de l'année</b><br>par <b>HaytiClips</b></div>`;
        messagesDiv.insertBefore(box, typingIndicator);
        lastSenderId = "system";
        return;
      }

      // Construction du message normal
      const isMe = (m.sender === user.uid);
      const row = document.createElement("div");
      row.className = "message-row " + (isMe ? "me-row" : "other-row");

      const wrapper = document.createElement("div");
      wrapper.className = "msg-wrapper";

      // On affiche le nom seulement si l'expéditeur change et que ce n'est pas "moi"
      if (!isMe && lastSenderId !== m.sender) {
        const nameDiv = document.createElement("div");
        nameDiv.className = "msg-sender-name";
        // On récupère le texte pur du header (sans le HTML du badge) pour le nom
        nameDiv.textContent = header.innerText.split(' ')[0] || "Contact"; 
        wrapper.appendChild(nameDiv);
      }

      const bubble = document.createElement("div");
      bubble.className = "msg " + (isMe ? "me" : "other");
      
      // Texte
      const textNode = document.createTextNode(m.text);
      bubble.appendChild(textNode);

      // Meta (Heure + Checkmarks)
      const metaDiv = document.createElement("div");
      metaDiv.className = "msg-meta";
      
      const timeSpan = document.createElement("span");
      timeSpan.textContent = formatTime(m.createdAt);
      metaDiv.appendChild(timeSpan);

      // Double Ticks pour les messages envoyés
      if(isMe){
        const ticks = document.createElement("span");
        ticks.className = "msg-ticks";
        // Vu/Reçu : prêt pour l'intégration de la logique (couleur bleue si "vu")
        ticks.innerHTML = `<svg viewBox="0 0 24 24"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>`;
        metaDiv.appendChild(ticks);
      }

      bubble.appendChild(metaDiv);

      // Gestion suppression
      let pressTimer;
      const startPress = () => { pressTimer = setTimeout(async ()=>{ if(confirm("Supprimer ce message ?")) await deleteDoc(doc(db,"conversations",convId,"messages",d.id)); }, 600); };
      const endPress = () => clearTimeout(pressTimer);

      if (isMe) {
        bubble.addEventListener("touchstart", startPress);
        bubble.addEventListener("touchend", endPress);
        bubble.addEventListener("mousedown", startPress);
        bubble.addEventListener("mouseup", endPress);
      }

      wrapper.appendChild(bubble);
      row.appendChild(wrapper);
      messagesDiv.insertBefore(row, typingIndicator);

      lastSenderId = m.sender;
    });

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  // ENVOI MESSAGE (Logique Game 365 intacte)
  sendBtn.onclick = async ()=>{
    const text = input.value.trim();
    if(!text) return;
    
    input.value = ""; // Vider immédiatement pour l'UX

    await addDoc(collection(db,"conversations",convId,"messages"),{
      sender:user.uid,
      text:text,
      createdAt:serverTimestamp()
    });

    await updateDoc(convoRef,{
      lastMessage:text,
      lastMessageAt:serverTimestamp()
    });
    
    // Logique Game 365
    const convoSnap2 = await getDoc(convoRef);
    let game = convoSnap2.data().game365 || {};

    if(!convoSnap2.data().game365){
      await updateDoc(convoRef,{ game365:{ streak:0, todayPlayers:{}, lastDay:"", dayValidated:false } });
      game = { streak:0, todayPlayers:{}, lastDay:"", dayValidated:false };
    }

    function getLocalDateString(date = new Date()) {
      const offset = date.getTimezoneOffset() * 60000;
      const local = new Date(date.getTime() - offset);
      return local.toISOString().slice(0,10);
    }

    const today = getLocalDateString();
    let players = {...(game.todayPlayers || {})};
    let streak = Number(game.streak || 0);
    let dayValidated = game.dayValidated === true;

    const yesterdayDate = new Date();
    yesterdayDate.setDate(yesterdayDate.getDate() - 1);
    const yesterday = getLocalDateString(yesterdayDate);

    if (game.lastDay !== today) {
      if (game.lastDay !== yesterday) streak = 0;
      players = {};
      dayValidated = false;
    }

    players[user.uid] = true;

    if (players[p1] && players[p2] && !dayValidated) {
      streakFire.style.fill = "#ff2b2b";
      streak++;
      dayValidated = true;

      await addDoc(collection(db,"conversations",convId,"messages"),{
        system:true, sender:"system", text:"🔥 Jour validé ("+streak+"/365)", createdAt:serverTimestamp()
      });

      if (streak === 365) {
        await addDoc(collection(db,"conversations",convId,"messages"),{
          system:true, sender:"system", type:"game365_win", createdAt:serverTimestamp()
        });
      }
    }

    await updateDoc(convoRef,{
      "game365.streak": streak,
      "game365.todayPlayers": players,
      "game365.lastDay": today,
      "game365.dayValidated": dayValidated
    });

    // Notif Push
    const convoData = convoSnap2.data();
    const otherUid = convoData.participants.find(p=>p!==user.uid);
    const meSnap = await getDoc(doc(db,"users",user.uid));
    const meData = meSnap.data();

    await addDoc(collection(db,"notifications"),{
      type:"message",
      from:user.uid,
      fromUsername: meData.username || "Utilisateur",
      fromAvatar: meData.avatar || null,
      to: otherUid,
      read:false,
      preview: text.substring(0,100),
      conversationId: convId,
      createdAt: serverTimestamp()
    });
  };

  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      e.preventDefault();
      sendBtn.click();
    }
  });

});
</script>
</body>
</html>
