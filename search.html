<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Explorer – HaytiClips</title>

<style>
/* ================= RESET ET BLOCAGE PAGE STATIQUE ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000000;
  color: #ffffff;
  overflow: hidden; 
  overscroll-behavior-y: none;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh; 
}

/* ================= CONTENU SCROLLABLE ================= */
.page{
  flex: 1; 
  overflow-y: auto; 
  overscroll-behavior-y: contain; 
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: max(env(safe-area-inset-top, 15px), 15px) 0 90px 0; /* Gère l'encoche mobile */
}

.page::-webkit-scrollbar { width: 0; }

/* ================= BARRE DE RECHERCHE ================= */
.search-container {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  margin-bottom: 12px;
}

.search-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #262626;
  border-radius: 10px;
  padding: 0 12px;
  height: 40px;
  transition: all 0.3s ease;
}

.search-icon {
  width: 18px;
  height: 18px;
  opacity: .7;
  flex-shrink: 0;
}

.search-wrap input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 16px;
}

.search-wrap input::placeholder {
  color: #8e8e8e;
}

.clear-btn {
  border: none;
  background: #444;
  color: #fff;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.clear-btn.show {
  display: flex;
}

.cancel-btn {
  display: none;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  padding: 0;
}

/* ================= GRILLE EXPLORER ================= */
.explore-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  width: 100%;
}

.explore-item {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;
  background: #111;
  cursor: pointer;
  overflow: hidden;
}

.explore-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ================= RESULTATS RECHERCHE USER ================= */
.results {
  display: flex;
  flex-direction: column;
  padding: 0 14px;
}

.state-card{
  text-align: center;
  color: #8e8e8e;
  font-size: 14px;
  padding: 20px;
}

.user-card{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  padding: 10px 0;
}

.user-card:active{
  opacity: 0.7;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #222;
  background:#000;
  flex-shrink:0;
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-width:0;
  flex: 1;
}

.user-main{
  flex:1;
  min-width:0;
}

.username{
  font-weight:600;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:2px;
}

.bio{
  font-size:14px;
  color:#8e8e8e;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* BADGES */
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:14px;
  height:14px;
  border-radius:50%;
  flex-shrink:0;
}

.badge svg{ width:8px; height:8px; }
.badge-blue{ background:#1da1f2; }
.badge-gold{ background:linear-gradient(135deg,#ffd700,#ff8c00); }

/* ================= NAV BAR MOBILE FIXE ================= */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #000;
  border-top: 1px solid #222;
  z-index: 1000;
}

.nav-btn {
  width: 40px;
  height: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.nav-btn svg {
  width: 26px;
  height: 26px;
  fill: white;
}

.upload {
  background: white;
  border-radius: 8px;
}

.upload svg {
  width: 22px;
  height: 22px;
  fill: black;
}
</style>
</head>
<body>

<div class="page">
  <!-- Barre de recherche -->
  <div class="search-container">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Rechercher">
      <button id="clearBtn" class="clear-btn" aria-label="Effacer">✕</button>
    </div>
    <button id="cancelBtn" class="cancel-btn">Annuler</button>
  </div>

  <!-- Grille par défaut (Explorer) -->
  <div id="exploreGrid" class="explore-grid"></div>

  <!-- Résultats de recherche -->
  <div id="results" class="results" style="display: none;">
    <div class="state-card">Tapez un nom pour rechercher.</div>
  </div>
</div>

<!-- Navigation -->
<div class="nav">
  <div class="nav-btn" onclick="go('feed.html')">
    <svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
  </div>
  <div class="nav-btn" onclick="go('search.html')">
    <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="nav-btn upload" onclick="go('upload.html')">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="black" stroke-width="2.5" stroke-linecap="round"/></svg>
  </div>
  <div class="nav-btn" onclick="go('notif.html')" id="notifIcon">
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
  </div>
  <div class="nav-btn" onclick="go('profil.html')">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  </div>
</div>
     
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, collection, getDocs, query, orderBy, limit, startAt, endAt
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain:"tstx-58474.firebaseapp.com",
  projectId:"tstx-58474",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
const cancelBtn = document.getElementById("cancelBtn");
const results = document.getElementById("results");
const exploreGrid = document.getElementById("exploreGrid");

let currentUser = null;
let searchTimeout = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
  loadExploreVideos();
});

// ================= GESTION DE L'INTERFACE =================

searchInput.addEventListener("focus", () => {
  cancelBtn.style.display = "block";
  exploreGrid.style.display = "none";
  results.style.display = "flex";
});

cancelBtn.addEventListener("click", () => {
  searchInput.value = "";
  cancelBtn.style.display = "none";
  clearBtn.classList.remove("show");
  results.style.display = "none";
  exploreGrid.style.display = "grid";
  results.innerHTML = `<div class="state-card">Tapez un nom pour rechercher.</div>`;
});

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  clearBtn.classList.remove("show");
  searchInput.focus();
  results.innerHTML = `<div class="state-card">Tapez un nom pour rechercher.</div>`;
});

// ================= CHARGEMENT GRILLE VIDÉOS =================
async function loadExploreVideos() {
  try {
    // Récupérer un lot de vidéos
    const videosQuery = query(collection(db, "videos"), limit(60));
    const snap = await getDocs(videosQuery);
    
    const excludedStatuses = ["flagged", "pending_ia", "archived"];
    let candidateVideos = [];

    snap.docs.forEach(docSnap => {
      const v = docSnap.data();
      const mediaUrl = v.mediaUrls && v.mediaUrls[0] ? v.mediaUrls[0] : '';
      
      // Filtre l'absence d'URL media et les statuts exclus
      if (!mediaUrl) return;
      if (v.status && excludedStatuses.includes(v.status)) return;

      candidateVideos.push({
        id: docSnap.id,
        mediaUrl: mediaUrl
      });
    });

    // Mélange aléatoire (Fisher-Yates shuffle)
    for (let i = candidateVideos.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidateVideos[i], candidateVideos[j]] = [candidateVideos[j], candidateVideos[i]];
    }

    // Sélectionner uniquement les 9 premières vidéos après mélange
    const randomVideos = candidateVideos.slice(0, 9);

    exploreGrid.innerHTML = "";

    randomVideos.forEach(video => {
      const item = document.createElement("div");
      item.className = "explore-item";
      
      item.innerHTML = `
        <video src="${video.mediaUrl}#t=0.1" class="explore-video" preload="metadata" muted playsinline loop></video>
      `;

      item.onclick = () => {
        window.location.href = `feed.html?videoId=${video.id}`;
      };

      const vidTag = item.querySelector('video');
      item.addEventListener("mouseenter", () => vidTag.play().catch(e => null));
      item.addEventListener("mouseleave", () => vidTag.pause());

      exploreGrid.appendChild(item);
    });

  } catch (err) {
    console.error("Erreur chargement explorer:", err);
  }
}

// ================= RECHERCHE D'UTILISATEURS =================
function renderState(message){
  results.innerHTML = `<div class="state-card">${message}</div>`;
}

function getBadgeHTML(user){
  if (!user.verification) return "";
  if (user.verification.type === "gold" && user.verification.status === "active") {
    return `<span class="badge badge-gold"><svg viewBox="0 0 24 24" fill="black"><path d="M12 .587l3.668 7.431 8.2 1.193-5.934 5.782 1.402 8.177L12 18.896l-7.336 3.874 1.402-8.177L.132 9.211l8.2-1.193z"/></svg></span>`;
  }
  if (user.verification.type === "blue") {
    return `<span class="badge badge-blue"><svg viewBox="0 0 24 24" fill="white"><path d="M20.285 6.709l-11.025 11.025-5.545-5.545 1.414-1.414 4.131 4.131 9.611-9.611z"/></svg></span>`;
  }
  return "";
}

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimeout);

  const rawValue = searchInput.value.trim();
  if(rawValue) clearBtn.classList.add("show");
  else clearBtn.classList.remove("show");

  searchTimeout = setTimeout(async () => {
    const value = searchInput.value.toLowerCase().trim();
    if (!currentUser) return;

    if (value === "") {
      renderState("Tapez un nom pour rechercher.");
      return;
    }

    try {
      const usersQuery = query(
        collection(db, "users"),
        orderBy("usernameLower"),
        startAt(value),
        endAt(value + "\uf8ff"),
        limit(15)
      );

      const usersSnap = await getDocs(usersQuery);

      if (usersSnap.empty) {
        renderState("Aucun résultat trouvé.");
        return;
      }

      results.innerHTML = "";

      for (const userDoc of usersSnap.docs) {
        const user = { id: userDoc.id, ...userDoc.data() };
        const badgeHTML = getBadgeHTML(user);

        const div = document.createElement("div");
        div.className = "user-card";
        div.onclick = () => window.location.href = `profil.html?uid=${user.id}`;

        div.innerHTML = `
          <img src="${user.avatar || 'https://i.pravatar.cc/150?u=' + user.id}" class="avatar">
          <div class="meta-row">
            <div class="user-main">
              <div class="username">
                ${user.username || "Sans nom"} ${badgeHTML}
              </div>
              <div class="bio">
                ${user.fullName || user.bio || ""}
              </div>
            </div>
          </div>
        `;
        results.appendChild(div);
      }
    } catch (err) {
      console.error("Erreur recherche:", err);
    }
  }, 300);
});

window.go = (url) => location.href = url;
</script>

</body>
</html>
