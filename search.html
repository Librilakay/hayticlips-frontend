<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Recherche – HaytiClips</title>

<style>
/* ================= RESET ET BLOCAGE PAGE STATIQUE ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y; /* Empêche le pinch-to-zoom natif */
}

html, body {
  width: 100%;
  height: 100%;
  background: #000000;
  color: #ffffff;
  overflow: hidden; /* Empêche le scroll global sur toute la page */
  overscroll-behavior-y: none; /* Bloque l'effet de rebond élastique sur iOS */
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh; /* S'adapte parfaitement à l'écran mobile */
}

/* ================= HEADER FIXE ================= */
.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #1a1a1a;
  background:#000000;
  flex-shrink: 0; /* Empêche le header de s'écraser */
  z-index:100;
}

.header-left{
  font-size:24px;
  cursor:pointer;
  width:40px;
}

.header-center{
  font-weight:700;
  font-size:18px;
}

.header-right{
  width:40px;
}

/* ================= CONTENU SCROLLABLE ================= */
.page{
  flex: 1; 
  overflow-y: auto; 
  overscroll-behavior-y: contain; 
  width: 100%;
  max-width:760px;
  margin:0 auto;
  /* 90px à la fin pour laisser la place à la barre de navigation */
  padding:20px 16px 90px 16px; 
}

.page::-webkit-scrollbar { width: 0; } /* Cache la scrollbar */

/* TITRE */
.hero{
  margin-bottom:20px;
}

.hero-title{
  font-size:28px;
  font-weight:800;
  margin-bottom:6px;
}

.hero-sub{
  font-size:14px;
  color:#aaa;
  line-height:1.5;
}

/* TAGS */
.quick-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.quick-tag{
  padding:8px 12px;
  border-radius:999px;
  background:#111;
  border:1px solid #333;
  color:#ddd;
  font-size:12px;
}

/* RECHERCHE */
.search-wrap{
  margin-bottom:18px;
}

.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:0 14px;
  min-height:52px;
}

.search-box:focus-within{
  border-color:#333; /* Reste gris foncé pour ne pas flasher */
}

.search-icon{
  width:20px;
  height:20px;
  opacity:.8;
  flex-shrink:0;
}

.search-box input{
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-size:16px;
}

.clear-btn{
  border:none;
  background:#1a1a1a;
  color:#fff;
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
  display:none;
}

.clear-btn.show{
  display:block;
}

.small-note{
  color:#777;
  font-size:12px;
  margin:8px 2px 0;
  text-align: center;
}

/* RESULTATS */
.results{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.state-card{
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:18px 14px;
  text-align:center;
  color:#aaa;
  line-height:1.5;
}

/* USER CARD */
.user-card{
  background:#111;
  border:1px solid #222;
  padding:12px;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:.2s;
}

.user-card:hover{
  background:#171717;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #333;
  background:#000;
  flex-shrink:0;
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-width:0;
}

.user-main{
  flex:1;
  min-width:0;
}

.username{
  font-weight:700;
  font-size:16px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:5px;
}

.bio{
  font-size:13px;
  color:#aaa;
  line-height:1.4;
  word-break:break-word;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* BADGES */
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:15px;
  height:15px;
  border-radius:50%;
  flex-shrink:0;
}

.badge svg{
  width:9px;
  height:9px;
}

.badge-blue{
  background:#1da1f2;
}

.badge-gold{
  background:linear-gradient(135deg,#ffd700,#ff8c00);
}

/* VIDEO PREVIEW */
.preview-box{
  width:68px;
  height:88px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #333;
  background:#0b0b0b;
  flex-shrink:0;
}

.preview-video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ================= NAV BAR MOBILE FIXE ================= */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #000;
  border-top: 1px solid #222;
  z-index: 1000;
}

.nav-btn {
  width: 40px;
  height: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.nav-btn svg {
  width: 26px;
  height: 26px;
  fill: white;
}

.upload {
  background: white;
  border-radius: 8px;
}

.upload svg {
  width: 22px;
  height: 22px;
  fill: black;
}

/* MOBILE */
@media(max-width:560px){
  .page{
    padding:18px 14px;
  }
  .hero-title{
    font-size:24px;
  }
  .user-card{
    padding:12px;
  }
  .avatar{
    width:50px;
    height:50px;
  }
  .preview-box{
    width:64px;
    height:84px;
  }
}
</style>
</head>
<body>
  
<div class="header">
  <div class="header-left" onclick="history.back()">←</div>
  <div class="header-center">Recherche</div>
  <div class="header-right"></div>
</div>

<div class="page">
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"
        stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Rechercher un utilisateur...">
      <button id="clearBtn" class="clear-btn" aria-label="Effacer">✕</button>
    </div>
    <div class="small-note">Recherche par nom d’utilisateur</div>
  </div>

  <div id="results" class="results">
    <div class="state-card">
      Commence à taper pour rechercher un utilisateur.
    </div>
  </div>
</div>

<div class="nav">
  <div class="nav-btn" onclick="go('feed.html')">
    <svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
  </div>
  <div class="nav-btn" onclick="go('search.html')">
    <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="nav-btn upload" onclick="go('upload.html')">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="black" stroke-width="2.5" stroke-linecap="round"/></svg>
  </div>
  <div class="nav-btn" onclick="go('notif.html')" id="notifIcon">
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
  </div>
  <div class="nav-btn" onclick="go('profil.html')">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  </div>
</div>
     
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  getDocs, 
  query, 
  where,
  orderBy,
  limit,
  startAt,
  endAt
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBhIdds8Q7YR_F1h6dTLWDby-OvLgArCSk",
  authDomain:"tstx-58474.firebaseapp.com",
  projectId:"tstx-58474",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const searchInput = document.getElementById("searchInput");
const results = document.getElementById("results");
const clearBtn = document.getElementById("clearBtn");

let currentUser = null;
let searchTimeout = null;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
});

function renderState(message, type = "normal"){
  let extraStyle = "";
  if(type === "error"){
    extraStyle = 'style="color:#ff4d4f;"';
  }
  results.innerHTML = `<div class="state-card" ${extraStyle}>${message}</div>`;
}

function getBadgeHTML(user){
  if (!user.verification) return "";

  if (user.verification.type === "gold" && user.verification.status === "active") {
    return `
      <span class="badge badge-gold">
        <svg viewBox="0 0 24 24" fill="black">
          <path d="M12 .587l3.668 7.431 8.2 1.193-5.934 5.782 1.402 8.177L12 18.896l-7.336 3.874 1.402-8.177L.132 9.211l8.2-1.193z"/>
        </svg>
      </span>`;
  }

  if (user.verification.type === "blue" && user.verification.expiresAt) {
    const expireDate = user.verification.expiresAt.toDate();
    if (expireDate > new Date()) {
      return `
        <span class="badge badge-blue">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M20.285 6.709l-11.025 11.025-5.545-5.545 1.414-1.414 4.131 4.131 9.611-9.611z"/>
          </svg>
        </span>`;
    }
  }

  return "";
}

function escapeHTML(str = ""){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

clearBtn.addEventListener("click", ()=>{
  searchInput.value = "";
  clearBtn.classList.remove("show");
  renderState("Commence à taper pour rechercher un utilisateur.");
  searchInput.focus();
});

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimeout);

  const rawValue = searchInput.value.trim();
  if(rawValue){
    clearBtn.classList.add("show");
  }else{
    clearBtn.classList.remove("show");
  }

  searchTimeout = setTimeout(async () => {
    const value = searchInput.value.toLowerCase().trim();
    results.innerHTML = "";

    if (!currentUser) {
      renderState("Connexion requise");
      return;
    }

    if (value === "") {
      renderState("Commence à taper pour rechercher un utilisateur.");
      return;
    }

    renderState("Recherche en cours...");

    try {
      const usersQuery = query(
        collection(db, "users"),
        orderBy("usernameLower"),
        startAt(value),
        endAt(value + "\uf8ff"),
        limit(15)
      );

      const usersSnap = await getDocs(usersQuery);

      if (usersSnap.empty) {
        renderState("Aucun utilisateur trouvé");
        return;
      }

      results.innerHTML = "";

      for (const userDoc of usersSnap.docs) {
        const user = {
          id: userDoc.id,
          ...userDoc.data()
        };

        let randomVideo = null;

        try {
          const videoQuery = query(
            collection(db, "videos"),
            where("userId", "==", user.id),
            limit(3)
          );

          const videoSnap = await getDocs(videoQuery);

          if (!videoSnap.empty) {
            const videos = videoSnap.docs;
            const randomIndex = Math.floor(Math.random() * videos.length);
            randomVideo = videos[randomIndex].data();
          }

        } catch (err) {
          console.log("Erreur video", err);
        }

        const badgeHTML = getBadgeHTML(user);

        const div = document.createElement("div");
        div.className = "user-card";

        div.innerHTML = `
          <img src="${user.avatar || 'https://i.pravatar.cc/150?u=' + user.id}" class="avatar">

          <div class="meta-row" style="flex:1;">
            <div class="user-main">
              <div class="username">
                <span>${escapeHTML(user.username || "Sans nom")}</span>
                ${badgeHTML}
              </div>
              <div class="bio">
                ${escapeHTML(user.bio || "Aucune bio")}
              </div>
            </div>

            ${
              randomVideo && randomVideo.mediaUrls?.[0]
                ? `<div class="preview-box">
                    <video src="${randomVideo.mediaUrls[0]}"
                           class="preview-video"
                           muted
                           playsinline></video>
                  </div>`
                : ``
            }
          </div>
        `;

        div.onclick = () => {
          window.location.href = `profil.html?uid=${user.id}`;
        };

        results.appendChild(div);
      }

    } catch (err) {
      console.error("Erreur recherche:", err);
      renderState("Erreur de recherche ou permissions insuffisantes", "error");
    }
  }, 300);
});

window.go = (url) => location.href = url;
</script>

</body>
</html>
